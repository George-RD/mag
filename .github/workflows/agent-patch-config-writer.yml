name: Apply config-writer patch

on:
  push:
    branches:
      - agent/mcp-new-integrations-minimal
    paths:
      - .github/workflows/agent-patch-config-writer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Patch command transport defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/config_writer.rs")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '/// Command transport: `{ "command": "/abs/path/to/mag", "args": ["serve"] }`',
              '/// Command transport: `{ "command": "/abs/path/to/mag", "args": ["serve", "--mcp-tools", "minimal"] }`',
              "command transport docs",
          )
          replace_once(
              '                "args": ["serve"]',
              '                "args": ["serve", "--mcp-tools", "minimal"]',
              "JSON command args",
          )
          replace_once(
              '                && content.contains("args = [\\"serve\\"]")',
              '                && content.contains("args = [\\"serve\\", \\"--mcp-tools\\", \\"minimal\\"]")',
              "TOML command verification",
          )
          replace_once(
              '            format!("[mcp_servers.mag]\\ncommand = \\"{binary}\\"\\nargs = [\\"serve\\"]\\n")',
              '            format!("[mcp_servers.mag]\\ncommand = \\"{binary}\\"\\nargs = [\\"serve\\", \\"--mcp-tools\\", \\"minimal\\"]\\n")',
              "TOML command rendering",
          )
          replace_once(
              '        assert_eq!(entry["args"], serde_json::json!(["serve"]));',
              '        assert_eq!(\\n            entry["args"],\\n            serde_json::json!(["serve", "--mcp-tools", "minimal"])\\n        );',
              "JSON entry test",
          )
          replace_once(
              '            assert_eq!(mag["args"], serde_json::json!(["serve"]));',
              '            assert_eq!(\\n                mag["args"],\\n                serde_json::json!(["serve", "--mcp-tools", "minimal"])\\n            );',
              "JSON persisted entry test",
          )
          replace_once(
              '            assert!(content.contains("args = [\\"serve\\"]"));',
              '            assert!(content.contains(\\n                "args = [\\\\\"serve\\\\\", \\\\\"--mcp-tools\\\\\", \\\\\"minimal\\\\\"]"\\n            ));',
              "Codex TOML test",
          )

          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-patch-config-writer.yml
          git add src/config_writer.rs
          git commit -m "refactor(setup): generate minimal MCP command configs"
          git push origin HEAD:${{ github.ref_name }}
