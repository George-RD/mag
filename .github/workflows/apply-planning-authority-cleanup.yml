name: Apply planning authority source corrections

on:
  push:
    branches:
      - docs/rationalize-stale-planning
    paths:
      - .github/workflows/apply-planning-authority-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/rationalize-stale-planning
          fetch-depth: 0
      - name: Apply source corrections
        run: python scripts/apply_planning_authority_cleanup.py
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Refresh Cairn state
        run: cairn scan
      - name: Commit source corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: mark historical plans and experimental LLM config"
          git push origin HEAD:docs/rationalize-stale-planning
