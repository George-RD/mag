name: Verify closed runtime input schema
on:
  push:
    branches: [agent/recovery-author-20260910]
    paths: [.github/workflows/recovery-schema.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2bda7c23b71a90f080ca9168c787cc1295bb4c09
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Reproduce ignored fields and lost historical notes
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/schema"
          mkdir -p "$out"
          git switch -c agent/recovery-schema-reviewed
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/runtime_behaviour_eval.rs')
          p.write_text(p.read_text() + '''
          fn assert_unknown_field_rejected(output: Output) {
              assert!(!output.status.success(), "unknown annotation field was silently accepted");
              assert!(String::from_utf8_lossy(&output.stderr).contains("unknown field"));
          }

          #[test]
          fn closed_schema_review_dataset() {
              assert_unknown_field_rejected(mutated_validation(|data| {
                  data["extra_negative_controls"] = json!([]);
              }));
          }

          #[test]
          fn closed_schema_review_manifest() {
              let directory = edited_dataset(|_, manifest| {
                  manifest["unknown_review_metadata"] = json!("not interpreted");
              });
              assert_unknown_field_rejected(run(&[
                  "--dataset", directory.path().to_str().unwrap(), "--validate-only"
              ]));
          }

          macro_rules! reject_unknown_annotation {
              ($name:ident, $field:literal) => {
                  #[test]
                  fn $name() {
                      assert_unknown_field_rejected(mutated_validation(|data| {
                          data[$field][0]["unknown_review_annotation"] = json!([]);
                      }));
                  }
              };
          }
          reject_unknown_annotation!(closed_schema_review_seed, "seed");
          reject_unknown_annotation!(closed_schema_review_entities, "entities");
          reject_unknown_annotation!(closed_schema_review_temporal, "temporal");
          reject_unknown_annotation!(closed_schema_review_relationships, "relationships");
          reject_unknown_annotation!(closed_schema_review_lifecycle, "lifecycle");
          reject_unknown_annotation!(closed_schema_review_supersession, "supersession");
          reject_unknown_annotation!(closed_schema_review_grouping, "grouping");
          reject_unknown_annotation!(closed_schema_review_provenance, "provenance");
          reject_unknown_annotation!(closed_schema_review_questions, "questions");
          reject_unknown_annotation!(closed_schema_review_unimplemented, "unimplemented");
          ''')
          p = Path('benches/runtime_behaviour/families/tests.rs')
          p.write_text(p.read_text() + '''
          #[tokio::test]
          async fn closed_schema_preserves_historical_temporal_note() {
              let (_directory, group) = discarded_seed_group().await;
              let case: crate::dataset::TemporalCase = serde_json::from_value(serde_json::json!({
                  "id": "annotated-window",
                  "query": "Amber telescope",
                  "expect_keys": ["kept"],
                  "expect_absent_keys": [],
                  "note": "Historical temporal limitation must remain visible"
              })).unwrap();
              let outcome = temporal(&group, &[case]).await.unwrap();
              assert_eq!(outcome.detail["cases"][0]["note"], "Historical temporal limitation must remain visible");
          }
          ''')
          PY
          cargo fmt --all
          git diff > "$out/tests.patch"
          if cargo test --locked --no-default-features --test runtime_behaviour_eval closed_schema_review_ > "$out/red.log" 2>&1; then
            echo 'Expected all unknown-field regressions before implementation'; exit 1
          fi
          grep -F 'test result: FAILED. 0 passed; 12 failed;' "$out/red.log"
          if cargo test --locked --no-default-features --bin memory_runtime_eval closed_schema_preserves_historical_temporal_note > "$out/note-red.log" 2>&1; then
            echo 'Expected historical note to be lost before implementation'; exit 1
          fi
          grep -F 'test result: FAILED. 0 passed; 1 failed;' "$out/note-red.log"
      - name: Close the complete historical schema and verify
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/schema"
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          p = Path('benches/runtime_behaviour/dataset.rs')
          text = p.read_text()
          needle = '    pub expect_absent_keys: Vec<String>,\n'
          assert text.count(needle) == 1
          text = text.replace(needle, needle + '    #[serde(default)]\n    pub note: Option<String>,\n')
          mapping = {'seed': 'Seed', 'entities': 'EntityCase', 'temporal': 'TemporalCase', 'relationships': 'RelationshipCase', 'lifecycle': 'LifecycleCase', 'supersession': 'SupersessionCase', 'grouping': 'GroupingCase', 'provenance': 'ProvenanceCase', 'questions': 'QuestionCase', 'unimplemented': 'UnimplementedFamily', 'dataset': 'Dataset', 'manifest': 'Manifest'}
          data = json.loads(Path('data/runtime_behaviour_eval/v1/dataset.json').read_text())
          manifest = json.loads(Path('data/runtime_behaviour_eval/v1/manifest.json').read_text())
          for key, name in mapping.items():
              body = re.search(r'pub struct ' + name + r' \{(.*?)\n\}', text, re.S).group(1)
              fields = set(re.findall(r'pub (\w+):', body))
              rows = [data] if key == 'dataset' else [manifest] if key == 'manifest' else data[key]
              assert all(set(row) <= fields for row in rows), name + ' omits historical fields'
              needle = 'pub struct ' + name + ' {'
              assert text.count(needle) == 1
              text = text.replace(needle, '#[serde(deny_unknown_fields)]\n' + needle)
          p.write_text(text)
          p = Path('benches/runtime_behaviour/families/read.rs')
          text = p.read_text()
          needle = '            "false_inclusions": leaked,\n'
          assert text.count(needle) == 1
          p.write_text(text.replace(needle, needle + '            "note": case.note,\n'))
          p = Path('benches/runtime_behaviour/README.md')
          p.write_text(p.read_text() + '\nVersion-1 input structs are closed: dataset, manifest, seed, every annotation family and historical-unimplemented entries reject unknown fields. An added or misspelled annotation cannot be silently accepted with 100% schema validity. The original temporal notes are explicitly typed and included in per-case output, not discarded. Optional documented fields remain optional; extensions require an explicit supported schema change.\n')
          PY
          cargo fmt --all
          cargo test --locked --no-default-features --bin memory_runtime_eval --test runtime_behaviour_eval > "$out/placeholder.log" 2>&1 || { tail -100 "$out/placeholder.log"; exit 1; }
          cargo test --locked --bin memory_runtime_eval --test runtime_behaviour_eval > "$out/default.log" 2>&1 || { tail -100 "$out/default.log"; exit 1; }
          cargo clippy --locked --all-targets --all-features -- -D warnings > "$out/clippy.log" 2>&1 || { tail -100 "$out/clippy.log"; exit 1; }
          cargo fmt --all -- --check
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('meta/reviews/runtime-behaviour-recovery.md')
          p.write_text(p.read_text() + '\n## Closed versioned input\n\nCodex comment 3985784432 identified Serde silently discarding unknown fields. Run ' + os.environ['GITHUB_RUN_ID'] + ' first reproduces twelve independent process failures (dataset, manifest and every nested input struct) using checksum-valid mutations, plus a runtime regression for lost temporal notes. All input structs now use deny_unknown_fields. The first attempt, run 34560986734, exposed an existing unmodeled TemporalCase.note field and failed against the original corpus; it was not a successful verification. A systematic comparison of every original input key with the typed fields found only that omission. The legitimate optional note is now modeled and included in per-case temporal output, with original bytes unchanged. The complete default and feature-free diagnostic tests, strict Clippy and formatting pass. This affects only the diagnostic input contract, not production parsing or model behaviour. Final-head CI and renewed independent review remain required before merge.\n')
          PY
          git diff --exit-code -- src data/runtime_behaviour_eval/v1 benches/runtime_behaviour/baselines
          git config user.name George
          git config user.email 180932462+George-RD@users.noreply.github.com
          git add benches/runtime_behaviour/dataset.rs benches/runtime_behaviour/families/read.rs benches/runtime_behaviour/families/tests.rs benches/runtime_behaviour/README.md tests/runtime_behaviour_eval.rs meta/reviews/runtime-behaviour-recovery.md
          git diff --cached --check
          test -z "$(git diff --name-only)"
          git commit -m 'fix(eval): close diagnostic inputs while preserving historical notes'
          git rev-parse HEAD HEAD^{tree} > "$out/source.txt"
          git bundle create "$out/schema.bundle" agent/recovery-schema-reviewed
      - name: Run exact committed BGE diagnostic once
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/schema"
          cargo build --locked --release --bin memory_runtime_eval > "$out/build.log" 2>&1 || { tail -100 "$out/build.log"; exit 1; }
          export MAG_DATA_ROOT="$RUNNER_TEMP/schema-model-data"
          timeout 300 ./target/release/memory_runtime_eval --embedder bge-small --json > "$out/bge-run.json" 2> "$out/bge-stderr.log"
          sha256sum target/release/memory_runtime_eval > "$out/binary.sha256"
          python3 - "$out" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          result = json.loads((out / 'bge-run.json').read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert result['metadata']['commit'] == head
          assert result['schema_validity_percentage'] == 100 and result['embedding_dimension'] == 384
          assert result['seeded_memories'] == 36 and len(result['families']) == 8
          assert result['tokens'] is None and 'overall_percentage' not in result
          archive = Path('benches/runtime_behaviour/baselines/2026-09-10-bge-small/run.json')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '3f21b208374e6543287723ca90a1ce9b3e31d316e06a7d3540d002da35a3e7c6'
          (out / 'README.txt').write_text('Once-only exact-source release smoke. No score threshold, favorable rerun, held-out qualification, controlled performance comparison or source-to-binary attestation. Original corpus and archived observation unchanged.\n')
          print('Exact source:', head, 'seeded:', result['seeded_memories'], 'retained:', result['retained_memories'])
          PY
      - name: Publish verified candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/agent/recovery-schema-reviewed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-schema-review
          path: ${{ runner.temp }}/schema/
          retention-days: 14
          if-no-files-found: error
