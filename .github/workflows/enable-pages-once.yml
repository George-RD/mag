name: Verify MAG GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/enable-pages-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed site
        shell: bash
        run: |
          set -u
          url="https://george-rd.github.io/mag/"
          for attempt in $(seq 1 18); do
            status=$(curl -L -sS -o /tmp/mag-page.html -w '%{http_code}' "$url" || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ] && grep -Fq "Switch AI tools" /tmp/mag-page.html; then
              echo "MAG Pages site is live: $url"
              exit 0
            fi
            sleep 10
          done
          echo "MAG Pages site is not live at $url"
          if [ -f /tmp/mag-page.html ]; then
            head -c 500 /tmp/mag-page.html || true
          fi
          exit 1
