name: Complete list and relations runtime migration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  implement:
    if: >-
      github.event.pull_request.head.ref == 'agent/cli-list-relations-runtime' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cli-list-relations-runtime
      - name: Route list and relations through the local runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path("src/local_memory_runtime.rs")
          runtime = runtime_path.read_text()
          old_runtime_import = (
              "use crate::memory_core::{\n"
              "    AdvancedSearcher, Deleter, Embedder, MemoryInput, MemoryUpdate, Pipeline, PlaceholderPipeline,\n"
              "    SearchOptions, SearchResult, SemanticResult,\n"
              "};\n"
          )
          new_runtime_import = (
              "use crate::memory_core::{\n"
              "    AdvancedSearcher, Deleter, Embedder, ListResult, Lister, MemoryInput, MemoryUpdate, Pipeline,\n"
              "    PlaceholderPipeline, Relationship, RelationshipQuerier, SearchOptions, SearchResult,\n"
              "    SemanticResult,\n"
              "};\n"
          )
          if runtime.count(old_runtime_import) != 1:
              raise SystemExit("expected one local runtime import block")
          runtime = runtime.replace(old_runtime_import, new_runtime_import)

          runtime_marker = (
              "    /// Runs the current basic search implementation.\n"
              "    pub async fn search(\n"
          )
          runtime_methods = (
              "    /// Lists stored memories without changing pagination or filter semantics.\n"
              "    pub async fn list(\n"
              "        &self,\n"
              "        offset: usize,\n"
              "        limit: usize,\n"
              "        options: &SearchOptions,\n"
              "    ) -> Result<ListResult> {\n"
              "        self.storage.list(offset, limit, options).await\n"
              "    }\n\n"
              "    /// Returns stored relationships without changing ordering or payload semantics.\n"
              "    pub async fn get_relationships(&self, memory_id: &str) -> Result<Vec<Relationship>> {\n"
              "        self.storage.get_relationships(memory_id).await\n"
              "    }\n\n"
              "    /// Runs the current basic search implementation.\n"
              "    pub async fn search(\n"
          )
          if runtime.count(runtime_marker) != 1:
              raise SystemExit("expected one local runtime search marker")
          runtime = runtime.replace(runtime_marker, runtime_methods)
          runtime_path.write_text(runtime)

          main_path = Path("src/main.rs")
          main = main_path.read_text()
          old_main_import = (
              "    ExpirationSweeper, FeedbackRecorder, GraphTraverser, LessonQuerier, Lister, MaintenanceManager,\n"
              "    MemoryInput, MemoryUpdate, PhraseSearcher, ProfileManager, RelationshipQuerier,\n"
          )
          new_main_import = (
              "    ExpirationSweeper, FeedbackRecorder, GraphTraverser, LessonQuerier, MaintenanceManager,\n"
              "    MemoryInput, MemoryUpdate, PhraseSearcher, ProfileManager,\n"
          )
          if main.count(old_main_import) != 1:
              raise SystemExit("expected one main trait import block")
          main = main.replace(old_main_import, new_main_import)

          old_list = (
              "            let result = mcp_storage.list(*offset, *limit, &opts).await?;\n"
              "            info!(\n"
              "                count = result.memories.len(),\n"
              "                total = result.total,\n"
              "                \"List completed\"\n"
              "            );\n"
          )
          new_list = (
              "            let result = local_runtime.list(*offset, *limit, &opts).await?;\n"
              "            info!(\n"
              "                count = result.memories.len(),\n"
              "                total = result.total,\n"
              "                \"Listed through local memory runtime\"\n"
              "            );\n"
          )
          if main.count(old_list) != 1:
              raise SystemExit("expected one list caller block")
          main = main.replace(old_list, new_list)

          old_relations = (
              "            let rels = mcp_storage.get_relationships(id).await?;\n"
              "            info!(count = rels.len(), \"Relationships retrieved\");\n"
          )
          new_relations = (
              "            let rels = local_runtime.get_relationships(id).await?;\n"
              "            info!(\n"
              "                count = rels.len(),\n"
              "                \"Relationships retrieved through local memory runtime\"\n"
              "            );\n"
          )
          if main.count(old_relations) != 1:
              raise SystemExit("expected one relations caller block")
          main = main.replace(old_relations, new_relations)
          main_path.write_text(main)

          parity_path = Path("tests/local_memory_runtime.rs")
          parity = parity_path.read_text()
          old_test_import = (
              "    AdvancedSearcher, Deleter, EventType, MemoryInput, MemoryUpdate, Pipeline, PlaceholderEmbedder,\n"
              "    PlaceholderPipeline, SearchOptions,\n"
          )
          new_test_import = (
              "    AdvancedSearcher, Deleter, EventType, Lister, MemoryInput, MemoryUpdate, Pipeline,\n"
              "    PlaceholderEmbedder, PlaceholderPipeline, RelationshipQuerier, SearchOptions,\n"
          )
          if parity.count(old_test_import) != 1:
              raise SystemExit("expected one runtime parity import block")
          parity = parity.replace(old_test_import, new_test_import)

          parity_marker = (
              "    assert_eq!(runtime_updated, legacy_updated);\n"
              "    assert_eq!(runtime_updated, updated_content);\n\n"
              "    let runtime_deleted = runtime.delete(&runtime_id).await.unwrap();\n"
          )
          parity_checks = (
              "    assert_eq!(runtime_updated, legacy_updated);\n"
              "    assert_eq!(runtime_updated, updated_content);\n\n"
              "    let runtime_list = runtime.list(0, 10, &options).await.unwrap();\n"
              "    let direct_list = legacy_storage.list(0, 10, &options).await.unwrap();\n"
              "    assert_eq!(runtime_list, direct_list);\n"
              "    assert_eq!(runtime_list.total, 1);\n"
              "    assert_eq!(runtime_list.memories[0].id, runtime_id);\n\n"
              "    let runtime_relations = runtime.get_relationships(&runtime_id).await.unwrap();\n"
              "    let direct_relations = legacy_storage\n"
              "        .get_relationships(&legacy_id)\n"
              "        .await\n"
              "        .unwrap();\n"
              "    assert_eq!(runtime_relations, direct_relations);\n"
              "    assert!(runtime_relations.is_empty());\n\n"
              "    let runtime_deleted = runtime.delete(&runtime_id).await.unwrap();\n"
          )
          if parity.count(parity_marker) != 1:
              raise SystemExit("expected one runtime parity insertion point")
          parity = parity.replace(parity_marker, parity_checks)
          parity_path.write_text(parity)

          todo_path = Path("meta/todos/migrate-cli-to-local-memory-runtime.md")
          todo = todo_path.read_text()
          old_todo = "- [ ] Migrate `list` and the remaining basic CRUD/relationship callers.\n"
          new_todo = (
              "- [x] `list` and `relations` route through `LocalMemoryRuntime`; pagination,\n"
              "  filters, exact compact JSON, relationship output, and direct-storage parity\n"
              "  remain pinned at caller and facade levels.\n"
          )
          if todo.count(old_todo) != 1:
              raise SystemExit("expected one list and relations todo")
          todo_path.write_text(todo.replace(old_todo, new_todo))
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Refresh and verify Cairn state
        shell: bash
        run: |
          set +e
          cairn scan
          scan_status=$?
          set -e
          if [ "$scan_status" -gt 1 ]; then
            exit "$scan_status"
          fi
          cairn hook all
      - name: Commit the completed slice and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/agent-list-relations-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs src/local_memory_runtime.rs tests/local_memory_runtime.rs \
            meta/todos/migrate-cli-to-local-memory-runtime.md .cairn \
            .github/workflows/agent-list-relations-runtime.yml
          git diff --cached --check
          git commit -m "refactor(cli): route list and relations through local runtime"
          git push origin HEAD:agent/cli-list-relations-runtime
