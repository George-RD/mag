name: Apply maintenance runtime migration

on:
  push:
    branches:
      - agent/migrate-cli-maintain-runtime
    paths:
      - .github/workflows/agent-apply-maintain-runtime.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-apply-maintain-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/migrate-cli-maintain-runtime
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply runtime migration
        shell: python
        run: |
          import re
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return updated

          runtime_path = Path("src/local_memory_runtime.rs")
          runtime = runtime_path.read_text()
          runtime = replace_once(
              runtime,
              "use std::path::PathBuf;",
              "use std::path::{Path, PathBuf};",
              "runtime path import",
          )
          runtime = replace_once(
              runtime,
              "AdvancedSearcher, CheckpointInput,",
              "AdvancedSearcher, BackupInfo, BackupManager, CheckpointInput,",
              "runtime backup imports",
          )
          runtime = replace_once(
              runtime,
              "ListResult, Lister, MemoryInput,",
              "ListResult, Lister, MaintenanceManager, MemoryInput,",
              "runtime maintenance import",
          )
          runtime = replace_once(
              runtime,
              """    /// Runs the current basic search implementation.
              pub async fn search(""",
              """    /// Checks the local database without changing thresholds or health fields.
              pub async fn check_health(
                  &self,
                  warn_mb: f64,
                  critical_mb: f64,
                  max_nodes: i64,
              ) -> Result<serde_json::Value> {
                  self.storage
                      .check_health(warn_mb, critical_mb, max_nodes)
                      .await
              }

              /// Consolidates stale memories without changing pruning or summary semantics.
              pub async fn consolidate(
                  &self,
                  prune_days: i64,
                  max_summaries: i64,
              ) -> Result<serde_json::Value> {
                  self.storage.consolidate(prune_days, max_summaries).await
              }

              /// Compacts near-duplicates without changing clustering or dry-run semantics.
              pub async fn compact(
                  &self,
                  event_type: &str,
                  similarity_threshold: f64,
                  min_cluster_size: usize,
                  dry_run: bool,
              ) -> Result<serde_json::Value> {
                  self.storage
                      .compact(
                          event_type,
                          similarity_threshold,
                          min_cluster_size,
                          dry_run,
                      )
                      .await
              }

              /// Clears one session without changing relationship cleanup semantics.
              pub async fn clear_session(&self, session_id: &str) -> Result<usize> {
                  self.storage.clear_session(session_id).await
              }

              /// Rebuilds FTS without changing index reconstruction or result fields.
              pub async fn rebuild_fts(&self) -> Result<serde_json::Value> {
                  self.storage.rebuild_fts().await
              }

              /// Creates a database backup without changing its format or metadata.
              pub async fn create_backup(&self) -> Result<BackupInfo> {
                  self.storage.create_backup().await
              }

              /// Rotates backups without changing ordering or retention semantics.
              pub async fn rotate_backups(&self, max_count: usize) -> Result<usize> {
                  self.storage.rotate_backups(max_count).await
              }

              /// Lists backups without changing ordering or metadata fields.
              pub async fn list_backups(&self) -> Result<Vec<BackupInfo>> {
                  self.storage.list_backups().await
              }

              /// Restores a backup without changing the safety-backup contract.
              pub async fn restore_backup(&self, backup_path: &Path) -> Result<()> {
                  self.storage.restore_backup(backup_path).await
              }

              /// Runs the existing automatic startup-backup policy.
              pub async fn maybe_startup_backup(&self) -> Result<Option<BackupInfo>> {
                  self.storage.maybe_startup_backup().await
              }

              /// Runs the current basic search implementation.
              pub async fn search(""",
              "runtime maintenance delegates",
          )
          runtime_path.write_text(runtime)

          main_path = Path("src/main.rs")
          main = main_path.read_text()
          main = replace_once(
              main,
              "BackupManager, CheckpointInput,",
              "CheckpointInput,",
              "main backup import",
          )
          main = replace_once(
              main,
              "EventType, MaintenanceManager, MemoryInput,",
              "EventType, MemoryInput,",
              "main maintenance import",
          )
          main = replace_once(
              main,
              """    let sqlite_storage = SqliteStorage::new(storage_mode, Arc::clone(&embedder))?;

              // Automatic startup backup (file-backed DBs only, max every 24h)
              if let Err(e) = <SqliteStorage as BackupManager>::maybe_startup_backup(&sqlite_storage).await {
                  tracing::warn!("startup backup failed (non-fatal): {e}");
              }

              let local_runtime = LocalMemoryRuntime::from_storage(sqlite_storage.clone());
              let mcp_storage = sqlite_storage.clone();""",
              """    let sqlite_storage = SqliteStorage::new(storage_mode, Arc::clone(&embedder))?;
              let local_runtime = LocalMemoryRuntime::from_storage(sqlite_storage.clone());

              // Automatic startup backup (file-backed DBs only, max every 24h)
              if let Err(e) = local_runtime.maybe_startup_backup().await {
                  tracing::warn!("startup backup failed (non-fatal): {e}");
              }

              let mcp_storage = sqlite_storage.clone();""",
              "startup backup routing",
          )
          replacements = [
              (
                  r"<SqliteStorage as MaintenanceManager>::check_health\(\s*&mcp_storage,\s*",
                  "local_runtime.check_health(",
                  "health routing",
              ),
              (
                  r"<SqliteStorage as MaintenanceManager>::consolidate\(\s*&mcp_storage,\s*",
                  "local_runtime.consolidate(",
                  "consolidate routing",
              ),
              (
                  r"<SqliteStorage as MaintenanceManager>::compact\(\s*&mcp_storage,\s*",
                  "local_runtime.compact(",
                  "compact routing",
              ),
              (
                  r"<SqliteStorage as MaintenanceManager>::clear_session\(\s*&mcp_storage,\s*sid\s*\)",
                  "local_runtime.clear_session(sid)",
                  "clear-session routing",
              ),
              (
                  r"<SqliteStorage as MaintenanceManager>::rebuild_fts\(\s*&mcp_storage\s*\)",
                  "local_runtime.rebuild_fts()",
                  "FTS routing",
              ),
              (
                  r"<SqliteStorage as BackupManager>::create_backup\(\s*&mcp_storage\s*\)",
                  "local_runtime.create_backup()",
                  "backup creation routing",
              ),
              (
                  r"<SqliteStorage as BackupManager>::rotate_backups\(\s*&mcp_storage,\s*5\s*\)",
                  "local_runtime.rotate_backups(5)",
                  "backup rotation routing",
              ),
              (
                  r"<SqliteStorage as BackupManager>::list_backups\(\s*&mcp_storage\s*\)",
                  "local_runtime.list_backups()",
                  "backup listing routing",
              ),
              (
                  r"<SqliteStorage as BackupManager>::restore_backup\(\s*&mcp_storage,\s*path\s*\)",
                  "local_runtime.restore_backup(path)",
                  "backup restore routing",
              ),
          ]
          for pattern, replacement, label in replacements:
              main = sub_once(main, pattern, replacement, label)
          main_path.write_text(main)

          test_path = Path("tests/cli_maintain_runtime_migration.rs")
          test = test_path.read_text()
          test = replace_once(
              test,
              """    let runtime_path = temp.path().join("runtime.db");
              let direct_path = temp.path().join("direct.db");""",
              """    let runtime_dir = temp.path().join("runtime");
              let direct_dir = temp.path().join("direct");
              std::fs::create_dir_all(&runtime_dir)?;
              std::fs::create_dir_all(&direct_dir)?;
              let runtime_path = runtime_dir.join("memory.db");
              let direct_path = direct_dir.join("memory.db");""",
              "isolated backup fixtures",
          )
          test_path.write_text(test)

          todo_path = Path("meta/todos/migrate-cli-to-local-memory-runtime.md")
          todo = todo_path.read_text()
          todo = replace_once(
              todo,
              "status: in_progress",
              "status: done",
              "CLI migration todo status",
          )
          todo = replace_once(
              todo,
              "- [ ] Migrate `maintain` actions as a separate risk-bounded family.",
              """- [x] Automatic startup backup and all `maintain` actions route through
            `LocalMemoryRuntime`; thresholds, pruning, compaction, session cleanup, FTS
            rebuilding, backup metadata, rotation, listing, restore state, and exact CLI
            JSON remain pinned by caller-level and direct-storage parity tests.""",
              "CLI migration todo",
          )
          todo_path.write_text(todo)

      - name: Format and run the focused contract
        run: |
          cargo fmt --all
          cargo test --quiet --all-features --test cli_maintain_runtime_migration
          git diff --check

      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Reconcile and verify Cairn
        run: |
          cairn scan
          cairn hook all

      - name: Commit verified implementation
        run: |
          git rm .github/workflows/agent-apply-maintain-runtime.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(cli): route maintenance through local runtime"
          git push origin HEAD:agent/migrate-cli-maintain-runtime
