name: Finish setup transport fix

on:
  push:
    branches:
      - fix/setup-command-transport
    paths:
      - .github/workflows/finish-setup-transport-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/setup-command-transport
          fetch-depth: 0
      - name: Apply cleanup
        run: python scripts/finish_setup_transport_fix.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(setup): update full-flow fixture for command-only mode"
          git push origin HEAD:fix/setup-command-transport
