name: Apply setup transport implementation

on:
  push:
    branches:
      - fix/setup-command-transport
    paths:
      - .github/workflows/apply-setup-transport-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/setup-command-transport
          fetch-depth: 0
      - name: Apply implementation
        run: python scripts/apply_setup_transport_fix.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(setup): reject unavailable transports before writes"
          git push origin HEAD:fix/setup-command-transport
