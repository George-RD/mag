name: Agent fix MCP admin runtime leftovers

on:
  push:
    branches:
      - agent/migrate-mcp-admin-runtime
    paths:
      - .github/workflows/agent-fix-mcp-admin-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/migrate-mcp-admin-runtime
          fetch-depth: 0

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Fix incomplete admin delegate migration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/mcp/tools/facades.rs")
          text = path.read_text()

          replacements = {
              "FeedbackRecorder, GraphTraverser, LessonQuerier, Lister, MaintenanceManager, MemoryUpdate,":
                  "FeedbackRecorder, GraphTraverser, LessonQuerier, MaintenanceManager, MemoryUpdate,",
              "ProfileManager, Recents, RelationshipQuerier, ReminderManager, Retriever, SearchOptions,":
                  "ProfileManager, RelationshipQuerier, ReminderManager, Retriever, SearchOptions,",
              "    StatsProvider, Updater, VersionChainQuerier, WelcomeProvider, is_valid_event_type,":
                  "    Updater, VersionChainQuerier, WelcomeProvider, is_valid_event_type,",
              "            let export_data = storage\n": "            let export_data = runtime\n",
              "            let count = storage\n": "            let count = runtime\n",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          cargo fmt --all
          rm .github/workflows/agent-fix-mcp-admin-runtime.yml

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(mcp): finish admin runtime delegation"
          git push origin HEAD:agent/migrate-mcp-admin-runtime
