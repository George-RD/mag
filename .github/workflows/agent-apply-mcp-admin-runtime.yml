name: Agent apply MCP admin runtime migration

on:
  push:
    branches:
      - agent/migrate-mcp-admin-runtime
    paths:
      - .github/workflows/agent-apply-mcp-admin-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/migrate-mcp-admin-runtime
          fetch-depth: 0

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply bounded runtime migration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old!r}")
              path.write_text(text.replace(old, new, 1))

          mcp = Path("src/mcp/mod.rs")
          replace_once(
              mcp,
              "use std::fmt::Write as _;\n",
              "use std::{fmt::Write as _, sync::Arc};\n",
          )
          replace_once(
              mcp,
              "use crate::memory_core::storage::SqliteStorage;\n",
              "use crate::LocalMemoryRuntime;\nuse crate::memory_core::storage::SqliteStorage;\n",
          )
          replace_once(
              mcp,
              """pub struct McpMemoryServer {
              storage: SqliteStorage,
              tool_router: ToolRouter<Self>,
              tool_mode: McpToolMode,
          }
          """,
              """pub struct McpMemoryServer {
              storage: SqliteStorage,
              runtime: Arc<LocalMemoryRuntime>,
              tool_router: ToolRouter<Self>,
              tool_mode: McpToolMode,
          }
          """,
          )
          replace_once(
              mcp,
              """    pub fn new(storage: SqliteStorage) -> Self {
                  Self {
                      storage,
                      tool_router: Self::tool_router(),
                      tool_mode: McpToolMode::Full,
                  }
              }
          """,
              """    pub fn new(storage: SqliteStorage) -> Self {
                  let runtime = Arc::new(LocalMemoryRuntime::from_storage(storage.clone()));
                  Self {
                      storage,
                      runtime,
                      tool_router: Self::tool_router(),
                      tool_mode: McpToolMode::Full,
                  }
              }
          """,
          )
          replace_once(
              mcp,
              "tools::facades::memory_admin(&self.storage, &params.0).await",
              "tools::facades::memory_admin(self.runtime.as_ref(), &params.0).await",
          )

          facades = Path("src/mcp/tools/facades.rs")
          replace_once(
              facades,
              "use crate::memory_core::storage::SqliteStorage;\n",
              "use crate::LocalMemoryRuntime;\nuse crate::memory_core::storage::SqliteStorage;\n",
          )
          text = facades.read_text()
          marker = "pub(crate) async fn memory_admin("
          start = text.index(marker)
          prefix, admin = text[:start], text[start:]
          signature = """pub(crate) async fn memory_admin(
              storage: &SqliteStorage,
              req: &MemoryAdminFacadeRequest,
          ) -> Result<CallToolResult, McpError> {
          """
          if admin.count(signature) != 1:
              raise SystemExit("legacy memory_admin signature was not found exactly once")
          admin = admin.replace(
              signature,
              """pub(crate) async fn memory_admin(
              runtime: &LocalMemoryRuntime,
              req: &MemoryAdminFacadeRequest,
          ) -> Result<CallToolResult, McpError> {
          """,
              1,
          )
          admin = admin.replace("storage.", "runtime.")
          facades.write_text(prefix + admin)

          todo = Path("meta/todos/migrate-mcp-to-local-memory-runtime.md")
          replace_once(todo, "status: blocked\n", "status: in_progress\n")
          replace_once(
              todo,
              """Blocked by `todo.introduce-local-memory-runtime-facade` and the relevant stable
          runtime capability slices.
          """,
              """The runtime facade and all CLI command families are complete. MCP migration is
          now in progress by bounded tool family so each slice can preserve protocol behaviour
          independently.
          """,
          )
          with todo.open("a") as handle:
              handle.write(
                  """

          ## Progress

          - [x] Compose `LocalMemoryRuntime` once inside `McpMemoryServer` and route the
            unified `memory_admin` facade through it. Full and minimal tool advertisement,
            exact basic-health JSON, created-order list state, invalid-sort validation, and
            missing import-data validation remain pinned. The server temporarily retains its
            shared SQLite clone for MCP tool families that have not migrated yet.
          """
              )
          PY

          cargo fmt --all
          rm .github/workflows/agent-apply-mcp-admin-runtime.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor(mcp): route unified admin through local runtime"
          git push origin HEAD:agent/migrate-mcp-admin-runtime
