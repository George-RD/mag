name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate static site
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import struct
          import xml.etree.ElementTree as ET

          site = Path("site")
          pages = [
              site / "index.html",
              site / "demos" / "index.html",
              site / "demos" / "retrieval-pipeline.html",
              site / "demos" / "cross-tool-handoff.html",
              site / "demos" / "abstention.html",
          ]
          required = pages + [
              site / "assets" / "benchmark.svg",
              site / "assets" / "context-flow.svg",
              site / "assets" / "favicon.svg",
              site / "assets" / "pipeline.svg",
              site / "assets" / "readme-header.svg",
              site / "assets" / "og-card.png",
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit("Missing site files: " + ", ".join(missing))

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.lang = False
                  self.title = False
                  self.description = False
                  self._in_title = False

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "html" and values.get("lang"):
                      self.lang = True
                  if tag == "title":
                      self._in_title = True
                  if tag == "meta" and values.get("name") == "description" and values.get("content"):
                      self.description = True

              def handle_endtag(self, tag):
                  if tag == "title":
                      self._in_title = False

              def handle_data(self, data):
                  if self._in_title and data.strip():
                      self.title = True

          for page in pages:
              parser = Parser()
              parser.feed(page.read_text(encoding="utf-8"))
              if not all((parser.lang, parser.title, parser.description)):
                  raise SystemExit(f"{page} is missing lang, title, or description metadata")

          for svg in sorted((site / "assets").glob("*.svg")):
              ET.parse(svg)

          animated = site / "assets" / "pipeline.svg"
          markup = animated.read_text(encoding="utf-8")
          for needed in ("<title", "<desc", "prefers-reduced-motion"):
              if needed not in markup:
                  raise SystemExit(f"pipeline.svg is missing {needed}")
          for banned in ("<animate", "xlink:href", "<image"):
              if banned in markup:
                  raise SystemExit(f"pipeline.svg must not contain {banned}")

          png = (site / "assets" / "og-card.png").read_bytes()
          if png[:8] != b"\x89PNG\r\n\x1a\n" or len(png) < 2_000:
              raise SystemExit("Open Graph image is not a valid PNG payload")
          width, height = struct.unpack(">II", png[16:24])
          if (width, height) != (1200, 630):
              raise SystemExit(f"Open Graph image must be 1200x630, got {width}x{height}")

          print("Static site validation passed")
          PY

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Publish site to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          publish_dir=$(mktemp -d)
          cp -a site/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"

          cd "$publish_dir"
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Verify public site
        shell: bash
        run: |
          set -u
          url="https://george-rd.github.io/mag/"
          for attempt in $(seq 1 18); do
            status=$(curl -L -sS -o /tmp/mag-page.html -w '%{http_code}' "$url" || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ] && grep -Fq "Switch AI tools" /tmp/mag-page.html; then
              echo "MAG Pages site is live: $url"
              exit 0
            fi
            sleep 10
          done
          echo "MAG Pages verification failed: $url"
          exit 1
