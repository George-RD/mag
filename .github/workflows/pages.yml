name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "scripts/validate_site.py"
      - "tests/test_validate_site.py"
      - "tests/test_site_demos.py"
      - "tests/test_demo_player_lifecycle.py"
      - "tests/test_demo_observation.py"
      - "scripts/capture_demo_cli.py"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "scripts/validate_site.py"
      - "tests/test_validate_site.py"
      - "tests/test_site_demos.py"
      - "tests/test_demo_player_lifecycle.py"
      - "tests/test_demo_observation.py"
      - "scripts/capture_demo_cli.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate static site and evidence
        run: |
          python3 scripts/validate_site.py
          python3 -m unittest tests.test_validate_site tests.test_demo_observation -v
          node --check site/assets/demo-player.js
      - name: Test walkthroughs in Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/site-venv"
          . "$RUNNER_TEMP/site-venv/bin/activate"
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
          python -m unittest tests.test_site_demos -v

  publish:
    permissions:
      contents: write
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Publish site to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          publish_dir=$(mktemp -d)
          cp -a site/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"

          cd "$publish_dir"
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Verify public site
        shell: bash
        run: |
          set -u
          url="https://george-rd.github.io/mag/"
          for attempt in $(seq 1 18); do
            status=$(curl -L -sS -o /tmp/mag-page.html -w '%{http_code}' "$url" || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ] && grep -Fq "Switch AI tools" /tmp/mag-page.html; then
              echo "MAG Pages site is live: $url"
              exit 0
            fi
            sleep 10
          done
          echo "MAG Pages verification failed: $url"
          exit 1
