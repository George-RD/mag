name: Clean doctor recheck implementation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/agent-clean-doctor-recheck.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/doctor-post-fix-recheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Rewrite doctor as a small two-pass orchestrator
        shell: bash
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:src/main.rs > src/main.rs
          python - <<'PY'
          from pathlib import Path

          path = Path("src/main.rs")
          source = path.read_text()

          start_old = '''async fn run_doctor(fix: bool) -> anyhow::Result<()> {
              let mut results: Vec<CheckResult> = Vec::new();
          '''
          start_new = '''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          enum DoctorPassOutcome {
              Complete,
              Recheck,
          }

          async fn run_doctor(fix: bool) -> anyhow::Result<()> {
              let mut run_state = doctor_checks::DoctorRunState::Initial;
              loop {
                  match run_doctor_pass(fix, run_state).await? {
                      DoctorPassOutcome::Complete => return Ok(()),
                      DoctorPassOutcome::Recheck => run_state = run_state.after_fixes(),
                  }
              }
          }

          async fn run_doctor_pass(
              fix: bool,
              run_state: doctor_checks::DoctorRunState,
          ) -> anyhow::Result<DoctorPassOutcome> {
              let mut results: Vec<CheckResult> = Vec::new();
          '''
          if start_old not in source:
              raise SystemExit("doctor start marker not found")
          source = source.replace(start_old, start_new, 1)

          ready_old = '''        println!("\\n{ok_count}/{total} checks passed{warn_suffix}. MAG is ready.");
              return Ok(());
          '''
          ready_new = '''        println!("\\n{ok_count}/{total} checks passed{warn_suffix}. MAG is ready.");
              return Ok(DoctorPassOutcome::Complete);
          '''
          if ready_old not in source:
              raise SystemExit("doctor ready marker not found")
          source = source.replace(ready_old, ready_new, 1)

          prompt_old = "    if fix {\n"
          prompt_new = "    if run_state.allows_fixes() && fix {\n"
          if prompt_old not in source:
              raise SystemExit("automatic prompt marker not found")
          source = source.replace(prompt_old, prompt_new, 1)

          interactive_old = "    } else if std::io::IsTerminal::is_terminal(&std::io::stdin()) {\n"
          interactive_new = "    } else if run_state.allows_fixes() && std::io::IsTerminal::is_terminal(&std::io::stdin()) {\n"
          if interactive_old not in source:
              raise SystemExit("interactive prompt marker not found")
          source = source.replace(interactive_old, interactive_new, 1)

          hint_old = "    } else if !auto_fixable.is_empty() {\n"
          hint_new = "    } else if run_state.allows_fixes() && !auto_fixable.is_empty() {\n"
          if hint_old not in source:
              raise SystemExit("non-interactive hint marker not found")
          source = source.replace(hint_old, hint_new, 1)

          automatic_apply = "        apply_doctor_fixes(&auto_fixable).await?;\n"
          automatic_new = automatic_apply + '''        if !auto_fixable.is_empty() {
              return Ok(DoctorPassOutcome::Recheck);
          }
          '''
          if automatic_apply not in source:
              raise SystemExit("automatic fix call not found")
          source = source.replace(automatic_apply, automatic_new, 1)

          interactive_apply = "            apply_doctor_fixes(&auto_fixable).await?;\n"
          interactive_new = interactive_apply + '''            if !auto_fixable.is_empty() {
                  return Ok(DoctorPassOutcome::Recheck);
              }
          '''
          if interactive_apply not in source:
              raise SystemExit("interactive fix call not found")
          source = source.replace(interactive_apply, interactive_new, 1)

          final_old = '''    let hard_failures: Vec<_> = failures
              .iter()
              .filter(|r| r.status == CheckStatus::Fail)
              .collect();
          if hard_failures.is_empty() {
              Ok(())
          } else {
              anyhow::bail!(
                  "{} doctor check(s) failed. See above for details.",
                  hard_failures.len()
              );
          }
          }
          '''
          final_new = '''    anyhow::bail!(
              "{} doctor check(s) failed. See above for details.",
              failures.len()
          );
          }
          '''
          if final_old not in source:
              raise SystemExit("doctor finalization marker not found")
          source = source.replace(final_old, final_new, 1)

          path.write_text(source)
          PY
      - name: Format and run focused regression
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --quiet --all-features post_fix_pass_disables_a_second_fix_attempt
      - name: Commit cleanup and remove helper workflow
        shell: bash
        run: |
          git config user.name "George"
          git config user.email "180932462+George-RD@users.noreply.github.com"
          git rm .github/workflows/agent-clean-doctor-recheck.yml
          git add src/main.rs
          git diff --cached --check
          git commit -m "refactor(doctor): isolate recheck orchestration"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
