name: Apply reminders runtime migration

on:
  push:
    branches:
      - agent/migrate-cli-reminders-runtime
    paths:
      - .github/workflows/agent-apply-reminders-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/migrate-cli-reminders-runtime
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify the caller regression is red before migration
        shell: bash
        run: |
          set +e
          cargo test --test cli_reminders_runtime_migration -- --nocapture > /tmp/reminders-red.log 2>&1
          status=$?
          set -e
          cat /tmp/reminders-red.log
          test "$status" -ne 0
          grep -F "remind set did not report the selected runtime path" /tmp/reminders-red.log

      - name: Apply the bounded runtime migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              "src/local_memory_runtime.rs",
              """use crate::memory_core::{
              AdvancedSearcher, CheckpointInput, CheckpointManager, Deleter, Embedder, GraphNode,
              GraphTraverser, ListResult, Lister, MemoryInput, MemoryUpdate, PhraseSearcher, Pipeline,
              PlaceholderPipeline, Relationship, RelationshipQuerier, SearchOptions, SearchResult,
              SemanticResult, SimilarFinder, VersionChainQuerier,
          };
          """,
              """use crate::memory_core::{
              AdvancedSearcher, CheckpointInput, CheckpointManager, Deleter, Embedder, GraphNode,
              GraphTraverser, ListResult, Lister, MemoryInput, MemoryUpdate, PhraseSearcher, Pipeline,
              PlaceholderPipeline, Relationship, RelationshipQuerier, ReminderManager, SearchOptions,
              SearchResult, SemanticResult, SimilarFinder, VersionChainQuerier,
          };
          """,
          )

          replace_once(
              "src/local_memory_runtime.rs",
              """    /// Runs the current basic search implementation.
          """,
              """    /// Creates a reminder without changing duration, metadata, or timestamp semantics.
              pub async fn create_reminder(
                  &self,
                  text: &str,
                  duration: &str,
                  context: Option<&str>,
                  session_id: Option<&str>,
                  project: Option<&str>,
              ) -> Result<serde_json::Value> {
                  self.storage
                      .create_reminder(text, duration, context, session_id, project)
                      .await
              }

              /// Lists reminders without changing status filters, ordering, or payload fields.
              pub async fn list_reminders(
                  &self,
                  status: Option<&str>,
              ) -> Result<Vec<serde_json::Value>> {
                  self.storage.list_reminders(status).await
              }

              /// Dismisses a reminder without changing metadata or timestamp semantics.
              pub async fn dismiss_reminder(&self, reminder_id: &str) -> Result<serde_json::Value> {
                  self.storage.dismiss_reminder(reminder_id).await
              }

              /// Runs the current basic search implementation.
          """,
          )

          replace_once(
              "src/main.rs",
              """use memory_core::{
              BackupManager, CheckpointInput, Embedder, EventType, ExpirationSweeper, FeedbackRecorder,
              LessonQuerier, MaintenanceManager, MemoryInput, MemoryUpdate, ProfileManager, ReminderManager,
              SearchOptions, StatsProvider, WelcomeOptions, WelcomeProvider, is_valid_event_type,
          };
          """,
              """use memory_core::{
              BackupManager, CheckpointInput, Embedder, EventType, ExpirationSweeper, FeedbackRecorder,
              LessonQuerier, MaintenanceManager, MemoryInput, MemoryUpdate, ProfileManager, SearchOptions,
              StatsProvider, WelcomeOptions, WelcomeProvider, is_valid_event_type,
          };
          """,
          )

          replace_once(
              "src/main.rs",
              """                let result = <SqliteStorage as ReminderManager>::create_reminder(
                          &mcp_storage,
                          text,
                          duration,
                          context.as_deref(),
                          session_id.as_deref(),
                          project.as_deref(),
                      )
                      .await?;
                      println!(\"{}\", result);
          """,
              """                let result = local_runtime
                          .create_reminder(
                              text,
                              duration,
                              context.as_deref(),
                              session_id.as_deref(),
                              project.as_deref(),
                          )
                          .await?;
                      info!(
                          reminder_id = result[\"reminder_id\"].as_str().unwrap_or_default(),
                          \"Reminder created through local memory runtime\"
                      );
                      println!(\"{}\", result);
          """,
          )

          replace_once(
              "src/main.rs",
              """                let result = <SqliteStorage as ReminderManager>::list_reminders(
                          &mcp_storage,
                          status.as_deref(),
                      )
                      .await?;
                      println!(\"{}\", json!({ \"results\": result }));
          """,
              """                let result = local_runtime.list_reminders(status.as_deref()).await?;
                      info!(
                          result_count = result.len(),
                          status = status.as_deref().unwrap_or(\"pending\"),
                          \"Reminders listed through local memory runtime\"
                      );
                      println!(\"{}\", json!({ \"results\": result }));
          """,
          )

          replace_once(
              "src/main.rs",
              """                let result =
                          <SqliteStorage as ReminderManager>::dismiss_reminder(&mcp_storage, reminder_id)
                              .await?;
                      println!(\"{}\", result);
          """,
              """                let result = local_runtime.dismiss_reminder(reminder_id).await?;
                      info!(
                          reminder_id,
                          \"Reminder dismissed through local memory runtime\"
                      );
                      println!(\"{}\", result);
          """,
          )

          replace_once(
              "tests/local_memory_runtime.rs",
              """use mag::memory_core::{
              AdvancedSearcher, CheckpointInput, CheckpointManager, Deleter, EventType, GraphTraverser,
              Lister, MemoryInput, MemoryUpdate, PhraseSearcher, Pipeline, PlaceholderEmbedder,
              PlaceholderPipeline, RelationshipQuerier, SearchOptions, SimilarFinder, VersionChainQuerier,
          };
          """,
              """use mag::memory_core::{
              AdvancedSearcher, CheckpointInput, CheckpointManager, Deleter, EventType, GraphTraverser,
              Lister, MemoryInput, MemoryUpdate, PhraseSearcher, Pipeline, PlaceholderEmbedder,
              PlaceholderPipeline, RelationshipQuerier, ReminderManager, SearchOptions, SimilarFinder,
              VersionChainQuerier,
          };
          """,
          )

          parity_test = r'''

          fn stable_reminder_contract(entry: &serde_json::Value) -> serde_json::Value {
              let text = entry["text"]
                  .as_str()
                  .and_then(|value| value.split_once("\n[due: ").map(|(text, _)| text))
                  .unwrap_or_default();
              serde_json::json!({
                  "text": text,
                  "status": entry["status"],
                  "is_due": entry["is_due"],
                  "is_overdue": entry["is_overdue"],
                  "metadata": {
                      "event_type": entry["metadata"]["event_type"],
                      "reminder_status": entry["metadata"]["reminder_status"],
                      "context": entry["metadata"]["context"],
                      "session_id": entry["metadata"]["session_id"],
                      "project": entry["metadata"]["project"],
                  }
              })
          }

          #[tokio::test]
          async fn local_runtime_preserves_reminder_capability_outputs() {
              let runtime_temp = tempfile::tempdir().unwrap();
              let direct_temp = tempfile::tempdir().unwrap();
              let runtime_storage = storage_at(runtime_temp.path().join("memory.db")).await;
              let direct_storage = storage_at(direct_temp.path().join("memory.db")).await;
              let runtime = LocalMemoryRuntime::from_storage(runtime_storage);

              let runtime_created = runtime
                  .create_reminder(
                      "runtime reminder parity",
                      "2h",
                      Some("after checkpoint migration"),
                      Some("runtime-reminder-session"),
                      Some("runtime-reminder-project"),
                  )
                  .await
                  .unwrap();
              let direct_created = direct_storage
                  .create_reminder(
                      "runtime reminder parity",
                      "2h",
                      Some("after checkpoint migration"),
                      Some("runtime-reminder-session"),
                      Some("runtime-reminder-project"),
                  )
                  .await
                  .unwrap();

              for created in [&runtime_created, &direct_created] {
                  uuid::Uuid::parse_str(created["reminder_id"].as_str().unwrap()).unwrap();
                  chrono::DateTime::parse_from_rfc3339(created["remind_at"].as_str().unwrap())
                      .unwrap();
                  assert_eq!(created["text"], "runtime reminder parity");
                  assert_eq!(created["duration"], "2h");
              }

              let runtime_id = runtime_created["reminder_id"].as_str().unwrap();
              let direct_id = direct_created["reminder_id"].as_str().unwrap();
              let runtime_pending = runtime.list_reminders(Some("pending")).await.unwrap();
              let direct_pending = direct_storage
                  .list_reminders(Some("pending"))
                  .await
                  .unwrap();
              assert_eq!(runtime_pending.len(), 1);
              assert_eq!(direct_pending.len(), 1);
              assert_eq!(runtime_pending[0]["reminder_id"], runtime_id);
              assert_eq!(direct_pending[0]["reminder_id"], direct_id);
              assert_eq!(
                  stable_reminder_contract(&runtime_pending[0]),
                  stable_reminder_contract(&direct_pending[0])
              );
              for entry in [&runtime_pending[0], &direct_pending[0]] {
                  chrono::DateTime::parse_from_rfc3339(entry["remind_at"].as_str().unwrap())
                      .unwrap();
                  chrono::DateTime::parse_from_rfc3339(entry["created_at"].as_str().unwrap())
                      .unwrap();
                  chrono::DateTime::parse_from_rfc3339(
                      entry["metadata"]["created_at_utc"].as_str().unwrap(),
                  )
                  .unwrap();
              }

              let runtime_dismissed = runtime.dismiss_reminder(runtime_id).await.unwrap();
              let direct_dismissed = direct_storage.dismiss_reminder(direct_id).await.unwrap();
              assert_eq!(runtime_dismissed["status"], direct_dismissed["status"]);
              assert_eq!(runtime_dismissed["status"], "dismissed");
              for dismissed in [&runtime_dismissed, &direct_dismissed] {
                  chrono::DateTime::parse_from_rfc3339(
                      dismissed["dismissed_at"].as_str().unwrap(),
                  )
                  .unwrap();
              }

              assert!(
                  runtime
                      .list_reminders(Some("pending"))
                      .await
                      .unwrap()
                      .is_empty()
              );
              assert!(
                  direct_storage
                      .list_reminders(Some("pending"))
                      .await
                      .unwrap()
                      .is_empty()
              );
              let runtime_dismissed_list = runtime
                  .list_reminders(Some("dismissed"))
                  .await
                  .unwrap();
              let direct_dismissed_list = direct_storage
                  .list_reminders(Some("dismissed"))
                  .await
                  .unwrap();
              assert_eq!(runtime_dismissed_list.len(), 1);
              assert_eq!(direct_dismissed_list.len(), 1);
              assert_eq!(
                  stable_reminder_contract(&runtime_dismissed_list[0]),
                  stable_reminder_contract(&direct_dismissed_list[0])
              );
              assert_eq!(runtime.list_reminders(Some("all")).await.unwrap().len(), 1);
              assert_eq!(
                  direct_storage
                      .list_reminders(Some("all"))
                      .await
                      .unwrap()
                      .len(),
                  1
              );
          }
          '''
          test_path = Path("tests/local_memory_runtime.rs")
          test_path.write_text(test_path.read_text().rstrip() + parity_test + "\n")

          Path(".github/workflows/agent-apply-reminders-runtime.yml").unlink()
          PY

          cargo fmt --all

      - name: Verify the focused green path
        run: |
          cargo test --test cli_reminders_runtime_migration -- --nocapture
          cargo test --test local_memory_runtime -- --nocapture

      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Reconcile the intentional runtime interface change
        run: cairn scan

      - name: Commit the green-stage implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(cli): route reminders through local runtime"
          git push origin HEAD:agent/migrate-cli-reminders-runtime
