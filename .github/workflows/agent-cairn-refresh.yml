name: Agent Cairn refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Retain shared in-memory helpers without binary false positives
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/memory_core/storage/sqlite/storage.rs")
          text = path.read_text()
          first = "    pub fn new_in_memory() -> Result<Self> {"
          second = "    pub fn new_in_memory_with_embedder(embedder: Arc<dyn Embedder>) -> Result<Self> {"
          first_replacement = (
              "    // Public library/test helpers; the binary compiles a private module copy\n"
              "    // where they intentionally have no direct caller.\n"
              "    #[allow(dead_code)]\n"
              + first
          )
          second_replacement = "    #[allow(dead_code)]\n" + second

          if first_replacement not in text:
              if first not in text:
                  raise SystemExit("new_in_memory signature did not match expected source")
              text = text.replace(first, first_replacement, 1)
          if second_replacement not in text:
              if second not in text:
                  raise SystemExit("new_in_memory_with_embedder signature did not match expected source")
              text = text.replace(second, second_replacement, 1)
          path.write_text(text)
          PY
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Refresh and commit Cairn state
        run: |
          cairn scan
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/memory_core/storage/sqlite/storage.rs \
            .cairn/log.md \
            .cairn/state \
            map.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(runtime): retain shared in-memory helpers"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
