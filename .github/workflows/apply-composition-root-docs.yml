name: Apply composition-root roadmap updates

on:
  push:
    branches:
      - docs/select-local-runtime-root
    paths:
      - .github/workflows/apply-composition-root-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/select-local-runtime-root
          fetch-depth: 0
      - name: Apply roadmap updates
        run: python scripts/apply_composition_root_docs.py
      - name: Commit roadmap updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(architecture): align roadmaps with selected runtime root"
          git push origin HEAD:docs/select-local-runtime-root
