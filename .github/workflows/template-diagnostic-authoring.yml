name: Temporary template diagnostic authoring
on:
  push:
    branches: [agent/memory-intelligence-template-diagnostic]
    paths: [.github/workflows/template-diagnostic-authoring.yml]
permissions:
  contents: read
jobs:
  preserve-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Preserve only the verified original artifact on the expected branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=agent/memory-intelligence-template-diagnostic
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          archive="$RUNNER_TEMP/template-observation.zip"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 60 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/George-RD/mag/actions/artifacts/10115793367/zip \
            --output "$archive"
          echo "77603b39db8538420c61355a6726f28ac84a0b38cd1c23a088492062240592dc  $archive" | sha256sum --check
          test "$(git hash-object "$archive")" = 81c189111f6cf43106fbf1d0c54b5f90a84a27f8
          path=benches/memory_intelligence/diagnostics/2026-09-09-template-v1/evidence.zip
          test ! -e "$path"
          mkdir -p "$(dirname "$path")"
          cp "$archive" "$path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$path"
          git diff --cached --check
          git commit -m 'test(eval): archive original pinned-server template observations'
          git push origin "HEAD:refs/heads/$branch"
