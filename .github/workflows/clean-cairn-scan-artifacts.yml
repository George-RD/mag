name: Clean incidental Cairn scan artifacts

on:
  push:
    branches:
      - agent/migrate-mcp-manage-runtime
    paths:
      - .github/workflows/clean-cairn-scan-artifacts.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/migrate-mcp-manage-runtime
          fetch-depth: 0
      - name: Restore non-authoritative generated files
        run: |
          git fetch origin main
          git checkout origin/main -- \
            .cairn/log.md \
            .cairn/state/head-blueprint.cache \
            .cairn/state/reconciler-cache.json \
            map.json \
            map.md
          rm .github/workflows/clean-cairn-scan-artifacts.yml
      - name: Verify and commit cleanup
        run: |
          git diff --check
          test ! -e .github/workflows/clean-cairn-scan-artifacts.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(cairn): keep only reviewed interface state"
          git push origin HEAD:${GITHUB_REF_NAME}
