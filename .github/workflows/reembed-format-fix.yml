name: Apply re-embed formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/embedding-space-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format changed Rust sources
        run: |
          cargo fmt --all
          git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "George"
          git config user.email "180932462+George-RD@users.noreply.github.com"
          git add -u
          git commit -m "style: format embedding migration changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
