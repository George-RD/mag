name: Apply traversal runtime migration

on:
  push:
    branches:
      - agent/migrate-cli-traverse-runtime
    paths:
      - .github/workflows/agent-apply-traverse-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/migrate-cli-traverse-runtime
          fetch-depth: 0

      - name: Apply the bounded runtime migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              "src/local_memory_runtime.rs",
              """use crate::memory_core::{
              AdvancedSearcher, Deleter, Embedder, ListResult, Lister, MemoryInput, MemoryUpdate,
              PhraseSearcher, Pipeline, PlaceholderPipeline, Relationship, RelationshipQuerier,
              SearchOptions, SearchResult, SemanticResult, SimilarFinder, VersionChainQuerier,
          };
          """,
              """use crate::memory_core::{
              AdvancedSearcher, Deleter, Embedder, GraphNode, GraphTraverser, ListResult, Lister,
              MemoryInput, MemoryUpdate, PhraseSearcher, Pipeline, PlaceholderPipeline, Relationship,
              RelationshipQuerier, SearchOptions, SearchResult, SemanticResult, SimilarFinder,
              VersionChainQuerier,
          };
          """,
          )

          replace_once(
              "src/local_memory_runtime.rs",
              """    /// Returns stored relationships without changing ordering or payload semantics.
              pub async fn get_relationships(&self, memory_id: &str) -> Result<Vec<Relationship>> {
                  self.storage.get_relationships(memory_id).await
              }

          """,
              """    /// Returns stored relationships without changing ordering or payload semantics.
              pub async fn get_relationships(&self, memory_id: &str) -> Result<Vec<Relationship>> {
                  self.storage.get_relationships(memory_id).await
              }

              /// Traverses the relationship graph without changing hop, weight, or edge semantics.
              pub async fn traverse(
                  &self,
                  start_id: &str,
                  max_hops: usize,
                  min_weight: f64,
                  edge_types: Option<&[String]>,
              ) -> Result<Vec<GraphNode>> {
                  self.storage
                      .traverse(start_id, max_hops, min_weight, edge_types)
                      .await
              }

          """,
          )

          replace_once(
              "src/main.rs",
              """    FeedbackRecorder, GraphTraverser, LessonQuerier, MaintenanceManager, MemoryInput, MemoryUpdate,
          """,
              """    FeedbackRecorder, LessonQuerier, MaintenanceManager, MemoryInput, MemoryUpdate,
          """,
          )

          replace_once(
              "src/main.rs",
              """            let nodes = <SqliteStorage as GraphTraverser>::traverse(
                          &mcp_storage,
                          id,
                          *max_hops,
                          *min_weight,
                          None,
                      )
                      .await?;
          """,
              """            let nodes = local_runtime
                          .traverse(id, *max_hops, *min_weight, None)
                          .await?;
                      info!(
                          result_count = nodes.len(),
                          \"Graph traversal completed through local memory runtime\"
                      );
          """,
          )

          replace_once(
              "tests/local_memory_runtime.rs",
              """    AdvancedSearcher, Deleter, EventType, Lister, MemoryInput, MemoryUpdate, PhraseSearcher,
              Pipeline, PlaceholderEmbedder, PlaceholderPipeline, RelationshipQuerier, SearchOptions,
              SimilarFinder, VersionChainQuerier,
          """,
              """    AdvancedSearcher, Deleter, EventType, GraphTraverser, Lister, MemoryInput, MemoryUpdate,
              PhraseSearcher, Pipeline, PlaceholderEmbedder, PlaceholderPipeline, RelationshipQuerier,
              SearchOptions, SimilarFinder, VersionChainQuerier,
          """,
          )

          replace_once(
              "tests/local_memory_runtime.rs",
              """    let runtime_relations = runtime.get_relationships(&runtime_id).await.unwrap();
              let direct_relations = legacy_storage.get_relationships(&legacy_id).await.unwrap();
              assert_eq!(runtime_relations, direct_relations);
              assert!(runtime_relations.is_empty());

          """,
              """    let runtime_relations = runtime.get_relationships(&runtime_id).await.unwrap();
              let direct_relations = legacy_storage.get_relationships(&legacy_id).await.unwrap();
              assert_eq!(runtime_relations, direct_relations);
              assert!(runtime_relations.is_empty());

              let runtime_traversal = runtime
                  .traverse(&runtime_id, 2, 0.0, None)
                  .await
                  .unwrap();
              let direct_traversal = legacy_storage
                  .traverse(&legacy_id, 2, 0.0, None)
                  .await
                  .unwrap();
              assert_eq!(runtime_traversal, direct_traversal);
              assert!(runtime_traversal.is_empty());

          """,
          )

          Path(".github/workflows/agent-apply-traverse-runtime.yml").unlink()
          PY

          cargo fmt --all

      - name: Commit the green-stage implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs src/local_memory_runtime.rs tests/local_memory_runtime.rs tests/cli_traverse_runtime_migration.rs .github/workflows/agent-apply-traverse-runtime.yml
          git commit -m "refactor(cli): route traversal through local runtime"
          git push origin HEAD:agent/migrate-cli-traverse-runtime
