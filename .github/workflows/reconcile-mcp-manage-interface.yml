name: Reconcile MCP manage runtime interface

on:
  push:
    branches:
      - agent/migrate-mcp-manage-runtime
    paths:
      - .github/workflows/reconcile-mcp-manage-interface.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/migrate-mcp-manage-runtime
          fetch-depth: 0
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Refresh intentional interface baseline
        run: |
          set +e
          cairn scan
          set -e
          rm .github/workflows/reconcile-mcp-manage-interface.yml
          cairn hook all
      - name: Verify and commit Cairn state
        run: |
          git diff --check
          test ! -e .github/workflows/reconcile-mcp-manage-interface.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(cairn): accept manage runtime interface"
          git push origin HEAD:${GITHUB_REF_NAME}
