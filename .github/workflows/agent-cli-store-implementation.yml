name: Agent CLI store implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Route ingest and process through the local runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/main.rs")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"{label} did not match expected source")
              text = text.replace(old, new, 1)

          replace_once(
              '''#[cfg(feature = "daemon-http")]
          #[allow(dead_code)]
          mod idle_timer;
          mod mcp;
          mod memory_core;
          ''',
              '''#[cfg(feature = "daemon-http")]
          #[allow(dead_code)]
          mod idle_timer;
          // Remaining facade capabilities migrate in later CLI and MCP slices.
          #[allow(dead_code)]
          mod local_memory_runtime;
          mod mcp;
          mod memory_core;
          ''',
              "local runtime module",
          )
          replace_once(
              '''use mcp::McpMemoryServer;

          #[derive(Clone, Copy)]
          ''',
              '''use local_memory_runtime::LocalMemoryRuntime;
          use mcp::McpMemoryServer;

          #[derive(Clone, Copy)]
          ''',
              "local runtime import",
          )
          replace_once(
              '''struct NormalizedSearchTimeFilters {
              created_after: Option<String>,
              created_before: Option<String>,
              event_after: Option<String>,
              event_before: Option<String>,
          }

          #[tokio::main]
          ''',
              '''struct NormalizedSearchTimeFilters {
              created_after: Option<String>,
              created_before: Option<String>,
              event_after: Option<String>,
              event_before: Option<String>,
          }

          struct StoreCommandRequest<'a> {
              content: &'a str,
              tags: &'a [String],
              importance: f64,
              metadata: Option<&'a str>,
              event_type: Option<&'a str>,
              session_id: Option<&'a str>,
              project: Option<&'a str>,
              priority: Option<i32>,
              entity_id: Option<&'a str>,
              agent_type: Option<&'a str>,
              ttl_seconds: Option<i64>,
              referenced_date: Option<&'a str>,
          }

          #[tokio::main]
          ''',
              "shared store request",
          )
          replace_once(
              '''    if let Err(e) = <SqliteStorage as BackupManager>::maybe_startup_backup(&sqlite_storage).await {
              tracing::warn!("startup backup failed (non-fatal): {e}");
          }

              let mcp_storage = sqlite_storage.clone();
          ''',
              '''    if let Err(e) = <SqliteStorage as BackupManager>::maybe_startup_backup(&sqlite_storage).await {
              tracing::warn!("startup backup failed (non-fatal): {e}");
          }

              let local_runtime = LocalMemoryRuntime::from_storage(sqlite_storage.clone());
              let mcp_storage = sqlite_storage.clone();
          ''',
              "runtime construction",
          )

          old_commands = '''        Commands::Ingest {
                      content,
                      tags,
                      importance,
                      metadata,
                      event_type,
                      session_id,
                      project,
                      priority,
                      entity_id,
                      agent_type,
                      ttl_seconds,
                      referenced_date,
                  } => {
                      info!(content_len = content.len(), "Ingesting content");
                      let meta = parse_metadata_arg(metadata.as_deref())?;
                      if let Some(kind) = event_type.as_deref()
                          && !is_valid_event_type(kind)
                      {
                          anyhow::bail!("invalid --event-type: {kind}");
                      }
                      let mut input = MemoryInput {
                          content: content.clone(),
                          id: None,
                          tags: tags.clone(),
                          importance: *importance,
                          metadata: meta,
                          session_id: session_id.clone(),
                          project: project.clone(),
                          priority: *priority,
                          entity_id: entity_id.clone(),
                          agent_type: agent_type.clone(),
                          ttl_seconds: *ttl_seconds,
                          referenced_date: referenced_date.clone(),
                          ..MemoryInput::default()
                      };
                      input.apply_event_type_defaults(event_type.as_deref());
                      let id = pipeline.run(content, &input).await?;
                      info!(memory_id = %id, "Successfully processed and stored");
                      println!("{}", json!({ "id": id }));
                  }
                  Commands::Process {
                      content,
                      tags,
                      importance,
                      metadata,
                      event_type,
                      session_id,
                      project,
                      priority,
                      entity_id,
                      agent_type,
                      ttl_seconds,
                      referenced_date,
                  } => {
                      info!(content_len = content.len(), "Processing content directly");
                      let meta = parse_metadata_arg(metadata.as_deref())?;
                      if let Some(kind) = event_type.as_deref()
                          && !is_valid_event_type(kind)
                      {
                          anyhow::bail!("invalid --event-type: {kind}");
                      }
                      let mut input = MemoryInput {
                          content: content.clone(),
                          id: None,
                          tags: tags.clone(),
                          importance: *importance,
                          metadata: meta,
                          session_id: session_id.clone(),
                          project: project.clone(),
                          priority: *priority,
                          entity_id: entity_id.clone(),
                          agent_type: agent_type.clone(),
                          ttl_seconds: *ttl_seconds,
                          referenced_date: referenced_date.clone(),
                          ..MemoryInput::default()
                      };
                      input.apply_event_type_defaults(event_type.as_deref());
                      let id = pipeline.run(content, &input).await?;
                      info!(memory_id = %id, "Process command stored result");
                      println!("{}", json!({ "id": id }));
                  }
          '''
          new_commands = '''        Commands::Ingest {
                      content,
                      tags,
                      importance,
                      metadata,
                      event_type,
                      session_id,
                      project,
                      priority,
                      entity_id,
                      agent_type,
                      ttl_seconds,
                      referenced_date,
                  }
                  | Commands::Process {
                      content,
                      tags,
                      importance,
                      metadata,
                      event_type,
                      session_id,
                      project,
                      priority,
                      entity_id,
                      agent_type,
                      ttl_seconds,
                      referenced_date,
                  } => {
                      let command = if matches!(&cli.command, Commands::Ingest { .. }) {
                          "ingest"
                      } else {
                          "process"
                      };
                      info!(command, content_len = content.len(), "Storing content");
                      let id = execute_store_command(
                          &local_runtime,
                          StoreCommandRequest {
                              content,
                              tags,
                              importance: *importance,
                              metadata: metadata.as_deref(),
                              event_type: event_type.as_deref(),
                              session_id: session_id.as_deref(),
                              project: project.as_deref(),
                              priority: *priority,
                              entity_id: entity_id.as_deref(),
                              agent_type: agent_type.as_deref(),
                              ttl_seconds: *ttl_seconds,
                              referenced_date: referenced_date.as_deref(),
                          },
                      )
                      .await?;
                      info!(command, memory_id = %id, "Stored through local memory runtime");
                      println!("{}", json!({ "id": id }));
                  }
          '''
          replace_once(old_commands, new_commands, "ingest/process command branches")
          replace_once(
              '''fn parse_metadata_arg(metadata: Option<&str>) -> anyhow::Result<serde_json::Value> {
          ''',
              '''async fn execute_store_command(
              runtime: &LocalMemoryRuntime,
              request: StoreCommandRequest<'_>,
          ) -> anyhow::Result<String> {
              let metadata = parse_metadata_arg(request.metadata)?;
              if let Some(kind) = request.event_type
                  && !is_valid_event_type(kind)
              {
                  anyhow::bail!("invalid --event-type: {kind}");
              }

              let mut input = MemoryInput {
                  content: request.content.to_string(),
                  id: None,
                  tags: request.tags.to_vec(),
                  importance: request.importance,
                  metadata,
                  session_id: request.session_id.map(str::to_owned),
                  project: request.project.map(str::to_owned),
                  priority: request.priority,
                  entity_id: request.entity_id.map(str::to_owned),
                  agent_type: request.agent_type.map(str::to_owned),
                  ttl_seconds: request.ttl_seconds,
                  referenced_date: request.referenced_date.map(str::to_owned),
                  ..MemoryInput::default()
              };
              input.apply_event_type_defaults(request.event_type);
              runtime.store(request.content, &input).await
          }

          fn parse_metadata_arg(metadata: Option<&str>) -> anyhow::Result<serde_json::Value> {
          ''',
              "shared store execution helper",
          )
          path.write_text(text)

          todo = Path("meta/todos/migrate-cli-to-local-memory-runtime.md")
          todo_text = todo.read_text()
          todo_text = todo_text.replace(
              "status: blocked\ncreated: 2026-07-29\n",
              "status: in_progress\ncreated: 2026-07-29\nstarted: 2026-07-30\n",
              1,
          )
          todo_text = todo_text.replace(
              "Blocked by `todo.introduce-local-memory-runtime-facade`.\n\n",
              "The local facade is merged. Migrate production callers in bounded slices.\n\n",
              1,
          )
          progress = '''
          ## Progress

          - [x] `ingest` and `process` route through `LocalMemoryRuntime`; one shared helper
            now owns validation and `MemoryInput` assembly while stdout and the current
            `processed: ` stored-content contract remain pinned by a caller-level test.
          - [ ] Migrate retrieve/delete/update and other basic CRUD.
          - [ ] Migrate search, semantic/advanced retrieval, graph, session, and
            administration commands.
          '''
          if "## Progress" not in todo_text:
              todo_text = todo_text.rstrip() + "\n" + progress
          todo.write_text(todo_text)
          PY
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format and verify the focused slice
        run: |
          cargo fmt --all
          cargo test --quiet --all-features --test cli_store_runtime_migration
          cargo clippy --quiet --all-targets --all-features -- -D warnings -A clippy::manual_filter
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Refresh Cairn and commit the verified slice
        run: |
          cairn scan
          cairn hook all
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main.rs \
            meta/todos/migrate-cli-to-local-memory-runtime.md \
            .cairn/log.md \
            .cairn/state \
            map.json
          if ! git diff --cached --quiet; then
            git commit -m "refactor(cli): route store commands through local runtime"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
