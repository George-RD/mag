name: Implement lessons runtime migration

on:
  push:
    branches: [agent/migrate-cli-lessons-runtime]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/migrate-cli-lessons-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Apply focused migration
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              content = file_path.read_text()
              if content.count(old) != 1:
                  raise SystemExit(f"expected one replacement anchor in {path}, found {content.count(old)}")
              file_path.write_text(content.replace(old, new, 1))

          replace_once(
              "src/local_memory_runtime.rs",
              """    AdvancedSearcher, CheckpointInput, CheckpointManager, Deleter, Embedder, GraphNode,
              GraphTraverser, ListResult, Lister, MemoryInput, MemoryUpdate, PhraseSearcher, Pipeline,
""",
              """    AdvancedSearcher, CheckpointInput, CheckpointManager, Deleter, Embedder, GraphNode,
              GraphTraverser, LessonQuerier, ListResult, Lister, MemoryInput, MemoryUpdate, PhraseSearcher,
              Pipeline,
""",
          )
          replace_once(
              "src/local_memory_runtime.rs",
              """    /// Runs the current basic search implementation.
""",
              """    /// Queries lessons without changing filtering, ordering, deduplication, or payload fields.
              pub async fn query_lessons(
                  &self,
                  task: Option<&str>,
                  project: Option<&str>,
                  exclude_session: Option<&str>,
                  agent_type: Option<&str>,
                  limit: usize,
              ) -> Result<Vec<serde_json::Value>> {
                  self.storage
                      .query_lessons(task, project, exclude_session, agent_type, limit)
                      .await
              }

              /// Runs the current basic search implementation.
""",
          )
          replace_once(
              "src/main.rs",
              """    BackupManager, CheckpointInput, Embedder, EventType, ExpirationSweeper, FeedbackRecorder,
              LessonQuerier, MaintenanceManager, MemoryInput, MemoryUpdate, ProfileManager, SearchOptions,
""",
              """    BackupManager, CheckpointInput, Embedder, EventType, ExpirationSweeper, FeedbackRecorder,
              MaintenanceManager, MemoryInput, MemoryUpdate, ProfileManager, SearchOptions,
""",
          )
          replace_once(
              "src/main.rs",
              """        Commands::Lessons {
                  task,
                  project,
                  limit,
              } => {
                  let results = <SqliteStorage as LessonQuerier>::query_lessons(
                      &mcp_storage,
                      task.as_deref(),
                      project.as_deref(),
                      None,
                      None,
                      *limit,
                  )
                  .await?;
                  println!(\"{}\", json!({ \"results\": results }));
              }
""",
              """        Commands::Lessons {
                  task,
                  project,
                  limit,
              } => {
                  let results = local_runtime
                      .query_lessons(task.as_deref(), project.as_deref(), None, None, *limit)
                      .await?;
                  info!(
                      result_count = results.len(),
                      \"Lessons queried through local memory runtime\"
                  );
                  println!(\"{}\", json!({ \"results\": results }));
              }
""",
          )

          Path("tests/cli_lessons_runtime_migration.rs").write_text(r'''use std::path::{Path, PathBuf};
          use std::process::{Command, Output};
          use std::sync::Arc;

          use mag::LocalMemoryRuntime;
          use mag::memory_core::storage::SqliteStorage;
          use mag::memory_core::{
              EventType, LessonQuerier, MemoryInput, PlaceholderEmbedder, Storage,
          };

          const PROJECT: &str = "mag";
          const SESSION_ID: &str = "lesson-runtime-session";
          const CONTENT: &str = "Keep lesson queries behind the local runtime boundary";

          fn run_cli(home: &Path, args: &[&str]) -> anyhow::Result<Output> {
              let output = Command::new(env!("CARGO_BIN_EXE_mag"))
                  .args(args)
                  .env("HOME", home)
                  .env("USERPROFILE", home)
                  .output()?;

              anyhow::ensure!(
                  output.status.success(),
                  "command failed: {args:?}\nstdout: {}\nstderr: {}",
                  String::from_utf8_lossy(&output.stdout),
                  String::from_utf8_lossy(&output.stderr)
              );
              Ok(output)
          }

          fn store_lesson(
              home: &Path,
              content: &str,
              session_id: &str,
              project: &str,
          ) -> anyhow::Result<String> {
              let output = run_cli(
                  home,
                  &[
                      "ingest",
                      content,
                      "--event-type",
                      "lesson_learned",
                      "--session-id",
                      session_id,
                      "--project",
                      project,
                      "--agent-type",
                      "cli",
                  ],
              )?;
              let payload: serde_json::Value = serde_json::from_slice(&output.stdout)?;
              payload["id"]
                  .as_str()
                  .map(ToString::to_string)
                  .ok_or_else(|| anyhow::anyhow!("ingest output omitted lesson id"))
          }

          #[test]
          fn lessons_command_uses_local_runtime_without_contract_drift() -> anyhow::Result<()> {
              let home = tempfile::tempdir()?;
              let lesson_id = store_lesson(home.path(), CONTENT, SESSION_ID, PROJECT)?;
              store_lesson(
                  home.path(),
                  "Keep lesson queries behind the local runtime boundary for another project",
                  "other-session",
                  "other-project",
              )?;

              let output = run_cli(
                  home.path(),
                  &[
                      "lessons",
                      "--task",
                      "local runtime boundary",
                      "--project",
                      PROJECT,
                      "--limit",
                      "1",
                  ],
              )?;
              let stdout = String::from_utf8(output.stdout)?;
              let stderr = String::from_utf8(output.stderr)?;
              let payload: serde_json::Value = serde_json::from_str(stdout.trim())?;
              let results = payload["results"]
                  .as_array()
                  .ok_or_else(|| anyhow::anyhow!("lessons output omitted results"))?;
              anyhow::ensure!(results.len() == 1, "expected one filtered lesson");

              let created_at = results[0]["created_at"]
                  .as_str()
                  .ok_or_else(|| anyhow::anyhow!("lesson output omitted created_at"))?;
              chrono::DateTime::parse_from_rfc3339(created_at)?;

              let expected = serde_json::json!({
                  "results": [{
                      "content": format!("processed: {CONTENT}"),
                      "lesson_id": lesson_id,
                      "session_id": SESSION_ID,
                      "access_count": 0,
                      "created_at": created_at,
                  }]
              });
              assert_eq!(payload, expected);
              assert_eq!(stdout, format!("{expected}\n"));
              assert!(
                  stderr.contains("Lessons queried through local memory runtime"),
                  "lessons did not report the selected runtime path: {stderr}"
              );

              Ok(())
          }

          async fn storage_at(path: PathBuf) -> SqliteStorage {
              tokio::task::spawn_blocking(move || {
                  SqliteStorage::new_with_path(path, Arc::new(PlaceholderEmbedder))
              })
              .await
              .expect("SQLite initialization task should not panic")
              .expect("SQLite storage should initialize")
          }

          #[tokio::test]
          async fn local_runtime_preserves_lesson_query_contract() -> anyhow::Result<()> {
              let temp = tempfile::tempdir()?;
              let storage = storage_at(temp.path().join("memory.db")).await;
              let runtime = LocalMemoryRuntime::from_storage(storage.clone());

              let lesson = MemoryInput {
                  id: Some("lesson-runtime-parity".to_string()),
                  content: CONTENT.to_string(),
                  event_type: Some(EventType::LessonLearned),
                  session_id: Some(SESSION_ID.to_string()),
                  project: Some(PROJECT.to_string()),
                  agent_type: Some("cli".to_string()),
                  ..Default::default()
              };
              storage
                  .store("lesson-runtime-parity", &lesson.content, &lesson)
                  .await?;

              let other_project = MemoryInput {
                  id: Some("lesson-other-project".to_string()),
                  content: format!("{CONTENT} for another project"),
                  event_type: Some(EventType::LessonLearned),
                  session_id: Some("other-session".to_string()),
                  project: Some("other-project".to_string()),
                  agent_type: Some("cli".to_string()),
                  ..Default::default()
              };
              storage
                  .store(
                      "lesson-other-project",
                      &other_project.content,
                      &other_project,
                  )
                  .await?;

              let runtime_results = runtime
                  .query_lessons(
                      Some("local runtime boundary"),
                      Some(PROJECT),
                      None,
                      Some("cli"),
                      1,
                  )
                  .await?;
              let direct_results = storage
                  .query_lessons(
                      Some("local runtime boundary"),
                      Some(PROJECT),
                      None,
                      Some("cli"),
                      1,
                  )
                  .await?;

              assert_eq!(runtime_results, direct_results);
              assert_eq!(runtime_results.len(), 1);
              assert_eq!(runtime_results[0]["lesson_id"], "lesson-runtime-parity");
              assert_eq!(runtime_results[0]["content"], CONTENT);
              assert_eq!(runtime_results[0]["session_id"], SESSION_ID);
              assert_eq!(runtime_results[0]["access_count"], 0);
              chrono::DateTime::parse_from_rfc3339(
                  runtime_results[0]["created_at"]
                      .as_str()
                      .expect("lesson created_at should be a string"),
              )?;
              assert!(
                  runtime
                      .query_lessons(
                          Some("local runtime boundary"),
                          Some(PROJECT),
                          Some(SESSION_ID),
                          Some("cli"),
                          5,
                      )
                      .await?
                      .is_empty()
              );
              assert!(
                  runtime
                      .query_lessons(None, None, None, None, 0)
                      .await?
                      .is_empty()
              );

              Ok(())
          }
          ''')

          replace_once(
              "meta/todos/migrate-cli-to-local-memory-runtime.md",
              "- [ ] Migrate lesson, profile, welcome, and administration commands.",
              """- [x] `lessons` routes through `LocalMemoryRuntime`; task/project/session/agent
              filters, ordering, limits, deduplication, payload fields, compact JSON, and
              direct-storage parity remain pinned.
              - [ ] Migrate profile, welcome, and administration commands.""",
          )
          PY
      - name: Format and focused verification
        run: |
          cargo fmt --all
          cargo test --all-features --test cli_lessons_runtime_migration
          cargo clippy --all-targets --all-features -- -D warnings -A clippy::manual_filter
      - name: Reconcile Cairn
        run: |
          rm .github/workflows/lessons-runtime-implementation.yml
          cairn scan
          cairn hook all
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "refactor(cli): route lessons through local runtime"
          git push
