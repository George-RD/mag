name: Implement lessons runtime migration

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'agent/migrate-cli-lessons-runtime' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/migrate-cli-lessons-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Apply focused migration
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text()
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old!r}")
              target.write_text(content.replace(old, new, 1))

          replace_once(
              "src/local_memory_runtime.rs",
              "GraphTraverser, ListResult, Lister,",
              "GraphTraverser, LessonQuerier, ListResult, Lister,",
          )
          replace_once(
              "src/local_memory_runtime.rs",
              "    /// Runs the current basic search implementation.\n",
              """    /// Queries lessons without changing filtering, ordering, deduplication, or payload fields.
              pub async fn query_lessons(
                  &self,
                  task: Option<&str>,
                  project: Option<&str>,
                  exclude_session: Option<&str>,
                  agent_type: Option<&str>,
                  limit: usize,
              ) -> Result<Vec<serde_json::Value>> {
                  self.storage
                      .query_lessons(task, project, exclude_session, agent_type, limit)
                      .await
              }

              /// Runs the current basic search implementation.
""",
          )
          replace_once(
              "src/main.rs",
              "    LessonQuerier, MaintenanceManager, MemoryInput, MemoryUpdate, ProfileManager, SearchOptions,\n",
              "    MaintenanceManager, MemoryInput, MemoryUpdate, ProfileManager, SearchOptions,\n",
          )
          replace_once(
              "src/main.rs",
              """        Commands::Lessons {
                  task,
                  project,
                  limit,
              } => {
                  let results = <SqliteStorage as LessonQuerier>::query_lessons(
                      &mcp_storage,
                      task.as_deref(),
                      project.as_deref(),
                      None,
                      None,
                      *limit,
                  )
                  .await?;
                  println!(\"{}\", json!({ \"results\": results }));
              }
""",
              """        Commands::Lessons {
                  task,
                  project,
                  limit,
              } => {
                  let results = local_runtime
                      .query_lessons(task.as_deref(), project.as_deref(), None, None, *limit)
                      .await?;
                  info!(
                      result_count = results.len(),
                      \"Lessons queried through local memory runtime\"
                  );
                  println!(\"{}\", json!({ \"results\": results }));
              }
""",
          )
          replace_once(
              "meta/todos/migrate-cli-to-local-memory-runtime.md",
              "- [ ] Migrate lesson, profile, welcome, and administration commands.",
              """- [x] `lessons` routes through `LocalMemoryRuntime`; task/project/session/agent
              filters, ordering, limits, deduplication, payload fields, compact JSON, and
              direct-storage parity remain pinned.
              - [ ] Migrate profile, welcome, and administration commands.""",
          )
          PY
      - name: Format and reconcile
        run: |
          cargo fmt --all
          rm .github/workflows/lessons-runtime-implementation.yml
          cairn scan
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "refactor(cli): route lessons through local runtime"
          git push
