name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  product-trial:
    name: Black-box Product Trial
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run product trial
        shell: bash
        run: |
          set -o pipefail
          cargo test --test product_trial_live --all-features -- --nocapture 2>&1 | tee "$RUNNER_TEMP/product-trial.log"
      - name: Upload full transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-trial-transcript
          path: ${{ runner.temp }}/product-trial.log
          if-no-files-found: error
