name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        # Rust 1.97 added manual_filter; existing crud code is unrelated to this PR.
        run: cargo clippy --quiet --all-targets --all-features -- -D warnings -A clippy::manual_filter

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Tests
        run: cargo test --quiet --all-features

  version-check:
    name: Version Consistency
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version consistency
        run: |
          for f in Cargo.toml npm/package.json python/pyproject.toml; do
            [ -f "$f" ] || { echo "::error::Required manifest not found: $f"; exit 1; }
          done
          CARGO_VER=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          NPM_VER=$(python3 -c "import json; print(json.load(open('npm/package.json'))['version'])")
          PYPI_VER_RAW=$(python3 -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          # Normalise PEP 440 dev versions: 0.1.6.dev0 → 0.1.6-dev
          PYPI_VER=$(echo "$PYPI_VER_RAW" | sed 's/\.dev[0-9]*$/-dev/')
          echo "Cargo: $CARGO_VER | npm: $NPM_VER | PyPI: $PYPI_VER (raw: $PYPI_VER_RAW)"
          if [ "$CARGO_VER" != "$NPM_VER" ] || [ "$CARGO_VER" != "$PYPI_VER" ]; then
            echo "::error::Version mismatch: Cargo=$CARGO_VER npm=$NPM_VER PyPI=$PYPI_VER"
            exit 1
          fi
          echo "All versions match: $CARGO_VER"

  python-wrapper-test:
    name: Python Wrapper (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install wrapper package
        run: python -m pip install --disable-pip-version-check -e ./python
      - name: Run wrapper tests
        run: python -m unittest discover -s python/tests -v

  shell-installer-test:
    name: Shell Installer Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run installer checksum tests
        run: sh tests/install_checksum_test.sh

  apply-installer-checksum-fix:
    name: Apply Installer Checksum Fix
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply the fail-closed implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("install.sh")
          text = path.read_text()

          old_requirement = (
              "# Requirements: curl or wget, tar, and optionally "
              "sha256sum/shasum for verification."
          )
          new_requirement = (
              "# Requirements: curl or wget, tar, and sha256sum, shasum, or openssl."
          )
          if text.count(old_requirement) != 1:
              raise SystemExit("installer requirement marker changed")
          text = text.replace(old_requirement, new_requirement)

          old_comment = "    # Checksum verification (best-effort)"
          new_comment = "    # Checksum verification is mandatory before installation."
          if text.count(old_comment) != 1:
              raise SystemExit("installer verification comment marker changed")
          text = text.replace(old_comment, new_comment)

          start = text.index("verify_checksum() {\n")
          install_marker = (
              "# ---------------------------------------------------------------------------\n"
              "# Install\n"
              "# ---------------------------------------------------------------------------\n"
          )
          end = text.index(install_marker, start)

          replacement = r'''select_checksum_tool() {
              if has_cmd sha256sum; then
                  CHECKSUM_TOOL="sha256sum"
              elif has_cmd shasum; then
                  CHECKSUM_TOOL="shasum"
              elif has_cmd openssl; then
                  CHECKSUM_TOOL="openssl"
              else
                  die "Checksum verification requires sha256sum, shasum, or openssl. Install one and retry."
              fi
          }

          calculate_sha256() {
              _checksum_file="$1"
              case "$CHECKSUM_TOOL" in
                  sha256sum)
                      sha256sum "$_checksum_file" | awk '{print tolower($1)}'
                      ;;
                  shasum)
                      shasum -a 256 "$_checksum_file" | awk '{print tolower($1)}'
                      ;;
                  openssl)
                      openssl dgst -sha256 "$_checksum_file" | awk '{print tolower($NF)}'
                      ;;
                  *)
                      die "Internal error: unsupported checksum tool ${CHECKSUM_TOOL}"
                      ;;
              esac
          }

          parse_checksum_manifest() {
              _checksum_manifest="$1"
              _checksum_archive="$2"

              awk -v archive="$_checksum_archive" '
                  /^[[:space:]]*($|#)/ { next }
                  {
                      digest = $1
                      filename = $2
                      sub(/^\*/, "", filename)
                      if (filename == archive) {
                          count++
                          if (length(digest) != 64 || digest !~ /^[0-9A-Fa-f]+$/) {
                              invalid = 1
                          }
                          value = tolower(digest)
                      }
                  }
                  END {
                      if (invalid) exit 3
                      if (count == 0) exit 1
                      if (count > 1) exit 2
                      print value
                  }
              ' "$_checksum_manifest"
          }

          verify_checksum() {
              select_checksum_tool

              info "Verifying checksum..."
              if ! fetch "$CHECKSUMS_URL" "${TMPDIR_INSTALL}/checksums.txt" 2>/dev/null; then
                  die "Failed to download checksums.txt for MAG v${VERSION:-unknown}"
              fi

              if EXPECTED="$(parse_checksum_manifest "${TMPDIR_INSTALL}/checksums.txt" "$ARCHIVE")"; then
                  :
              else
                  PARSE_STATUS=$?
                  case "$PARSE_STATUS" in
                      1) die "No checksum entry found for ${ARCHIVE}" ;;
                      2) die "Duplicate checksum entries found for ${ARCHIVE}" ;;
                      3) die "Malformed checksum entry found for ${ARCHIVE}" ;;
                      *) die "Failed to parse checksum manifest for ${ARCHIVE}" ;;
                  esac
              fi

              if ACTUAL="$(calculate_sha256 "${TMPDIR_INSTALL}/${ARCHIVE}")"; then
                  :
              else
                  die "Failed to calculate SHA-256 for ${ARCHIVE}"
              fi

              case "$ACTUAL" in
                  ''|*[!0-9a-f]*)
                      die "Failed to calculate a valid SHA-256 for ${ARCHIVE}"
                      ;;
              esac
              if [ "${#ACTUAL}" -ne 64 ]; then
                  die "Failed to calculate a valid SHA-256 for ${ARCHIVE}"
              fi

              if [ "$EXPECTED" != "$ACTUAL" ]; then
                  die "Checksum mismatch!\n  Expected: ${EXPECTED}\n  Got:      ${ACTUAL}\nThe download may be corrupted. Please retry."
              fi

              ok "Checksum verified"
          }

          '''

          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
      - name: Commit implementation
        run: |
          git diff --check
          git diff --exit-code --quiet && {
            echo "Installer implementation produced no diff" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh
          git commit -m "fix(installer): enforce mandatory release checksums"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  benchmark:
    name: Benchmark Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Detect scoring/search changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            scoring:
              - 'src/memory_core/scoring/**'
              - 'src/memory_core/storage/sqlite/search*'
              - 'src/memory_core/storage/sqlite/advanced*'
              - 'src/memory_core/storage/sqlite/pipeline/**'

      - name: Install Rust
        if: steps.filter.outputs.scoring == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        if: steps.filter.outputs.scoring == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Run benchmark gate
        if: steps.filter.outputs.scoring == 'true'
        run: ./scripts/bench.sh --gate

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run smoke test
        run: bash scripts/smoke-test.sh

  npm-install-test:
    name: npm Install Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - name: Install Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Test npm install
        run: |
          cd npm
          # Pack and install globally using the local binary
          MAG_BINARY_PATH="$GITHUB_WORKSPACE/target/release/mag" npm install -g "$(npm pack -q)"
          # Verify the wrapper exists and works
          mag --version
          INSTALLED_VER=$(mag --version | awk '{print $2}')
          CARGO_VER=$(python3 -c "import tomllib; print(tomllib.load(open('../Cargo.toml','rb'))['package']['version'])")
          echo "Installed=$INSTALLED_VER  Expected=$CARGO_VER"
          if [ "$INSTALLED_VER" != "$CARGO_VER" ]; then
            echo "::error::npm install test: version mismatch ($INSTALLED_VER != $CARGO_VER)"
            exit 1
          fi
          echo "npm install test passed: mag $INSTALLED_VER"
