name: PR435 review verification

on:
  push:
    branches: [agent/complete-embedding-space-migration]
    paths:
      - .github/workflows/pr435-review-verification.yml
      - .github/pr435-review.py

permissions:
  contents: read

concurrency:
  group: pr435-review-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'George-RD/mag' && github.ref == 'refs/heads/agent/complete-embedding-space-migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Capture exact source
        run: |
          mkdir -p "$RUNNER_TEMP/pr435-review"
          git archive HEAD | gzip > "$RUNNER_TEMP/pr435-review/source.tar.gz"
          git diff origin/main...HEAD > "$RUNNER_TEMP/pr435-review/baseline.diff"
          git ls-files '*AGENTS.md' '*ROADMAP*' '*roadmap*' '*code-review*' > "$RUNNER_TEMP/pr435-review/routes.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: pr435-review-source-${{ github.sha }}
          path: ${{ runner.temp }}/pr435-review
          retention-days: 7
      - name: Detect staged implementation
        id: staged
        run: |
          if test -f .github/pr435-review.py; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust
        if: steps.staged.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust build artifacts
        if: steps.staged.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
      - name: Install Cairn 0.9.0
        if: steps.staged.outputs.present == 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Reconcile owning context
        if: steps.staged.outputs.present == 'true'
        run: |
          { cairn status; cairn next; cairn brief todo.implement-embedding-space-migration; cairn locate OnnxEmbedder; cairn rationale mag.runtime.memory; } 2>&1 | tee "$RUNNER_TEMP/pr435-review/cairn-context.log"
      - name: Reproduce nested-runtime panic before fix
        if: steps.staged.outputs.present == 'true'
        run: |
          python3 .github/pr435-review.py tests
          cargo fmt --all
          set +e
          cargo test --all-features --lib cached_pinned_artifacts_work_inside_current_thread_runtime -- --exact memory_core::embedder::artifact_regressions::cached_pinned_artifacts_work_inside_current_thread_runtime --nocapture > "$RUNNER_TEMP/pr435-review/nested-runtime-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/pr435-review/nested-runtime-red.log"
          test "$status" -ne 0
          grep -q 'Cannot start a runtime from within a runtime' "$RUNNER_TEMP/pr435-review/nested-runtime-red.log"
          grep -q 'test result: FAILED' "$RUNNER_TEMP/pr435-review/nested-runtime-red.log"
      - name: Apply reviewed fix and run focused regressions
        if: steps.staged.outputs.present == 'true'
        run: |
          python3 .github/pr435-review.py fix
          cargo fmt --all
          cargo test --all-features --lib artifact_regressions -- --nocapture 2>&1 | tee "$RUNNER_TEMP/pr435-review/artifact-green.log"
          cargo test --all-features --test reembed_migration --test reembed_stale_runtime 2>&1 | tee "$RUNNER_TEMP/pr435-review/migration-green.log"
          cargo test --no-default-features --test reembed_migration --test reembed_stale_runtime 2>&1 | tee "$RUNNER_TEMP/pr435-review/minimal-green.log"
      - name: Full engineering gates
        if: steps.staged.outputs.present == 'true'
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/pr435-review/clippy.log"
          cargo test --all-features 2>&1 | tee "$RUNNER_TEMP/pr435-review/all-tests.log"
          python3 -m unittest tests/test_retrieval_benchmark_gate.py
          required="$(python3 scripts/retrieval_benchmark_gate.py --base origin/main --head HEAD)"
          echo "$required" > "$RUNNER_TEMP/pr435-review/benchmark-classifier.txt"
          case "$required" in true) ./scripts/bench.sh --gate ;; false) ;; *) exit 1 ;; esac
          bash scripts/smoke-test.sh 2>&1 | tee "$RUNNER_TEMP/pr435-review/smoke.log"
          cairn scan 2>&1 | tee "$RUNNER_TEMP/pr435-review/cairn-scan.log"
          cairn hook all 2>&1 | tee "$RUNNER_TEMP/pr435-review/cairn-hooks.log"
      - name: Commit only verified source and remove temporary runner
        if: steps.staged.outputs.present == 'true'
        run: |
          python3 .github/pr435-review.py evidence
          rm .github/pr435-review.py .github/workflows/pr435-review-verification.yml
          git add src/memory_core/embedder.rs .github/workflows/ci.yml meta/reviews/pr435-embedding-space-write-safety.md meta/todos/implement-embedding-space-migration.md
          git add -u .github/pr435-review.py .github/workflows/pr435-review-verification.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make verified model loading safe in Tokio runtimes'
          git diff origin/main...HEAD > "$RUNNER_TEMP/pr435-review/final.diff"
          git archive HEAD | gzip > "$RUNNER_TEMP/pr435-review/verified-source.tar.gz"
          git rev-parse HEAD | tee "$RUNNER_TEMP/pr435-review/verified-head.txt"
          test "$(git ls-remote origin refs/heads/agent/complete-embedding-space-migration | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/agent/complete-embedding-space-migration
      - name: Preserve review evidence
        if: always() && steps.staged.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr435-review-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/pr435-review
          retention-days: 14
