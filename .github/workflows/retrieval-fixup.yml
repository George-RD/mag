name: Retrieval Fixup

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fixup:
    if: github.head_ref == 'agent/retrieval-baseline' || github.ref_name == 'agent/retrieval-baseline'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/retrieval-baseline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply fixups once
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/memory_core/storage/sqlite/pipeline/abstention.rs')
          s = p.read_text()
          old = '''fn has_confident_semantic_match(candidates: &[RankedSemanticCandidate]) -> bool {
    let mut similarities: Vec<f64> = candidates
        .iter()
        .filter_map(|candidate| candidate.vec_sim)
        .filter(|similarity| similarity.is_finite())
        .collect();
    similarities.sort_unstable_by(|left, right| right.total_cmp(left));

    let Some(&top) = similarities.first() else {
        return false;
    };
    if top < SEMANTIC_RESCUE_MIN_SIM {
        return false;
    }

    similarities
        .get(1)
        .is_none_or(|second| top - second >= SEMANTIC_RESCUE_MIN_MARGIN)
}'''
          new = '''fn has_confident_semantic_match(candidates: &[RankedSemanticCandidate]) -> bool {
    let mut top: Option<f64> = None;
    let mut runner_up: Option<f64> = None;

    for similarity in candidates.iter().filter_map(|candidate| candidate.vec_sim) {
        if !similarity.is_finite() {
            continue;
        }
        match top {
            None => top = Some(similarity),
            Some(current_top) if similarity > current_top => {
                runner_up = top;
                top = Some(similarity);
            }
            Some(_) => {
                if runner_up.map_or(true, |current| similarity > current) {
                    runner_up = Some(similarity);
                }
            }
        }
    }

    let Some(top) = top else {
        return false;
    };
    let separated = match runner_up {
        Some(second) => top - second >= SEMANTIC_RESCUE_MIN_MARGIN,
        None => true,
    };
    top >= SEMANTIC_RESCUE_MIN_SIM && separated
}'''
          if old in s:
              p.write_text(s.replace(old, new))

          ci = Path('.github/workflows/ci.yml')
          y = ci.read_text()
          needle = "              - 'src/memory_core/storage/sqlite/advanced*'\n"
          addition = needle + "              - 'src/memory_core/storage/sqlite/pipeline/**'\n"
          if "src/memory_core/storage/sqlite/pipeline/**" not in y:
              if needle not in y:
                  raise SystemExit('CI scoring path filter anchor not found')
              ci.write_text(y.replace(needle, addition))
          PY
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/memory_core/storage/sqlite/pipeline/abstention.rs .github/workflows/ci.yml
            git commit -m 'test(search): enforce pipeline benchmark coverage'
            git push origin HEAD:agent/retrieval-baseline
          fi
