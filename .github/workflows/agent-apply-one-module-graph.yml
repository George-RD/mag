name: Apply one-module-graph correction

on:
  push:
    branches:
      - agent/role-aware-embedding-boundary
    paths:
      - .github/agent-one-module-graph.patch
      - .github/workflows/agent-apply-one-module-graph.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/agent-one-module-graph.patch
      - .github/workflows/agent-apply-one-module-graph.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply and format architecture correction
        run: |
          if [ ! -f .github/agent-one-module-graph.patch ]; then
            echo "Correction already applied by another run"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/main.rs",
              '''use memory_core::storage::{InitMode, SqliteStorage};
          use memory_core::{
              CheckpointInput, Embedder, EventType, MemoryInput, MemoryUpdate, SearchOptions, WelcomeOptions,
              is_valid_event_type,
          };
          ''',
              '''use mag::memory_core::storage::{InitMode, SqliteStorage};
          use mag::memory_core::{
              CheckpointInput, Embedder, EventType, MemoryInput, MemoryUpdate, SearchOptions, WelcomeOptions,
              is_valid_event_type,
          };
          use mag::{LocalMemoryRuntime, app_paths, memory_core};
          ''',
          )
          replace_once(
              "src/main.rs",
              '''#[cfg(not(feature = "real-embeddings"))]
          use memory_core::PlaceholderEmbedder;

          mod app_paths;
          ''',
              '''#[cfg(not(feature = "real-embeddings"))]
          use mag::memory_core::PlaceholderEmbedder;

          ''',
          )
          replace_once(
              "src/main.rs",
              '''// Remaining facade capabilities migrate in later CLI and MCP slices.
          #[allow(dead_code)]
          mod local_memory_runtime;
          mod mcp;
          mod memory_core;
          ''',
              '''mod mcp;
          ''',
          )
          replace_once(
              "src/main.rs",
              '''use local_memory_runtime::LocalMemoryRuntime;
          use mcp::McpMemoryServer;
          ''',
              '''use mcp::McpMemoryServer;
          ''',
          )
          replace_once(
              "src/main.rs",
              '''    let sqlite_storage = SqliteStorage::new(storage_mode, Arc::clone(&embedder))?;
              let local_runtime = LocalMemoryRuntime::from_storage(sqlite_storage.clone());

              // Automatic startup backup (file-backed DBs only, max every 24h)
              if let Err(e) = local_runtime.maybe_startup_backup().await {
                  tracing::warn!("startup backup failed (non-fatal): {e}");
              }

              let mcp_storage = sqlite_storage.clone();
          ''',
              '''    let sqlite_storage = SqliteStorage::new(storage_mode, Arc::clone(&embedder))?;

              #[cfg(feature = "real-embeddings")]
              let sqlite_storage = if matches!(
                  &cli.command,
                  Commands::Serve {
                      cross_encoder: true,
                      ..
                  }
              ) {
                  info!("Cross-encoder reranking enabled");
                  let reranker = Arc::new(memory_core::reranker::CrossEncoderReranker::new()?);
                  reranker.warmup().await?;
                  let reranker_for_tick = Arc::clone(&reranker);
                  tokio::spawn(async move {
                      let mut interval = tokio::time::interval(std::time::Duration::from_secs(60));
                      loop {
                          interval.tick().await;
                          reranker_for_tick.maintenance_tick().await;
                      }
                  });
                  sqlite_storage.with_reranker(reranker)
              } else {
                  sqlite_storage
              };

              #[cfg(not(feature = "real-embeddings"))]
              if matches!(
                  &cli.command,
                  Commands::Serve {
                      cross_encoder: true,
                      ..
                  }
              ) {
                  anyhow::bail!("--cross-encoder requires the `real-embeddings` feature to be enabled");
              }

              let local_runtime = Arc::new(LocalMemoryRuntime::from_storage(sqlite_storage));

              // Automatic startup backup (file-backed DBs only, max every 24h)
              if let Err(e) = local_runtime.maybe_startup_backup().await {
                  tracing::warn!("startup backup failed (non-fatal): {e}");
              }
          ''',
          )
          replace_once(
              "src/main.rs",
              '''        Commands::Serve {
                      cross_encoder,
                      mcp_tools,
                  } => {
                      info!("Starting MCP server over stdio");

                      #[cfg(feature = "real-embeddings")]
                      let mcp_storage = if *cross_encoder {
                          info!("Cross-encoder reranking enabled");
                          let reranker =
                              std::sync::Arc::new(memory_core::reranker::CrossEncoderReranker::new()?);
                          reranker.warmup().await?;
                          let reranker_for_tick = reranker.clone();
                          tokio::spawn(async move {
                              let mut interval = tokio::time::interval(std::time::Duration::from_secs(60));
                              loop {
                                  interval.tick().await;
                                  reranker_for_tick.maintenance_tick().await;
                              }
                          });
                          mcp_storage.with_reranker(reranker)
                      } else {
                          mcp_storage
                      };

                      #[cfg(not(feature = "real-embeddings"))]
                      if *cross_encoder {
                          anyhow::bail!(
                              "--cross-encoder requires the `real-embeddings` feature to be enabled"
                          );
                      }

                      #[cfg(feature = "real-embeddings")]
                      {
                          let onnx_for_tick = onnx_embedder_ref.clone();
                          tokio::spawn(async move {
                              let mut interval = tokio::time::interval(std::time::Duration::from_secs(60));
                              loop {
                                  interval.tick().await;
                                  onnx_for_tick.maintenance_tick().await;
                              }
                          });
                      }

                      {
                          let storage_for_optimize = mcp_storage.clone();
                          tokio::spawn(async move {
                              let mut interval = tokio::time::interval(std::time::Duration::from_secs(3600));
                              loop {
                                  interval.tick().await;
                                  if let Err(e) = storage_for_optimize.optimize().await {
                                      tracing::warn!("PRAGMA optimize failed: {e}");
                                  }
                              }
                          });
                      }
          ''',
              '''        Commands::Serve {
                      cross_encoder: _,
                      mcp_tools,
                  } => {
                      info!("Starting MCP server over stdio");

                      #[cfg(feature = "real-embeddings")]
                      {
                          let onnx_for_tick = onnx_embedder_ref.clone();
                          tokio::spawn(async move {
                              let mut interval = tokio::time::interval(std::time::Duration::from_secs(60));
                              loop {
                                  interval.tick().await;
                                  onnx_for_tick.maintenance_tick().await;
                              }
                          });
                      }

                      {
                          let runtime_for_optimize = Arc::clone(&local_runtime);
                          tokio::spawn(async move {
                              let mut interval = tokio::time::interval(std::time::Duration::from_secs(3600));
                              loop {
                                  interval.tick().await;
                                  if let Err(e) = runtime_for_optimize.optimize().await {
                                      tracing::warn!("PRAGMA optimize failed: {e}");
                                  }
                              }
                          });
                      }
          ''',
          )
          replace_once(
              "src/main.rs",
              "            McpMemoryServer::new(mcp_storage)\n",
              "            McpMemoryServer::from_runtime(Arc::clone(&local_runtime))\n",
          )
          replace_once(
              "src/local_memory_runtime.rs",
              '''    /// Runs the current basic search implementation.
              pub async fn search(
          ''',
              '''    /// Runs SQLite query-planner maintenance through the selected runtime.
              pub async fn optimize(&self) -> Result<()> {
                  self.storage.optimize().await
              }

              /// Runs the current basic search implementation.
              pub async fn search(
          ''',
          )
          replace_once(
              "src/mcp/mod.rs",
              '''use crate::LocalMemoryRuntime;
          use crate::memory_core::storage::SqliteStorage;
          use crate::memory_core::{MemoryInput, is_valid_event_type};
          ''',
              '''use crate::LocalMemoryRuntime;
          #[cfg(test)]
          use crate::memory_core::storage::SqliteStorage;
          use crate::memory_core::{MemoryInput, is_valid_event_type};
          ''',
          )
          replace_once(
              "src/mcp/mod.rs",
              '''impl McpMemoryServer {
              pub fn new(storage: SqliteStorage) -> Self {
                  let runtime = Arc::new(LocalMemoryRuntime::from_storage(storage));
                  Self {
                      runtime,
                      tool_router: Self::tool_router(),
                      tool_mode: McpToolMode::Full,
                  }
              }

              pub fn with_tool_mode(mut self, mode: McpToolMode) -> Self {
          ''',
              '''impl McpMemoryServer {
              /// Creates the optional MCP transport around the entrypoint-owned runtime.
              pub fn from_runtime(runtime: Arc<LocalMemoryRuntime>) -> Self {
                  Self {
                      runtime,
                      tool_router: Self::tool_router(),
                      tool_mode: McpToolMode::Full,
                  }
              }

              #[cfg(test)]
              fn new(storage: SqliteStorage) -> Self {
                  Self::from_runtime(Arc::new(LocalMemoryRuntime::from_storage(storage)))
              }

              pub fn with_tool_mode(mut self, mode: McpToolMode) -> Self {
          ''',
          )
          replace_once(
              "src/mcp/tools/runtime_migration_tests.rs",
              '''use serde_json::json;

          use super::facades;
          use crate::mcp::{
              MINIMAL_TOOL_NAMES, McpMemoryServer, McpToolMode, request_types::MemoryAdminFacadeRequest,
          };
          use crate::memory_core::storage::SqliteStorage;
          ''',
              '''use std::sync::Arc;

          use serde_json::json;

          use super::facades;
          use crate::LocalMemoryRuntime;
          use crate::mcp::{
              MINIMAL_TOOL_NAMES, McpMemoryServer, McpToolMode, request_types::MemoryAdminFacadeRequest,
          };
          use crate::memory_core::storage::SqliteStorage;
          ''',
          )
          replace_once(
              "src/mcp/tools/runtime_migration_tests.rs",
              '''#[tokio::test]
          async fn memory_admin_routes_through_server_runtime_without_contract_drift() {
          ''',
              '''#[test]
          fn mcp_reuses_the_entrypoint_owned_runtime() {
              let storage = SqliteStorage::new_in_memory().expect("in-memory storage should initialize");
              let runtime = Arc::new(LocalMemoryRuntime::from_storage(storage));
              let server = McpMemoryServer::from_runtime(Arc::clone(&runtime));

              assert!(
                  Arc::ptr_eq(&server.runtime, &runtime),
                  "MCP must wrap the runtime composed by the entrypoint"
              );
          }

          #[tokio::test]
          async fn memory_admin_routes_through_server_runtime_without_contract_drift() {
          ''',
          )
          PY
          rm .github/agent-one-module-graph.patch
          cargo fmt --all

      - name: Install and reconcile Cairn
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          "$HOME/.cargo/bin/cairn" scan
          "$HOME/.cargo/bin/cairn" hook all

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(runtime): share one production module graph"
          git push origin "HEAD:${TARGET_BRANCH}"
