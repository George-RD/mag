name: Apply one-module-graph correction

on:
  push:
    branches:
      - agent/role-aware-embedding-boundary
    paths:
      - .github/agent-one-module-graph.patch
      - .github/workflows/agent-apply-one-module-graph.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/agent-one-module-graph.patch
      - .github/workflows/agent-apply-one-module-graph.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply and format architecture correction
        run: |
          if [ ! -f .github/agent-one-module-graph.patch ]; then
            echo "Patch already applied by another run"
            exit 0
          fi
          git apply --check --recount .github/agent-one-module-graph.patch
          git apply --recount .github/agent-one-module-graph.patch
          rm .github/agent-one-module-graph.patch
          cargo fmt --all

      - name: Install and reconcile Cairn
        if: hashFiles('.github/agent-one-module-graph.patch') == ''
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          "$HOME/.cargo/bin/cairn" scan
          "$HOME/.cargo/bin/cairn" hook all

      - name: Commit correction
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(runtime): share one production module graph"
          git push origin "HEAD:${TARGET_BRANCH}"
