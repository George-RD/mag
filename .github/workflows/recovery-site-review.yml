name: Verify site review fixes
on:
  push:
    branches: [agent/recovery-author-20260910]
    paths: [.github/workflows/recovery-site-review.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply test-first corrections to existing site head
        run: |
          set -euo pipefail
          cp .recovery-review/site.py "$RUNNER_TEMP/site.py"
          git switch -c agent/recovery-site-review-built e63da1fb6d5d3ab57454843944aa71e433a53794
          python3 "$RUNNER_TEMP/site.py"
          python3 scripts/validate_site.py
          python3 -m unittest tests.test_validate_site tests.test_demo_observation -v
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          python3 -m unittest tests.test_site_demos -v
          git config user.name George
          git config user.email 180932462+George-RD@users.noreply.github.com
          git add README.md docs site tests meta .github/workflows/pages.yml
          git diff --cached --check
          git commit -m 'fix(site): clarify stored hashes and retain lifecycle regression gate'
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Publish reviewable staging head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/agent/recovery-site-review-built
