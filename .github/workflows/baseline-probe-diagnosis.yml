name: Baseline probe diagnosis
on:
  push:
    branches: [agent/memory-intelligence-local-baseline]
    paths: [.github/workflows/baseline-probe-diagnosis.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compare original fixture startup against a DNS-free listener
        run: |
          python3 - <<'PY'
          import subprocess, sys
          from pathlib import Path
          from unittest import mock
          sys.path.insert(0, str(Path('tests').absolute()))
          import test_memory_intelligence_local_baseline as tests
          from benches.memory_intelligence import local_baseline as baseline
          original = tests.SERVER
          for dns_free in (False, True):
              case = tests.LocalBaselineTests()
              code = 'import faulthandler\nfaulthandler.dump_traceback_later(2, repeat=True)\n' + original
              if dns_free:
                  code = code.replace('http.server.HTTPServer(', '__import__("socketserver").TCPServer(')
              with mock.patch.object(tests, 'SERVER', code): case.setUp()
              real_popen = subprocess.Popen
              log = case.root / 'server.log'
              with log.open('wb') as output:
                  def popen(command, *args, **kwargs):
                      if command[0] == str(case.server): kwargs['stderr'] = output
                      return real_popen(command, *args, **kwargs)
                  try:
                      with mock.patch.object(baseline.subprocess, 'Popen', side_effect=popen):
                          run = case.run_baseline(startup_timeout=8)
                      print('DNS-free:', dns_free, 'SUCCESS cases:', len(run['results']), flush=True)
                  except Exception as exc:
                      print('DNS-free:', dns_free, type(exc).__name__, str(exc), flush=True)
                  finally:
                      output.flush()
                      print('fixture server stack:', log.read_text(), flush=True)
                      case.doCleanups()
          PY
