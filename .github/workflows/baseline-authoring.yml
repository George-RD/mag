name: Baseline authoring
on:
  push:
    branches: [agent/memory-intelligence-local-baseline]
    paths: [.github/workflows/baseline-authoring.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked source for offline authoring
        run: |
          git archive HEAD -o source.tar
          git log -8 --format='%H %s' > history.txt
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-authoring-source
          path: |
            source.tar
            history.txt
          retention-days: 1
