name: Baseline authoring
on:
  push:
    branches: [agent/memory-intelligence-local-baseline]
    paths: [.github/workflows/baseline-authoring.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/agent/memory-intelligence-local-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Reconcile status with Cairn and remove temporary authoring workflows
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('benches/memory_intelligence/README.md')
          source = path.read_text()
          before = '''The harness does not own model loading or memory semantics. The opt-in MAG
          runtime producer is available through `mag intelligence-produce`; a measured
          local-model baseline and authenticated generation artifacts remain outstanding.'''
          after = '''The scorer and capture bridge do not own memory semantics. The opt-in MAG
          runtime producer is available through `mag intelligence-produce`. The
          [local baseline runner](LOCAL_BASELINE.md) supervises a pinned local server,
          verifies the model file, and records observed resource use without changing
          the producer's configured profile into an authentication claim.'''
          assert source.count(before) == 1
          path.write_text(source.replace(before, after))
          PY
          cairn todo set build-local-memory-intelligence-eval-harness done
          cairn todo set wire-lfm25-production-ingestion open
          rm .github/workflows/baseline-authoring.yml .github/workflows/baseline-probe-diagnosis.yml
          python3 -m unittest discover -s tests -p 'test_memory_intelligence_*.py' -v
          cairn scan
          cairn hook all
          test "$(git ls-remote origin refs/heads/agent/memory-intelligence-local-baseline | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benches/memory_intelligence/README.md meta/todos/build-local-memory-intelligence-eval-harness.md meta/todos/wire-lfm25-production-ingestion.md .github/workflows/baseline-authoring.yml .github/workflows/baseline-probe-diagnosis.yml
          git commit -m 'docs(eval): complete measured P0 boundary and remove authoring helpers'
          git push origin HEAD:refs/heads/agent/memory-intelligence-local-baseline
