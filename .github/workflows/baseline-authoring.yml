name: Baseline authoring
on:
  push:
    branches: [agent/memory-intelligence-local-baseline]
    paths: [.github/workflows/baseline-authoring.yml]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    if: github.ref == 'refs/heads/agent/memory-intelligence-local-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Import the original measured artifact and restore the exact tested assertion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=benches/memory_intelligence/baselines/2026-09-09-lfm25-1.2b-q4km-cpu/evidence.zip
          mkdir -p "$(dirname "$path")"
          gh api /repos/George-RD/mag/actions/artifacts/10087628388/zip > "$path"
          echo "01ed0eecc77d96b29efd5fcc596d3f23134d0806d6500c5a3148d3099f17d7dd  $path" | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_memory_intelligence_local_baseline.py')
          source = path.read_text()
          before = 'self.assertTrue(profile["producer"]["producer"] if "producer" in profile["producer"] else profile["producer"]["test_fixture"])'
          after = 'self.assertTrue(profile["producer"]["test_fixture"])'
          assert source.count(before) == 1
          path.write_text(source.replace(before, after))
          PY
          test "$(git hash-object tests/test_memory_intelligence_local_baseline.py)" = d51092b854f36d4482e0eda22e96ca0eb847c6d7
          python3 -m unittest discover -s tests -p 'test_memory_intelligence_*.py' -v
          test "$(git ls-remote origin refs/heads/agent/memory-intelligence-local-baseline | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path" tests/test_memory_intelligence_local_baseline.py
          git commit -m 'test(eval): preserve original measured baseline and exact fixture assertions'
          git push origin HEAD:refs/heads/agent/memory-intelligence-local-baseline
