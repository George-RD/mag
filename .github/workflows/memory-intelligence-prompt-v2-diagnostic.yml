name: Prompt v2 source snapshot

on:
  push:
    branches: [agent/memory-intelligence-prompt-v2]
    paths: [.github/workflows/memory-intelligence-prompt-v2-diagnostic.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact source and base for local review
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/mag-review.bundle" HEAD refs/remotes/origin/main
          git rev-parse HEAD HEAD^{tree} refs/remotes/origin/main > "$RUNNER_TEMP/mag-review-refs.txt"
          sha256sum "$RUNNER_TEMP/mag-review.bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mag-review-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mag-review.bundle
            ${{ runner.temp }}/mag-review-refs.txt
          if-no-files-found: error
          retention-days: 3
