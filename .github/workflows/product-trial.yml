name: Product Trial

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  product-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAG_DATA_ROOT: ${{ runner.temp }}/mag-product-trial
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Run adversarial product trial
        shell: bash
        run: |
          set -euo pipefail
          MAG="$GITHUB_WORKSPACE/target/release/mag"
          mkdir -p "$MAG_DATA_ROOT"
          REPORT="$RUNNER_TEMP/product-trial-report.txt"
          exec > >(tee "$REPORT") 2>&1

          echo '=== ENVIRONMENT ==='
          "$MAG" --version
          "$MAG" --help

          echo '=== CLI DISCOVERY ==='
          "$MAG" ingest --help || true
          "$MAG" search --help || true
          "$MAG" doctor --help || true

          echo '=== CLEAN-STATE HEALTH ==='
          "$MAG" doctor || true

          echo '=== BASIC STORE / SEARCH ==='
          "$MAG" ingest 'The deployment region for Project Atlas is eu-central-1.'
          "$MAG" search 'Where is Atlas deployed?'

          echo '=== SEMANTIC PARAPHRASE ==='
          "$MAG" ingest 'Retries must use exponential backoff with random jitter and stop after five attempts.'
          "$MAG" search 'What is our policy when requests keep failing?'

          echo '=== PERSISTENCE ACROSS PROCESSES ==='
          "$MAG" search 'deployment region Atlas'
          test -n "$(find "$MAG_DATA_ROOT" -type f -maxdepth 3 -print -quit)"

          echo '=== DUPLICATE INPUT ==='
          "$MAG" ingest 'The deployment region for Project Atlas is eu-central-1.'
          "$MAG" search 'Atlas region'

          echo '=== CONFLICTING / UPDATED MEMORY ==='
          "$MAG" ingest 'Project Atlas has moved from eu-central-1 to me-central-1. The current deployment region is me-central-1.'
          "$MAG" search 'What is the current deployment region for Project Atlas?'

          echo '=== NEGATION / DISTRACTOR RESISTANCE ==='
          "$MAG" ingest 'Project Borealis uses PostgreSQL, not MySQL.'
          "$MAG" ingest 'A discarded prototype once used MySQL for an unrelated demo.'
          "$MAG" search 'Which database does Borealis use?'

          echo '=== UNICODE / MULTILINE / PUNCTUATION ==='
          "$MAG" ingest $'Client note: café access code is ٤٢.\nOwner: Zoë.\nDo not normalize the identifier A/B-17.'
          "$MAG" search 'Who owns the cafe access note and what identifier must remain unchanged?'

          echo '=== EMPTY / MALFORMED INPUTS ==='
          set +e
          "$MAG" ingest ''
          echo "empty-ingest-exit=$?"
          "$MAG" search ''
          echo "empty-search-exit=$?"
          "$MAG" search '   '
          echo "whitespace-search-exit=$?"
          set -e

          echo '=== LARGE INPUT ==='
          python3 - <<'PY' > "$RUNNER_TEMP/large.txt"
          print('Large-context sentinel MAG-LARGE-9472. ' + ('alpha beta gamma delta ' * 20000))
          PY
          LARGE=$(cat "$RUNNER_TEMP/large.txt")
          set +e
          timeout 60 "$MAG" ingest "$LARGE"
          echo "large-ingest-exit=$?"
          timeout 30 "$MAG" search 'What is the large-context sentinel?'
          echo "large-search-exit=$?"
          set -e

          echo '=== RAPID SEQUENTIAL WRITES ==='
          for i in $(seq 1 100); do
            "$MAG" ingest "Load-test memory item $i, token LOAD-$i" >/dev/null
          done
          "$MAG" search 'token LOAD-73'

          echo '=== CONCURRENT WRITES ==='
          set +e
          seq 1 20 | xargs -P 8 -I{} sh -c '"$1" ingest "Concurrent memory {}, token CONCURRENT-{}" >/dev/null' _ "$MAG"
          concurrent_exit=$?
          echo "concurrent-write-exit=$concurrent_exit"
          "$MAG" search 'CONCURRENT-17'
          set -e

          echo '=== MCP REAL CLIENT SESSION ==='
          python3 - "$MAG" <<'PY'
          import json, os, subprocess, sys, time
          mag = sys.argv[1]
          p = subprocess.Popen([mag, 'serve'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, env=os.environ.copy())
          def send(obj):
              p.stdin.write(json.dumps(obj) + '\n'); p.stdin.flush()
          def recv(timeout=20):
              end=time.time()+timeout
              while time.time()<end:
                  line=p.stdout.readline()
                  if not line: raise RuntimeError('server stdout closed')
                  try: msg=json.loads(line)
                  except json.JSONDecodeError: continue
                  if 'id' in msg: return msg
              raise TimeoutError('MCP response timeout')
          send({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2024-11-05','capabilities':{},'clientInfo':{'name':'product-trial','version':'1'}}})
          print('initialize=', recv())
          send({'jsonrpc':'2.0','method':'notifications/initialized'})
          send({'jsonrpc':'2.0','id':2,'method':'tools/list','params':{}})
          tools=recv(); print('tools/list count=', len(tools.get('result',{}).get('tools',[])))
          send({'jsonrpc':'2.0','id':3,'method':'tools/call','params':{'name':'memory_store','arguments':{'content':'MCP-only sentinel is MCP-8821','importance':0.9}}})
          print('memory_store=', recv())
          send({'jsonrpc':'2.0','id':4,'method':'tools/call','params':{'name':'memory_search','arguments':{'query':'What is the MCP-only sentinel?'}}})
          print('memory_search=', recv())
          send({'jsonrpc':'2.0','id':5,'method':'tools/call','params':{'name':'definitely_not_a_tool','arguments':{}}})
          print('unknown_tool=', recv())
          p.stdin.close(); p.terminate(); p.wait(timeout=10)
          PY

          echo '=== REOPEN / FINAL HEALTH ==='
          "$MAG" doctor || true
          "$MAG" search 'current Atlas deployment region'
          "$MAG" search 'LOAD-73'
          "$MAG" search 'MCP-8821'

          echo '=== PRODUCT TRIAL COMPLETE ==='

      - name: Upload trial report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-trial-report
          path: ${{ runner.temp }}/product-trial-report.txt
          if-no-files-found: warn
