name: Verify final runtime review
on:
  push:
    branches: [agent/recovery-author-20260910]
    paths: [.github/workflows/recovery-final-review.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Reproduce and fix the independent findings
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/final-runtime"
          cp .recovery-review/final-runtime.py "$RUNNER_TEMP/final-runtime.py"
          git switch -c agent/recovery-final-reviewed 47a33b6033d670c4d40bf0f62fc6b6a3671a618c
          python3 - <<'PY'
          import os
          from pathlib import Path
          runner = Path('benches/runtime_behaviour/runner.rs').read_text()
          a = runner.index('    let note_space = ')
          b = runner.index('\n\n    let needs_corpus', a)
          closure = runner[a:b] + '\n'
          helper = Path(os.environ['RUNNER_TEMP']) / 'final-runtime.py'
          text = helper.read_text()
          a = text.index("old='''    let note_space")
          b = text.index('assert old in s', a)
          text = text[:a] + 'old=' + repr(closure) + '\n' + text[b:]
          # Preserve every group's identity comparison, not only the first read.
          body = closure.split('-> Result<()> {\n', 1)[1].rsplit('\n    };', 1)[0]
          body = '\n'.join(line[4:] for line in body.splitlines())
          body = body.replace('persisted_embedding_space(path)?', 'persisted_embedding_space(path).await?')
          start = text.index('async fn note_space(path: &Path, space: &mut Option<String>) -> Result<()> {')
          end = text.index('\n}\n\n#[cfg(test)]', start) + 2
          replacement = 'async fn note_space(path: &Path, space: &mut Option<String>) -> Result<()> {\n' + body + '\n}'
          text = text[:start] + replacement + text[end:]
          # Add the annotation invariant after the partition closure's last use.
          start = text.index("p=Path('benches/runtime_behaviour/dataset/validation.rs')")
          end = text.index("p=Path('benches/runtime_behaviour/README.md')", start)
          guard = '''    for c in &data.questions {
              if c.expect_abstain != c.relevant_keys.is_empty() {
                  failures.push(format!("question {} has inconsistent abstention and relevant_keys", c.id));
              }
          }
          '''
          replacement = "p=Path('benches/runtime_behaviour/dataset/validation.rs'); s=p.read_text()\n"
          replacement += "needle='    let mut supersession_keys = BTreeSet::new();'\nassert s.count(needle) == 1\n"
          replacement += 's=s.replace(needle, ' + repr(guard) + ' + needle)\np.write_text(s)\n'
          text = text[:start] + replacement + text[end:]
          compile(text, str(helper), 'exec')
          helper.write_text(text)
          # Reuse the existing fixture so mutations get a valid manifest digest.
          tests = Path('tests/runtime_behaviour_eval.rs')
          text = tests.read_text()
          helper_code = '''
          fn mutated_validation(edit: impl FnOnce(&mut Value)) -> Output {
              let temporary = edited_dataset(|data, _| edit(data));
              run(&["--dataset", temporary.path().to_str().unwrap(), "--validate-only"])
          }
          '''
          boundary = text.index('\n#[test]')
          tests.write_text(text[:boundary] + '\n' + helper_code + text[boundary:])
          PY
          python3 "$RUNNER_TEMP/final-runtime.py" > "$RUNNER_TEMP/final-runtime/red.log" 2>&1 || { tail -120 "$RUNNER_TEMP/final-runtime/red.log"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          p = Path('benches/runtime_behaviour/runner.rs')
          text = p.read_text()
          start = text.index('\nasync fn note_space(')
          end = text.index('\n#[cfg(test)]\nmod review_tests', start)
          helper = text[start:end]
          text = text[:start] + text[end:]
          boundary = text.index('\n#[cfg(test)]')
          p.write_text(text[:boundary] + helper + '\n' + text[boundary:])
          PY
          cargo fmt --all
          cargo test --locked --no-default-features --bin memory_runtime_eval --test runtime_behaviour_eval > "$RUNNER_TEMP/final-runtime/placeholder.log" 2>&1 || { tail -100 "$RUNNER_TEMP/final-runtime/placeholder.log"; exit 1; }
          cargo test --locked --bin memory_runtime_eval --test runtime_behaviour_eval > "$RUNNER_TEMP/final-runtime/default.log" 2>&1 || { tail -100 "$RUNNER_TEMP/final-runtime/default.log"; exit 1; }
          cargo clippy --locked --all-targets --all-features -- -D warnings > "$RUNNER_TEMP/final-runtime/clippy.log" 2>&1 || { tail -100 "$RUNNER_TEMP/final-runtime/clippy.log"; exit 1; }
          cargo fmt --all -- --check
      - name: Publish verified review changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('meta/reviews/runtime-behaviour-recovery.md')
          text = p.read_text().replace('3977722805', '3978075206').replace('3977722810', '3978075227').replace('3977722814', '3978075232')
          p.write_text(text + '\nVerification continuation: run ' + os.environ['GITHUB_RUN_ID'] + ' reproduced both executor failures and all four privacy/annotation failures before applying fixes. The same tree then passed feature-free and default-feature diagnostic unit/process tests, strict all-target/all-feature Clippy, and formatting. Previous workbench runs stopped on missing/stale patch helpers, not successful verification; this run reuses edited_dataset to recompute valid manifest digests. Exact-head CI and fresh independent review remain required before merge.\n')
          PY
          git diff --exit-code -- src data/runtime_behaviour_eval/v1 benches/runtime_behaviour/baselines
          git config user.name George
          git config user.email 180932462+George-RD@users.noreply.github.com
          git add benches/runtime_behaviour/runner.rs benches/runtime_behaviour/backend.rs benches/runtime_behaviour/main.rs benches/runtime_behaviour/dataset/validation.rs benches/runtime_behaviour/README.md tests/runtime_behaviour_eval.rs meta/reviews/runtime-behaviour-recovery.md
          git diff --cached --check
          test -z "$(git diff --name-only)"
          git commit -m 'fix(eval): isolate SQLite work and reject misleading evaluation metadata'
          git rev-parse HEAD > "$RUNNER_TEMP/final-runtime/source.txt"
          git rev-parse HEAD^{tree} >> "$RUNNER_TEMP/final-runtime/source.txt"
          git bundle create "$RUNNER_TEMP/final-runtime/final-runtime.bundle" agent/recovery-final-reviewed
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/agent/recovery-final-reviewed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-runtime-review
          path: ${{ runner.temp }}/final-runtime/
          retention-days: 14
          if-no-files-found: error
