name: Cairn scan capture

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Refresh interface baseline
        run: |
          cairn scan || true
          echo '--- interface-hashes.json ---'
          cat .cairn/state/interface-hashes.json
          echo '--- git diff ---'
          git diff -- .cairn/state/interface-hashes.json
