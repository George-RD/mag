name: Local-first bootstrap

on:
  push:
    branches: [agent/local-first-lfm25]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/local-first-lfm25
          fetch-depth: 0
