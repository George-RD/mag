    pub fn local_default() -> Self {
        let mut config = Self::ollama(DEFAULT_LOCAL_LLM_MODEL, DEFAULT_LOCAL_LLM_BASE_URL);
        config.temperature = 0.1;
        config
    }
}

impl Default for LlmConfig {
    fn default() -> Self {
        Self::local_default()
    }
