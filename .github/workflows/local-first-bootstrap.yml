              "This document is the single source of truth for planned structural improvements to MAG. It covers four phases spanning v0.1.9 through v0.2.2, 15 pull requests, their dependencies, quality gates, risk mitigations, and parked items.\n",
              """This document is the single source of truth for planned structural improvements to MAG. It covers four phases spanning v0.1.9 through v0.2.2, 15 pull requests, their dependencies, quality gates, risk mitigations, and parked items.

