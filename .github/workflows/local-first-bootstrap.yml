          local_replacement = """    pub fn ollama(model: impl Into<String>, base_url: impl Into<String>) -> Self {
        Self {
            provider: LlmProvider::Ollama,
            model: model.into(),
            api_key: None,
            base_url: Some(base_url.into()),
