name: Refresh setup Cairn state

on:
  push:
    branches:
      - fix/setup-command-transport
    paths:
      - .github/workflows/refresh-setup-cairn-state.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/setup-command-transport
          fetch-depth: 0
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Refresh intentional interface baseline
        run: cairn scan
      - name: Commit Cairn state
        run: |
          rm .github/workflows/refresh-setup-cairn-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(cairn): refresh setup interface baseline"
          git push origin HEAD:fix/setup-command-transport
