name: Refresh composition decision Cairn state

on:
  push:
    branches:
      - docs/select-local-runtime-root
    paths:
      - .github/workflows/refresh-composition-cairn.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/select-local-runtime-root
          fetch-depth: 0
      - name: Refresh verified source hashes
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import re

          pairs = {
              Path("meta/sources/src.local-first-roadmap.md"): Path("docs/specs/local-first-roadmap.md"),
              Path("meta/sources/src.mag-agents-guide.md"): Path("AGENTS.md"),
          }
          for manifest, source in pairs.items():
              digest = sha256(source.read_bytes()).hexdigest()
              text = manifest.read_text()
              updated, count = re.subn(r"(?m)^sha256: [0-9a-f]{64}$", f"sha256: {digest}", text)
              if count != 1:
                  raise SystemExit(f"{manifest}: expected one sha256 field, found {count}")
              manifest.write_text(updated)
          PY
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Refresh generated architecture state
        run: cairn scan
      - name: Commit refreshed state
        run: |
          rm .github/workflows/refresh-composition-cairn.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(cairn): refresh composition decision state"
          git push origin HEAD:docs/select-local-runtime-root
