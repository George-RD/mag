name: Apply re-embed CLI fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/embedding-space-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply focused source fix
        run: |
          python - <<'PY'
          from pathlib import Path

          cli = Path('src/cli.rs')
          text = cli.read_text()
          marker = "#[derive(Parser)]\n#[command(name = \"mag\", version)]"
          parser = '''fn parse_positive_usize(value: &str) -> Result<usize, String> {
              let value = value
                  .parse::<usize>()
                  .map_err(|error| format!("invalid positive integer: {error}"))?;
              if value == 0 {
                  return Err("value must be greater than zero".to_string());
              }
              Ok(value)
          }

          '''
          if 'fn parse_positive_usize' not in text:
              if marker not in text:
                  raise SystemExit('CLI insertion marker not found')
              text = text.replace(marker, parser + marker, 1)
          old = 'value_parser = clap::value_parser!(usize).range(1..)'
          if old not in text:
              raise SystemExit('unsupported clap range expression not found')
          text = text.replace(old, 'value_parser = parse_positive_usize', 1)
          cli.write_text(text)

          test = Path('tests/reembed_cli.rs')
          text = test.read_text()
          old = '''    let error = Cli::try_parse_from(["mag", "re-embed", "--batch-size", "0"])
                  .expect_err("zero batch size must be rejected by clap");
          '''
          new = '''    let error = match Cli::try_parse_from(["mag", "re-embed", "--batch-size", "0"]) {
              Ok(_) => panic!("zero batch size must be rejected by clap"),
              Err(error) => error,
          };
          '''
          if old not in text:
              raise SystemExit('CLI test replacement marker not found')
          test.write_text(text.replace(old, new, 1))
          PY
          cargo fmt -- src/cli.rs tests/reembed_cli.rs
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "George"
          git config user.email "180932462+George-RD@users.noreply.github.com"
          git add src/cli.rs tests/reembed_cli.rs
          git commit -m "fix(cli): validate re-embed batch size"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
