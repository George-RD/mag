name: Local-first PR trigger

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/local-first-lfm25'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/local-first-lfm25
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply local-first profile
        run: |
          python3 scripts/apply-local-first.py
          python3 scripts/fix-rust-1-97-clippy.py
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: |
          set +e
          cargo clippy --quiet --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/local-first-clippy.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Test
        run: |
          set +e
          cargo test --quiet --all-features 2>&1 | tee /tmp/local-first-test.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-first-validation-diagnostics
          path: |
            /tmp/local-first-clippy.log
            /tmp/local-first-test.log
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md docs/configuration.md docs/specs/execution-roadmap.md \
            docs/specs/local-first-roadmap.md src/memory_core/llm.rs \
            src/memory_core/storage/sqlite/crud.rs skills/mag-development/SKILL.md
          git commit -m 'feat(llm): set LFM2.5 local-first profile'
          git push origin HEAD:agent/local-first-lfm25
