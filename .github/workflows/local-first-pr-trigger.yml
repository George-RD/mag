name: Local-first PR trigger

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/local-first-lfm25'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/local-first-lfm25
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply local-first profile
        run: python3 scripts/apply-local-first.py
      - name: Validate
        run: |
          cargo fmt --all
          cargo clippy --quiet --all-targets --all-features -- -D warnings
          cargo test --quiet --all-features
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md docs/configuration.md docs/specs/execution-roadmap.md \
            docs/specs/local-first-roadmap.md src/memory_core/llm.rs \
            skills/mag-development/SKILL.md
          git commit -m 'feat(llm): set LFM2.5 local-first profile'
          git push origin HEAD:agent/local-first-lfm25
