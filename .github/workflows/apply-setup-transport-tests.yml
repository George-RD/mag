name: Apply setup transport regression tests

on:
  push:
    branches:
      - fix/setup-command-transport
    paths:
      - .github/workflows/apply-setup-transport-tests.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/setup-command-transport
          fetch-depth: 0
      - name: Apply regression tests
        run: python scripts/apply_setup_transport_tests.py
      - name: Commit staged test-first change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(setup): expose unsupported transport regression"
          git push origin HEAD:fix/setup-command-transport
