name: Implement atomic checkpoint outcomes v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-implement-atomic-checkpoints-v2.yml

permissions:
  contents: write

concurrency:
  group: implement-atomic-checkpoints-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Apply the atomic checkpoint transformation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          crud_path = Path("src/memory_core/storage/sqlite/crud.rs")
          crud = crud_path.read_text()
          canonical = '''            .context("failed to update access_count for canonical dedup")?;
                      return Ok((StoreOutcome::Deduped, Vec::new(), Vec::new()));
          '''
          canonical_expected = '''            .context("failed to update access_count for canonical dedup")?;
                  return Ok((StoreOutcome::Deduped, Vec::new(), Vec::new()));
          '''
          jaccard = '''                .context("failed to update access_count for Jaccard dedup")?;
                          return Ok((StoreOutcome::Deduped, Vec::new(), Vec::new()));
          '''
          jaccard_expected = '''                .context("failed to update access_count for Jaccard dedup")?;
                      return Ok((StoreOutcome::Deduped, Vec::new(), Vec::new()));
          '''
          if canonical not in crud or jaccard not in crud:
              raise RuntimeError("dedup source blocks changed before atomic checkpoint implementation")
          crud = crud.replace(canonical, canonical_expected, 1)
          crud = crud.replace(jaccard, jaccard_expected, 1)
          crud_path.write_text(crud)

          workflow = Path(
              ".github/workflows/agent-implement-atomic-checkpoints.yml"
          ).read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = dedent(workflow[start:end])
          exec(compile(script, "atomic-checkpoint-transform", "exec"))
          PY
          cargo fmt --all

      - name: Verify checkpoint behavior
        run: |
          cargo test --quiet --all-features \
            --test checkpoint_outcomes \
            --test cli_checkpoint_runtime_migration \
            --test mcp_legacy_session_runtime_migration \
            --test local_memory_runtime
          cargo clippy --quiet --all-targets --all-features -- \
            -D warnings -A clippy::manual_filter

      - name: Install and reconcile Cairn
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cairn scan
          cairn hook all

      - name: Remove one-off workflows and commit implementation
        run: |
          rm .github/workflows/agent-implement-atomic-checkpoints.yml
          rm .github/workflows/agent-implement-atomic-checkpoints-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(checkpoint): return atomic persisted outcomes"
          git push origin "HEAD:${TARGET_BRANCH}"
