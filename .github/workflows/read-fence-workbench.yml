name: Read fence workbench
on:
  push:
    branches: [agent/embedding-space-read-fence]
    paths: [.github/workflows/read-fence-workbench.yml]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Require assertion failures before implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/read-fence-evidence
          for feature in fallback vec; do
            flags=()
            if [ "$feature" = vec ]; then flags=(--features sqlite-vec); fi
            set +e
            cargo test --no-default-features "${flags[@]}" --test reembed_stale_runtime -- --nocapture 2>&1 | tee "/tmp/read-fence-evidence/red-$feature.log"
            status=${PIPESTATUS[0]}
            set -e
            test "$status" -ne 0
            grep -q 'test result: FAILED. 1 passed; 4 failed' "/tmp/read-fence-evidence/red-$feature.log"
            grep -q 'stale semantic reads must fail visibly' "/tmp/read-fence-evidence/red-$feature.log"
            grep -q 'stale cached advanced reads must fail visibly' "/tmp/read-fence-evidence/red-$feature.log"
            grep -q 'round-trip migration must not revive an old generation' "/tmp/read-fence-evidence/red-$feature.log"
            grep -q 'migration racing a semantic read must fail visibly' "/tmp/read-fence-evidence/red-$feature.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read-fence-red
          path: /tmp/read-fence-evidence/
          retention-days: 14
