name: Schema comparison authoring
on:
  push:
    branches: [agent/memory-intelligence-schema-comparison]
    paths: [.github/workflows/schema-comparison-author.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt
      - name: Apply readable local implementation and verify exact code bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          python3 .github/schema-implementation.py
          python3 .github/schema-tests-runner.py
          python3 .github/schema-docs.py
          sha256sum --check <<'SUMS'
          b784fde407475dfd5f6e8ddce1b277ccdc6feff562554f5b8f288d8640ca656e  .github/workflows/memory-intelligence-eval.yml
          97a7c334bf6236a5ea37186c68652f401b583d4535a33ebbfa3b01077a082e3f  benches/memory_intelligence/local_baseline.py
          b77e4d766bceb51d65afecf71cadb7b9e28ad38bc12f7e5fd712264fd10e87cc  src/cli.rs
          34b412f74e8b40962b46a1efbc9476ac95965344806deef88e1f011eef88b036  src/intelligence_cli.rs
          b0cc8ceec6846eedea312881331e14308c99ce1cfc664c47ec81f8b2d1ca75e0  src/lib.rs
          aa48aff9b8e56d4dda6526eff9dcb9e94d7d698f300a793b400d7934e570dcd4  src/local_memory_runtime/intelligence.rs
          ed555955b4532915ec14f93dabad100ddb93409d6aef3d889819a358ee5cb112  src/memory_core/llm.rs
          9a2770cd4a246a08b5fd77c1185adfedf4d9d88af88d429cbfcf2b1ec6c78692  tests/memory_intelligence_producer_cli.rs
          b245200e6f1c8189e5283a81095d7b7d9ec7130d3eac95d1bd9d226cdf4d43b0  tests/memory_intelligence_producer_runtime.rs
          cf5fa3856a932dd20cd391f6b3c2dc297ddef5b7ff9c7f34244dd9d4eb3061ab  tests/test_memory_intelligence_local_baseline.py
          SUMS
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Verify Python regressions
        run: python3 -m unittest discover -s tests -p 'test_memory_intelligence_*.py' -v 2>&1 | tee "$RUNNER_TEMP/candidate/python-tests.log"
      - name: Remove temporary authoring files and verify Cairn
        run: |
          set -euo pipefail
          rm .github/schema-implementation.py .github/schema-tests-runner.py .github/schema-docs.py
          rm .github/workflows/schema-comparison-source.yml .github/workflows/schema-comparison-author.yml
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          export PATH="$HOME/.cargo/bin:$PATH"
          cairn feedback 'brief todo.wire-lfm25-production-ingestion reports no match although status lists the in-progress file and the owning node bundle resolves; expected stable todo identity lookup.'
          cairn scan 2>&1 | tee "$RUNNER_TEMP/candidate/cairn-scan.log"
          cairn hook all 2>&1 | tee "$RUNNER_TEMP/candidate/cairn-hooks.log"
      - name: Create exact formatted candidate objects without updating any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          from urllib.request import Request, urlopen
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          root = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def post(path, payload):
              req = Request(root + path, data=json.dumps(payload).encode(), method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urlopen(req, timeout=60) as response:
                  return json.load(response)
          subprocess.run(['git', 'add', '-u'], check=True)
          subprocess.run(['git', 'add', 'benches/memory_intelligence/SCHEMA_COMPARISON.md', 'meta/reviews/memory-intelligence-schema-comparison.md'], check=True)
          parent = git('rev-parse', 'HEAD')
          entries = []
          changes = subprocess.check_output(['git', 'diff', '--cached', '--name-status', '--no-renames', '-z']).decode().split('\0')
          for status, path in zip(changes[::2], changes[1::2]):
              entry = {'path': path, 'mode': '100644', 'type': 'blob', 'sha': None}
              if status != 'D':
                  raw = Path(path).read_bytes()
                  blob = post('/git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
                  assert blob['sha'] == git('hash-object', path), path
                  entry['sha'] = blob['sha']
              entries.append(entry)
          tree = post('/git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})
          assert tree['sha'] == git('write-tree'), 'remote tree differs from formatted local index'
          commit = post('/git/commits', {'message': 'feat(eval): add unrepaired native schema diagnostic and regressions', 'tree': tree['sha'], 'parents': [parent]})
          result = {'commit': commit['sha'], 'parent': parent, 'tree': tree['sha'], 'rustc': subprocess.check_output(['rustc', '--version']).decode().strip(), 'ref_updated': False}
          out = Path(os.environ['RUNNER_TEMP']) / 'candidate'
          (out / 'candidate.json').write_text(json.dumps(result, indent=2) + '\n')
          subprocess.run(['git', 'archive', '--output=' + str(out / 'source.tar'), tree['sha']], check=True)
          (out / 'implementation.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary']))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: schema-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7
