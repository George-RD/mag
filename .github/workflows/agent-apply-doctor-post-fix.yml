name: Apply doctor post-fix recheck

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/agent-apply-doctor-post-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/doctor-post-fix-recheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Implement bounded doctor recheck
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          checks_path = Path("src/doctor_checks.rs")
          checks = checks_path.read_text()
          marker = "use std::path::Path;\n\n"
          state = '''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum DoctorRunState {
              Initial,
              PostFix,
          }

          impl DoctorRunState {
              pub(crate) const fn allows_fixes(self) -> bool {
                  matches!(self, Self::Initial)
              }

              pub(crate) const fn after_fixes(self) -> Self {
                  Self::PostFix
              }
          }

          '''
          if "pub(crate) enum DoctorRunState" not in checks:
              if marker not in checks:
                  raise SystemExit("doctor_checks insertion marker not found")
              checks = checks.replace(marker, marker + state, 1)
              checks_path.write_text(checks)

          main_path = Path("src/main.rs")
          source = main_path.read_text()

          start_old = '''async fn run_doctor(fix: bool) -> anyhow::Result<()> {
              let mut results: Vec<CheckResult> = Vec::new();
          '''
          start_new = '''async fn run_doctor(fix: bool) -> anyhow::Result<()> {
              let mut run_state = doctor_checks::DoctorRunState::Initial;

              loop {
                  let mut results: Vec<CheckResult> = Vec::new();
          '''
          if start_old not in source:
              raise SystemExit("run_doctor start marker not found")
          source = source.replace(start_old, start_new, 1)

          prompt_old = "    if fix {\n"
          prompt_new = "    if run_state.allows_fixes() && fix {\n"
          if prompt_old not in source:
              raise SystemExit("--fix prompt marker not found")
          source = source.replace(prompt_old, prompt_new, 1)

          interactive_old = "    } else if std::io::IsTerminal::is_terminal(&std::io::stdin()) {\n"
          interactive_new = "    } else if run_state.allows_fixes() && std::io::IsTerminal::is_terminal(&std::io::stdin()) {\n"
          if interactive_old not in source:
              raise SystemExit("interactive prompt marker not found")
          source = source.replace(interactive_old, interactive_new, 1)

          hint_old = "    } else if !auto_fixable.is_empty() {\n"
          hint_new = "    } else if run_state.allows_fixes() && !auto_fixable.is_empty() {\n"
          if hint_old not in source:
              raise SystemExit("non-interactive hint marker not found")
          source = source.replace(hint_old, hint_new, 1)

          automatic_apply = "        apply_doctor_fixes(&auto_fixable).await?;\n"
          automatic_recheck = automatic_apply + '''        if !auto_fixable.is_empty() {
              run_state = run_state.after_fixes();
              continue;
          }
          '''
          if automatic_apply not in source:
              raise SystemExit("automatic fix call not found")
          source = source.replace(automatic_apply, automatic_recheck, 1)

          interactive_apply = "            apply_doctor_fixes(&auto_fixable).await?;\n"
          interactive_recheck = interactive_apply + '''            if !auto_fixable.is_empty() {
                  run_state = run_state.after_fixes();
                  continue;
              }
          '''
          if interactive_apply not in source:
              raise SystemExit("interactive fix call not found")
          source = source.replace(interactive_apply, interactive_recheck, 1)

          final_old = '''    let hard_failures: Vec<_> = failures
              .iter()
              .filter(|r| r.status == CheckStatus::Fail)
              .collect();
          if hard_failures.is_empty() {
              Ok(())
          } else {
              anyhow::bail!(
                  "{} doctor check(s) failed. See above for details.",
                  hard_failures.len()
              );
          }
          }

          async fn apply_doctor_fixes'''
          final_new = '''        anyhow::bail!(
              "{} doctor check(s) failed. See above for details.",
              failures.len()
          );
              }
          }

          async fn apply_doctor_fixes'''
          if final_old not in source:
              raise SystemExit("doctor finalization marker not found")
          source = source.replace(final_old, final_new, 1)
          main_path.write_text(source)
          PY
      - name: Format and run focused regression
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --quiet --all-features post_fix_pass_disables_a_second_fix_attempt
      - name: Commit implementation and remove helper workflow
        shell: bash
        run: |
          git config user.name "George"
          git config user.email "180932462+George-RD@users.noreply.github.com"
          git rm .github/workflows/agent-apply-doctor-post-fix.yml
          git add src/main.rs src/doctor_checks.rs
          git diff --cached --check
          git commit -m "fix(doctor): recheck after applying fixes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
