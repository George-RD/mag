name: Implement atomic checkpoint outcomes v4

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-implement-atomic-checkpoints-v4.yml

permissions:
  contents: write

concurrency:
  group: implement-atomic-checkpoints-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Apply checkpoint implementation with direct immediate transaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          from textwrap import dedent

          workflow = check_output(
              [
                  "git",
                  "show",
                  "fe562057aec55170a43b42d608ca2ef1528e786b:.github/workflows/agent-implement-atomic-checkpoints-v3.yml",
              ],
              text=True,
          )
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = dedent(workflow[start:end])
          exec(compile(script, "atomic-checkpoint-transform-v3", "exec"))

          session = Path("src/memory_core/storage/sqlite/session.rs")
          text = session.read_text()
          old = '''                let mut conn = pool.writer()?;
                          let tx = retry_on_lock(|| {
                              conn.transaction_with_behavior(
                                  rusqlite::TransactionBehavior::Immediate,
                              )
                          })
                          .context("failed to start immediate checkpoint transaction")?;
          '''
          new = '''                let mut conn = pool.writer()?;
                          // The connection has a bounded SQLite busy timeout, so BEGIN
                          // IMMEDIATE waits for another process's writer before returning.
                          // Calling it directly keeps the returned transaction's borrow
                          // tied to `conn`; a generic retry closure cannot safely return it.
                          let tx = conn
                              .transaction_with_behavior(rusqlite::TransactionBehavior::Immediate)
                              .context("failed to start immediate checkpoint transaction")?;
          '''
          if text.count(old) != 1:
              raise RuntimeError(
                  f"expected one immediate transaction retry block, found {text.count(old)}"
              )
          session.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all

      - name: Verify checkpoint behavior
        run: |
          cargo test --quiet --all-features \
            --test checkpoint_outcomes \
            --test cli_checkpoint_runtime_migration \
            --test mcp_legacy_session_runtime_migration \
            --test local_memory_runtime
          cargo clippy --quiet --all-targets --all-features -- \
            -D warnings -A clippy::manual_filter

      - name: Install and reconcile Cairn
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cairn scan
          cairn hook all

      - name: Remove one-off workflow and commit implementation
        run: |
          rm .github/workflows/agent-implement-atomic-checkpoints-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(checkpoint): return atomic persisted outcomes"
          git push origin "HEAD:${TARGET_BRANCH}"
