name: Agent apply related retrieval runtime

on:
  push:
    branches:
      - agent/cli-related-retrieval-runtime
    paths:
      - .github/workflows/agent-related-retrieval-implementation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cli-related-retrieval-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply the verified runtime migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old in text:
                  target.write_text(text.replace(old, new, 1))
                  return
              if new not in text:
                  raise SystemExit(f"expected migration anchor not found in {path}")

          replace_once(
              "src/local_memory_runtime.rs",
              """    AdvancedSearcher, Deleter, Embedder, ListResult, Lister, MemoryInput, MemoryUpdate,\n    PhraseSearcher, Pipeline, PlaceholderPipeline, Relationship, RelationshipQuerier,\n    SearchOptions, SearchResult, SemanticResult,\n""",
              """    AdvancedSearcher, Deleter, Embedder, ListResult, Lister, MemoryInput, MemoryUpdate,\n    PhraseSearcher, Pipeline, PlaceholderPipeline, Relationship, RelationshipQuerier,\n    SearchOptions, SearchResult, SemanticResult, SimilarFinder, VersionChainQuerier,\n""",
          )
          replace_once(
              "src/local_memory_runtime.rs",
              """    /// Runs the current SQLite advanced-search implementation.\n    pub async fn advanced_search(\n        &self,\n        query: &str,\n        limit: usize,\n        options: &SearchOptions,\n    ) -> Result<Vec<SemanticResult>> {\n        self.storage.advanced_search(query, limit, options).await\n    }\n}\n""",
              """    /// Runs the current SQLite advanced-search implementation.\n    pub async fn advanced_search(\n        &self,\n        query: &str,\n        limit: usize,\n        options: &SearchOptions,\n    ) -> Result<Vec<SemanticResult>> {\n        self.storage.advanced_search(query, limit, options).await\n    }\n\n    /// Returns the current version chain without changing ordering or metadata semantics.\n    pub async fn version_chain(&self, memory_id: &str) -> Result<Vec<SearchResult>> {\n        self.storage.get_version_chain(memory_id).await\n    }\n\n    /// Finds similar memories without changing scoring, filtering, or result fields.\n    pub async fn find_similar(\n        &self,\n        memory_id: &str,\n        limit: usize,\n    ) -> Result<Vec<SemanticResult>> {\n        self.storage.find_similar(memory_id, limit).await\n    }\n}\n""",
          )

          replace_once(
              "src/main.rs",
              """    FeedbackRecorder, GraphTraverser, LessonQuerier, MaintenanceManager, MemoryInput, MemoryUpdate,\n    ProfileManager, ReminderManager, SearchOptions, SimilarFinder, StatsProvider,\n    VersionChainQuerier, WelcomeOptions, WelcomeProvider, is_valid_event_type,\n""",
              """    FeedbackRecorder, GraphTraverser, LessonQuerier, MaintenanceManager, MemoryInput, MemoryUpdate,\n    ProfileManager, ReminderManager, SearchOptions, StatsProvider, WelcomeOptions, WelcomeProvider,\n    is_valid_event_type,\n""",
          )
          replace_once(
              "src/main.rs",
              """        Commands::VersionChain { id } => {\n            let chain = mcp_storage.get_version_chain(id).await?;\n""",
              """        Commands::VersionChain { id } => {\n            let chain = local_runtime.version_chain(id).await?;\n""",
          )
          replace_once(
              "src/main.rs",
              """            info!(\"Chain length: {}\", chain.len());\n""",
              """            info!(\n                chain_length = chain.len(),\n                \"Version chain retrieved through local memory runtime\"\n            );\n""",
          )
          replace_once(
              "src/main.rs",
              """        Commands::Similar { id, limit } => {\n            let results =\n                <SqliteStorage as SimilarFinder>::find_similar(&mcp_storage, id, *limit).await?;\n            let payload: Vec<_> = results\n""",
              """        Commands::Similar { id, limit } => {\n            let results = local_runtime.find_similar(id, *limit).await?;\n            info!(\n                result_count = results.len(),\n                \"Similarity search completed through local memory runtime\"\n            );\n            let payload: Vec<_> = results\n""",
          )

          replace_once(
              "tests/local_memory_runtime.rs",
              """    AdvancedSearcher, Deleter, EventType, Lister, MemoryInput, MemoryUpdate, PhraseSearcher,\n    Pipeline, PlaceholderEmbedder, PlaceholderPipeline, RelationshipQuerier, SearchOptions,\n""",
              """    AdvancedSearcher, Deleter, EventType, Lister, MemoryInput, MemoryUpdate, PhraseSearcher,\n    Pipeline, PlaceholderEmbedder, PlaceholderPipeline, RelationshipQuerier, SearchOptions,\n    SimilarFinder, VersionChainQuerier,\n""",
          )
          replace_once(
              "tests/local_memory_runtime.rs",
              """    let runtime_relations = runtime.get_relationships(&runtime_id).await.unwrap();\n    let direct_relations = legacy_storage.get_relationships(&legacy_id).await.unwrap();\n    assert_eq!(runtime_relations, direct_relations);\n    assert!(runtime_relations.is_empty());\n\n    let runtime_deleted = runtime.delete(&runtime_id).await.unwrap();\n""",
              """    let runtime_relations = runtime.get_relationships(&runtime_id).await.unwrap();\n    let direct_relations = legacy_storage.get_relationships(&legacy_id).await.unwrap();\n    assert_eq!(runtime_relations, direct_relations);\n    assert!(runtime_relations.is_empty());\n\n    let runtime_chain = runtime.version_chain(&runtime_id).await.unwrap();\n    let direct_chain = legacy_storage.get_version_chain(&legacy_id).await.unwrap();\n    assert_eq!(runtime_chain, direct_chain);\n    assert_eq!(runtime_chain.len(), 1);\n    assert_eq!(runtime_chain[0].id, runtime_id);\n\n    let related_content = \"offline indexing remains available to future local tools\";\n    let related_input = MemoryInput {\n        id: Some(\"runtime-parity-2\".to_string()),\n        content: related_content.to_string(),\n        tags: vec![\"runtime\".to_string(), \"similar\".to_string()],\n        metadata: serde_json::json!({\"source\": \"runtime-similar-parity\"}),\n        ..Default::default()\n    };\n    let runtime_related_id = runtime.store(related_content, &related_input).await.unwrap();\n    let legacy_related_id = legacy.run(related_content, &related_input).await.unwrap();\n    assert_eq!(runtime_related_id, legacy_related_id);\n\n    let runtime_similar = runtime.find_similar(&runtime_id, 1).await.unwrap();\n    let direct_similar = legacy_storage.find_similar(&legacy_id, 1).await.unwrap();\n    assert_eq!(runtime_similar, direct_similar);\n    assert_eq!(runtime_similar.len(), 1);\n    assert_eq!(runtime_similar[0].id, runtime_related_id);\n\n    let runtime_deleted = runtime.delete(&runtime_id).await.unwrap();\n""",
          )

          replace_once(
              "meta/todos/migrate-cli-to-local-memory-runtime.md",
              """- [x] `phrase-search` routes through `LocalMemoryRuntime`; phrase matching,\n  filters, ordering, exact compact JSON, and direct-storage parity remain pinned.\n- [ ] Migrate version chains, similarity, graph traversal, session, and\n  administration commands.\n""",
              """- [x] `phrase-search` routes through `LocalMemoryRuntime`; phrase matching,\n  filters, ordering, exact compact JSON, and direct-storage parity remain pinned.\n- [x] `version-chain` and `similar` route through `LocalMemoryRuntime`; version\n  ordering and metadata augmentation, similarity scores, exact compact JSON, and\n  direct-storage parity remain pinned.\n- [ ] Migrate graph traversal, session, and administration commands.\n""",
          )
          PY

          cargo fmt --all

          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          export PATH="$HOME/.cargo/bin:$PATH"
          cairn scan
          cairn hook all

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/local_memory_runtime.rs src/main.rs tests/local_memory_runtime.rs \
            meta/todos/migrate-cli-to-local-memory-runtime.md .cairn
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "refactor(cli): route related retrieval through local runtime"
          git push origin HEAD:agent/cli-related-retrieval-runtime
