name: Retrieval Baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.head_ref == 'agent/retrieval-baseline' || github.ref_name == 'agent/retrieval-baseline'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/retrieval-baseline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply adaptive semantic rescue once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/memory_core/storage/sqlite/pipeline/abstention.rs')
          s = p.read_text()
          marker = 'SEMANTIC_RESCUE_MIN_SIM'
          if marker not in s:
              raise SystemExit('implementation commit missing')
          PY
      - name: Quality gates
        id: quality
        continue-on-error: true
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo clippy --all-targets --all-features -- -D warnings
            cargo test --all-features
          } 2>&1 | tee /tmp/quality.log
      - name: Product retrieval evaluation
        id: product
        continue-on-error: true
        env:
          MAG_DATA_ROOT: ${{ runner.temp }}/mag-eval
          RUST_LOG: warn
        run: |
          set -o pipefail
          {
            cargo build --release
            MAG=target/release/mag
            $MAG ingest 'Retries must use exponential backoff with random jitter and stop after five attempts.'
            $MAG ingest 'The production database is PostgreSQL and backups run every night at 02:00 UTC.'
            $MAG ingest 'The design review is held on Wednesdays with Maya and the platform team.'
            $MAG ingest 'Customer invoices are retained for seven years for compliance.'
            echo '--- paraphrase expected ---'
            $MAG advanced-search 'What is our policy when requests keep failing?' --explain | tee /tmp/paraphrase.json
            grep -q 'exponential backoff' /tmp/paraphrase.json
            echo '--- unrelated expected abstention ---'
            $MAG advanced-search 'Which guitar strings should I buy for jazz?' --explain | tee /tmp/unrelated.json
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/unrelated.json'))
          assert d['results'] == [], d
          PY
            echo '--- exact and partial queries ---'
            $MAG search 'nightly production database backups' | grep -q PostgreSQL
            $MAG search 'how long are invoices kept' | grep -q 'seven years'
          } 2>&1 | tee /tmp/product.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-baseline-diagnostics
          path: |
            /tmp/quality.log
            /tmp/product.log
            /tmp/paraphrase.json
            /tmp/unrelated.json
      - name: Enforce results
        if: steps.quality.outcome != 'success' || steps.product.outcome != 'success'
        run: exit 1
