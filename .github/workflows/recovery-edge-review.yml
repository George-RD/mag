name: Verify runtime edge observation
on:
  push:
    branches: [agent/recovery-author-20260910]
    paths: [.github/workflows/recovery-edge-review.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Reproduce and fix inherited edge direction
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/edge-review"
          cp .recovery-review/supersession.py "$RUNNER_TEMP/supersession.py"
          sed -i 's/MemoryInput::new()/MemoryInput::default()/g' "$RUNNER_TEMP/supersession.py"
          git switch -c agent/recovery-edge-reviewed 0abdc38c1eaa7d5734847f07650391aab510abcc
          python3 "$RUNNER_TEMP/supersession.py" > "$RUNNER_TEMP/edge-review/red.log" 2>&1 || { tail -100 "$RUNNER_TEMP/edge-review/red.log"; exit 1; }
          cargo fmt --all
          cargo test --locked --no-default-features --bin memory_runtime_eval --test runtime_behaviour_eval > "$RUNNER_TEMP/edge-review/placeholder.log" 2>&1 || { tail -100 "$RUNNER_TEMP/edge-review/placeholder.log"; exit 1; }
          cargo test --locked --bin memory_runtime_eval --test runtime_behaviour_eval > "$RUNNER_TEMP/edge-review/default.log" 2>&1 || { tail -100 "$RUNNER_TEMP/edge-review/default.log"; exit 1; }
          cargo clippy --quiet --all-targets --all-features -- -D warnings > "$RUNNER_TEMP/edge-review/clippy.log" 2>&1 || { tail -100 "$RUNNER_TEMP/edge-review/clippy.log"; exit 1; }
      - name: Publish observer fix without changing the original archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name George
          git config user.email 180932462+George-RD@users.noreply.github.com
          git add benches/runtime_behaviour/families/supersession.rs benches/runtime_behaviour/baselines/2026-09-10-bge-small/README.md meta/reviews/runtime-behaviour-recovery.md
          git diff --cached --check
          git commit -m 'fix(eval): observe supersession in the production edge direction'
          git rev-parse HEAD > "$RUNNER_TEMP/edge-review/source.txt"
          git rev-parse HEAD^{tree} >> "$RUNNER_TEMP/edge-review/source.txt"
          git bundle create "$RUNNER_TEMP/edge-review/edge-reviewed.bundle" agent/recovery-edge-reviewed
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/agent/recovery-edge-reviewed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: edge-observation-review
          path: ${{ runner.temp }}/edge-review/
          retention-days: 14
          if-no-files-found: error
