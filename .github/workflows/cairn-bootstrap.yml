name: Cairn onboarding completion

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  complete:
    if: github.head_ref == 'agent/cairn-onboard-mag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cairn-onboard-mag
          fetch-depth: 0

      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply final architecture cleanup
        run: python3 scripts/complete-cairn-onboarding.py

      - name: Verify final Cairn state
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cairn scan
          cairn lint
          cairn hook all
          cairn status --json | tee /tmp/cairn-status.json

      - name: Commit verified non-workflow changes
        run: |
          # GITHUB_TOKEN cannot add/delete workflow files. Keep this temporary
          # workflow in the generated commit; the connected GitHub app replaces it
          # with the permanent gate after the branch push.
          git restore --source=HEAD -- .github/workflows/cairn-bootstrap.yml
          rm -f .github/workflows/cairn.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status --short
          git commit --no-verify -m 'chore(cairn): complete MAG onboarding architecture'
          git push origin HEAD:agent/cairn-onboard-mag
