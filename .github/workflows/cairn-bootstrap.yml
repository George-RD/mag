name: Cairn onboarding completion

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  complete:
    if: github.head_ref == 'agent/cairn-onboard-mag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cairn-onboard-mag
          fetch-depth: 0

      - name: Check whether completion is needed
        id: state
        run: |
          if [ -f .github/workflows/cairn.yml ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Cairn 0.9.0
        if: steps.state.outputs.run == 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply final architecture cleanup
        if: steps.state.outputs.run == 'true'
        run: python3 scripts/complete-cairn-onboarding.py

      - name: Verify final Cairn state
        if: steps.state.outputs.run == 'true'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cairn scan
          cairn lint
          cairn hook all
          cairn status --json | tee /tmp/cairn-status.json

      - name: Commit completed onboarding
        if: steps.state.outputs.run == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore(cairn): complete MAG onboarding and architecture gate'
          git push origin HEAD:agent/cairn-onboard-mag
