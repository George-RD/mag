name: Complete PR 426 MCP reference

on:
  push:
    branches:
      - agent/mcp-new-integrations-minimal

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Document the preferred facade actions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/mcp-tools.md")
          source = path.read_text()
          old = (
              "New integrations should launch `mag serve --mcp-tools minimal`, which advertises "
              "the four facade tools: `memory`, `memory_manage`, `memory_session`, and "
              "`memory_admin`. Plain `mag serve` and explicit `--mcp-tools full` retain the "
              "19-tool compatibility surface documented below for existing callers. All tools "
              "delegate to the same application/runtime workflows used by the CLI.\n\n"
              "## Storage"
          )
          new = (
              "New integrations should launch `mag serve --mcp-tools minimal`, which advertises "
              "the four facade tools below. Plain `mag serve` and explicit `--mcp-tools full` "
              "retain the 19-tool compatibility surface for existing callers. All tools delegate "
              "to the same application/runtime workflows used by the CLI.\n\n"
              "## Preferred minimal surface\n\n"
              "| Tool | Actions | Purpose |\n"
              "|------|---------|---------|\n"
              "| `memory` | `store`, `store_batch`, `retrieve`, `search`, `delete` | Core storage and retrieval |\n"
              "| `memory_manage` | `update`, `feedback`, `relations`, `lifecycle` | Changes, relationships, and maintenance |\n"
              "| `memory_session` | `info`, `checkpoint`, `remind`, `lessons`, `profile` | Session and cross-session workflows |\n"
              "| `memory_admin` | `health`, `list`, `export`, `import` | Diagnostics and data administration |\n\n"
              "Use the tool schema advertised by the MCP host for exact request fields. The "
              "sections below document the legacy compatibility tool names retained by full mode.\n\n"
              "## Storage"
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"MCP reference introduction: expected one match, found {count}")
          path.write_text(source.replace(old, new, 1))

          tests = Path("tests/mcp_setup_contract.rs")
          source = tests.read_text()
          addition = r'''

          #[test]
          fn mcp_reference_describes_canonical_minimal_facades() {
              let reference = include_str!("../docs/mcp-tools.md");
              for expected_row in [
                  "| `memory` | `store`, `store_batch`, `retrieve`, `search`, `delete` |",
                  "| `memory_manage` | `update`, `feedback`, `relations`, `lifecycle` |",
                  "| `memory_session` | `info`, `checkpoint`, `remind`, `lessons`, `profile` |",
                  "| `memory_admin` | `health`, `list`, `export`, `import` |",
              ] {
                  assert!(
                      reference.contains(expected_row),
                      "MCP reference is missing canonical facade row: {expected_row}"
                  );
              }
          }
          '''
          marker = "\n#[test]\nfn bundled_manifests_prefer_minimal_mcp_surface()"
          if source.count(marker) != 1:
              raise SystemExit("MCP contract test insertion marker drifted")
          tests.write_text(source.replace(marker, addition + marker, 1))
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --quiet --all-features --test mcp_setup_contract
      - name: Commit completed MCP reference
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mcp-tools.md tests/mcp_setup_contract.rs
          git commit -m "docs(mcp): describe preferred facade actions"
          git push origin HEAD:${{ github.ref_name }}
