name: Finish PR 426 documentation alignment

on:
  push:
    branches:
      - agent/mcp-new-integrations-minimal

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Correct facade names and CLI reference
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "docs/mcp-tools.md",
              "the four facade tools: `memory`, `session`, `manage`, and `admin`.",
              "the four facade tools: `memory`, `memory_manage`, `memory_session`, and `memory_admin`.",
              "canonical facade names",
          )

          replace_once(
              "docs/cli-reference.md",
              "<!-- Last verified: 2026-03-28 | Valid for: v0.1.2+ -->",
              "<!-- Last verified: 2026-08-26 | Valid for: v0.1.10+ -->",
              "CLI reference verification header",
          )
          replace_once(
              "docs/cli-reference.md",
              "| `--cross-encoder` | `false` | Enable cross-encoder reranking |",
              "| `--cross-encoder` | `false` | Enable cross-encoder reranking |\n| `--mcp-tools <full|minimal>` | `full` | Advertise the 19-tool compatibility surface or the preferred four facades |",
              "serve flag table",
          )
          replace_once(
              "docs/cli-reference.md",
              "```bash\nmag serve\nmag serve --cross-encoder\n```",
              "```bash\n# Preferred for new MCP integrations\nmag serve --mcp-tools minimal\n\n# Full 19-tool compatibility mode for existing callers\nmag serve\nmag serve --cross-encoder --mcp-tools full\n```",
              "serve examples",
          )

          replace_once(
              "site/index.html",
              "<div class=\"fact\"><b>Interface</b><span>CLI + 19 MCP tools</span></div>",
              "<div class=\"fact\"><b>Interface</b><span>CLI + 4-tool MCP facade</span></div>",
              "site interface summary",
          )

          test_path = Path("tests/mcp_setup_contract.rs")
          source = test_path.read_text()
          old = '''        ("Python README", include_str!("../python/README.md")),\n    ] {'''
          new = '''        ("Python README", include_str!("../python/README.md")),\n        ("CLI reference", include_str!("../docs/cli-reference.md")),\n        ("MCP reference", include_str!("../docs/mcp-tools.md")),\n        (\n            "setup contract",\n            include_str!("../meta/contracts/runtime.setup.md"),\n        ),\n    ] {'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"manual example test list: expected one match, found {count}")
          test_path.write_text(source.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --quiet --all-features --test mcp_setup_contract
      - name: Commit final documentation alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mcp-tools.md docs/cli-reference.md site/index.html tests/mcp_setup_contract.rs
          git commit -m "docs(mcp): use canonical facade names"
          git push origin HEAD:${{ github.ref_name }}
