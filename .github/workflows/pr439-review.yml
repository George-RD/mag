name: PR439 review TDD
on:
  push:
    branches: [agent/embedding-space-read-fence]
    paths: [.github/workflows/pr439-review.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate transport and apply RED regressions
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr439-review
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, runpy, sys
          p = Path('.github/pr439-review.py')
          s = p.read_text()
          # Correct two transcription errors in the temporary transport carrier;
          # both decoded patches must still match their independently recorded hashes.
          s = s.replace('XXK62+2L', 'XXK62L').replace('EpRCiUGENd', 'EpRCiUGNd')
          p.write_text(s)
          sys.argv = [str(p), 'red']
          data = runpy.run_path(str(p))
          for stage, (expected, encoded) in data['PATCHES'].items():
              patch = gzip.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(patch).hexdigest() == expected, stage
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Require real failing assertions before implementation
        shell: bash
        run: |
          set -euo pipefail
          for feature in fallback vec; do
            flags=()
            if [ "$feature" = vec ]; then flags=(--features sqlite-vec); fi
            for filter in hot_cache_refresh_rejects_migration_during_snapshot bounded_fts_candidates_preserve; do
              log="/tmp/pr439-review/red-$feature-$filter.log"
              set +e
              cargo test --no-default-features "${flags[@]}" --lib "$filter" 2>&1 | tee "$log"
              status=${PIPESTATUS[0]}
              set -e
              test "$status" = 101
              grep -q 'test result: FAILED' "$log"
              grep -Eq 'hot cache refresh must reject migration|FTS bound fixture must exceed' "$log"
            done
          done
      - name: Apply GREEN and run focused regressions
        run: |
          set -euo pipefail
          python3 .github/pr439-review.py green
          cargo fmt --all
          git diff --check
          for feature in fallback vec; do
            flags=()
            if [ "$feature" = vec ]; then flags=(--features sqlite-vec); fi
            for filter in hot_cache_refresh advanced::tests embedding_snapshot; do
              cargo test --no-default-features "${flags[@]}" --lib "$filter" 2>&1 | tee "/tmp/pr439-review/green-$feature-$filter.log"
            done
            cargo test --no-default-features "${flags[@]}" --test reembed_migration --test reembed_stale_runtime 2>&1 | tee "/tmp/pr439-review/green-$feature-runtime.log"
          done
      - name: Prove strengthened tests detect broken routing and late filters
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('/tmp/pr439-review')
          def require_failure(name, filter):
              result = subprocess.run(['cargo', 'test', '--no-default-features', '--lib', filter], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=600)
              (root / f'mutation-{name}.log').write_text(result.stdout)
              print(result.stdout)
              assert result.returncode == 101 and 'test result: FAILED' in result.stdout, name
          p = Path('src/memory_core/storage/sqlite/advanced.rs')
          original = p.read_text()
          condition = 'if intent == QueryIntent::Keyword || ctx.query.trim().is_empty() {'
          assert original.count(condition) == 1
          try:
              p.write_text(original.replace(condition, 'if false {'))
              require_failure('keyword-vector-work', 'keyword_dispatch_returns_fts_results')
              require_failure('blank-vector-work', 'blank_query_routes_to_fts_only')
              p.write_text(original.replace(condition, 'if true {'))
              require_failure('natural-language-fts-only', 'non_keyword_query_uses_full_pipeline')
          finally:
              p.write_text(original)
          p = Path('src/memory_core/storage/sqlite/pipeline/retrieval.rs')
          original = p.read_text()
          predicate = 'append_search_filters(&mut fts_sql, &mut fts_params, &mut param_idx, opts, "m.");'
          decoded = '                ) = row.context("failed to decode advanced FTS row")?;'
          assert original.count(predicate) == 1 and original.count(decoded) == 1
          mutated = original.replace(predicate, predicate.replace('opts,', '&SearchOptions::default(),'))
          mutated = mutated.replace(decoded, decoded + '\n                if opts.created_after.as_ref().is_some_and(|after| created_at.as_str() < after.as_str()) || opts.event_after.as_ref().is_some_and(|after| event_at.as_str() < after.as_str()) { continue; }')
          try:
              p.write_text(mutated)
              require_failure('fts-filter-after-limit', 'bounded_fts_candidates_preserve')
          finally:
              p.write_text(original)
          PY
      - name: Full engineering and retrieval gates
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/pr439-review/clippy.log
          cargo test --all-features 2>&1 | tee /tmp/pr439-review/all-features.log
          ./scripts/bench.sh --gate 2>&1 | tee /tmp/pr439-review/benchmark.log
      - name: Record review evidence and verify Cairn
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          export PATH="$HOME/.cargo/bin:$PATH"
          cairn status > /tmp/pr439-review/cairn-status.txt
          cairn next > /tmp/pr439-review/cairn-next.txt
          cairn bundle mag.runtime.memory.storage.sqlite > /tmp/pr439-review/cairn-bundle.txt
          cairn rationale mag.runtime.memory.storage.sqlite > /tmp/pr439-review/cairn-rationale.txt
          python3 - <<'PY'
          import os
          from pathlib import Path
          run = f"https://github.com/George-RD/mag/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          note = f'''\n## PR #439 review follow-up: 8 September 2026\n\nThe [review TDD run]({run}) requires runtime assertion failures for the hot-cache\nrefresh race and both deduplicated FTS fixtures in BLOB and sqlite-vec builds\nbefore applying the fix. Refresh now releases its old snapshot and reader before\nchecking the live generation; failures clear the cache. A private refresh callback\nprovides a deterministic interleaving without sleeps or global test hooks.\n\nExisting routing tests now count query embeddings: keyword and blank queries\nskip vector work, while natural-language queries perform it. FTS fixtures use 121\ndistinct rows and prove the desired match is outside the unfiltered 100-candidate\nlimit. Mutation checks deliberately break each routing branch and move date\nfiltering after LIMIT; the strengthened assertions must fail. All mutations are\nrestored before engineering gates. Migration and read joins have bounded timeouts.\n\nThe parallel-candidate review finding does not require a second generation token:\nConnPool already pins one immutable generation for both reader snapshots, fusion,\nand decomposition. The snapshot regression now also rejects a second reader after\nmigration while the original snapshot remains open. The final result/cache guard\nremains required; these guards provide a validation boundary, not a promise to\nprevent a migration immediately after validation. Stop/migrate/restart remains\nthe supported operational procedure.\n\nFocused tests in both storage configurations, the full all-feature suite, Rustfmt,\nstrict Clippy, and the repository retrieval benchmark pass before source publication.\nCairn scan/hooks follow this note. This is worktree evidence, not final-head CI.\nFinal cleaned-head CI and review disposition are recorded on PR #439. This direct\nself-review is not an independently executed slash-command /code-review. Artifacts\nhave 14-day retention; test names and repository commands remain durable.\n'''
          for path in ['meta/reviews/embedding-space-read-safety.md', 'meta/todos/implement-embedding-space-migration.md']:
              p = Path(path)
              p.write_text(p.read_text() + note)
          PY
          cairn scan 2>&1 | tee /tmp/pr439-review/cairn-scan.log
          cairn hook all 2>&1 | tee /tmp/pr439-review/cairn-hooks.log
      - name: Publish verified source without workflow changes
        run: |
          set -euo pipefail
          branch=agent/embedding-space-read-fence
          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'George'
          git config user.email '180932462+George-RD@users.noreply.github.com'
          git add src/memory_core/storage/sqlite/advanced_tests.rs src/memory_core/storage/sqlite/conn_pool.rs src/memory_core/storage/sqlite/hot_cache_mgmt.rs tests/reembed_stale_runtime.rs meta/reviews/embedding-space-read-safety.md meta/todos/implement-embedding-space-migration.md
          git diff --cached --check
          git commit -m 'fix(storage): revalidate hot cache refresh and strengthen read-fence tests'
          git rev-parse HEAD | tee /tmp/pr439-review/verified-sha.txt
          git archive HEAD | gzip > /tmp/pr439-review/source.tar.gz
          git push origin "HEAD:$branch"
      - name: Preserve readable patches and logs
        if: always()
        run: |
          mkdir -p /tmp/pr439-review
          git diff --binary > /tmp/pr439-review/worktree.patch
          git status --short > /tmp/pr439-review/worktree-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr439-review-evidence
          path: /tmp/pr439-review/
          retention-days: 14
