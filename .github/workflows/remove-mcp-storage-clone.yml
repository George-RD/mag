name: Remove redundant MCP storage clone

on:
  push:
    branches:
      - agent/migrate-mcp-manage-runtime
    paths:
      - .github/workflows/remove-mcp-storage-clone.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/migrate-mcp-manage-runtime
          fetch-depth: 0
      - name: Move storage into the single runtime owner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/mcp/mod.rs")
          text = path.read_text()
          old = "let runtime = Arc::new(LocalMemoryRuntime::from_storage(storage.clone()));"
          new = "let runtime = Arc::new(LocalMemoryRuntime::from_storage(storage));"
          if text.count(old) != 1:
              raise SystemExit("expected one redundant MCP storage clone")
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/remove-mcp-storage-clone.yml
      - name: Verify and commit cleanup
        run: |
          git diff --check
          test ! -e .github/workflows/remove-mcp-storage-clone.yml
          ! grep -F "LocalMemoryRuntime::from_storage(storage.clone())" src/mcp/mod.rs
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(mcp): move storage into the runtime"
          git push origin HEAD:${GITHUB_REF_NAME}
