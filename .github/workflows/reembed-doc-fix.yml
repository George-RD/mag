name: Apply re-embed CLI doc fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/embedding-space-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fix CLI helper documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/cli.rs')
          text = path.read_text()
          old = '''/// The main CLI entry point for MAG.
          fn parse_positive_usize'''
          new = '''/// Parses a strictly positive batch size for bounded CLI work.
          fn parse_positive_usize'''
          if old not in text:
              raise SystemExit('parser documentation marker not found')
          text = text.replace(old, new, 1)
          marker = '''
          #[derive(Parser)]
          #[command(name = "mag", version)]'''
          replacement = '''
          /// The main CLI entry point for MAG.
          #[derive(Parser)]
          #[command(name = "mag", version)]'''
          if marker not in text:
              raise SystemExit('Cli documentation insertion marker not found')
          path.write_text(text.replace(marker, replacement, 1))
          PY
          cargo fmt -- src/cli.rs
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "George"
          git config user.email "180932462+George-RD@users.noreply.github.com"
          git add src/cli.rs
          git commit -m "docs(cli): keep re-embed parser docs accurate"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
