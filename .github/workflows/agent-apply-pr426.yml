name: Apply PR 426 implementation

on:
  push:
    branches:
      - agent/mcp-new-integrations-minimal

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Apply focused implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("src/config_writer.rs")
          source = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              source = source.replace(old, new, 1)

          def replace_in_region(
              start_marker: str,
              end_marker: str,
              old: str,
              new: str,
              label: str,
          ) -> None:
              global source
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              region = source[start:end]
              count = region.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              source = source[:start] + region.replace(old, new, 1) + source[end:]

          replace_once(
              '/// Command transport: `{ "command": "/abs/path/to/mag", "args": ["serve"] }`',
              '/// Command transport: `{ "command": "/abs/path/to/mag", "args": ["serve", "--mcp-tools", "minimal"] }`',
              "command transport documentation",
          )
          replace_in_region(
              "pub fn build_mag_entry(",
              "// ---------------------------------------------------------------------------\n// Claude Code plugin",
              '"args": ["serve"]',
              '"args": ["serve", "--mcp-tools", "minimal"]',
              "JSON command entry",
          )
          replace_in_region(
              "fn verify_toml_config(",
              "// ---------------------------------------------------------------------------\n// TOML write / remove",
              r'content.contains("args = [\"serve\"]")',
              r'content.contains("args = [\"serve\", \"--mcp-tools\", \"minimal\"]")',
              "TOML command verification",
          )
          replace_in_region(
              "fn build_mag_toml_block(",
              "/// Returns `(start, end)` byte indices",
              r'args = [\"serve\"]',
              r'args = [\"serve\", \"--mcp-tools\", \"minimal\"]',
              "TOML command block",
          )
          replace_in_region(
              "fn build_command_entry()",
              "fn build_stdio_entry()",
              'serde_json::json!(["serve"])',
              'serde_json::json!(["serve", "--mcp-tools", "minimal"])',
              "command entry unit expectation",
          )
          replace_in_region(
              "fn write_then_read_preserves_entry()",
              "fn existing_servers_preserved_after_write()",
              'serde_json::json!(["serve"])',
              'serde_json::json!(["serve", "--mcp-tools", "minimal"])',
              "written command unit expectation",
          )
          replace_in_region(
              "fn codex_write_creates_toml_config()",
              "fn codex_write_is_idempotent()",
              r'content.contains("args = [\"serve\"]")',
              r'content.contains("args = [\"serve\", \"--mcp-tools\", \"minimal\"]")',
              "Codex command unit expectation",
          )

          path.write_text(source)

          Path("plugin/.mcp.json").write_text(
              dedent(
                  '''\
                  {
                    "mcpServers": {
                      "mag": {
                        "command": "mag",
                        "args": ["serve", "--mcp-tools", "minimal"]
                      }
                    }
                  }
                  '''
              )
          )

          Path("tests/mcp_setup_contract.rs").write_text(
              dedent(
                  '''\
                  use serde_json::json;

                  #[test]
                  fn generated_command_transport_prefers_minimal_mcp_surface() {
                      let source = include_str!("../src/config_writer.rs");

                      assert!(
                          source.contains(r#""args": ["serve", "--mcp-tools", "minimal"]"#),
                          "new command-transport configs must explicitly request MAG's four-tool minimal MCP surface"
                      );
                  }

                  #[test]
                  fn claude_plugin_manifest_prefers_minimal_mcp_surface() {
                      let manifest: serde_json::Value = serde_json::from_str(include_str!(
                          "../plugin/.mcp.json"
                      ))
                      .expect("valid plugin manifest");

                      assert_eq!(
                          manifest["mcpServers"]["mag"]["args"],
                          json!(["serve", "--mcp-tools", "minimal"])
                      );
                  }
                  '''
              )
          )
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --quiet --all-features --test mcp_setup_contract
          cargo test --quiet --all-features config_writer
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No implementation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config_writer.rs plugin/.mcp.json tests/mcp_setup_contract.rs
          git commit -m "refactor(setup): generate minimal MCP command configs"
          git push origin HEAD:${{ github.ref_name }}
