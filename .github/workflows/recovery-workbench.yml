name: Recovery workbench
on:
  push:
    branches: [agent/recovery-workbench-20260910]
permissions:
  contents: read
jobs:
  prepare-demo-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Publish bounded source-only review fixes to staging
        run: |
          set -euo pipefail
          cp .recovery/fix-demo.py "$RUNNER_TEMP/fix-demo.py"
          cp .recovery/test-demo.py "$RUNNER_TEMP/test-demo.py"
          git checkout --detach e03e6db77ba4522fa90b7a5fd5f8e0fd6f78c96e
          python3 "$RUNNER_TEMP/fix-demo.py"
          cp "$RUNNER_TEMP/test-demo.py" tests/test_demo_player_lifecycle.py
          git add site/assets/demo-player.js site/demos/cross-tool-handoff.html tests/test_site_demos.py tests/test_demo_player_lifecycle.py meta/reviews/claude-branch-recovery.md
          test "$(git write-tree)" = 377ab4e6b0c2ad7831396f99059f021019483a5b
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          python3 scripts/validate_site.py
          python3 -m unittest tests.test_validate_site tests.test_demo_observation -v
          git config user.name 'George'
          git config user.email '180932462+George-RD@users.noreply.github.com'
          git commit -m 'fix(site): restore suspended playback and correct token dedup explanation'
          git push origin HEAD:refs/heads/agent/recovery-demo-reviewed
          echo "Published $(git rev-parse HEAD) tree $(git rev-parse HEAD^{tree})"
