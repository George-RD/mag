name: Recovery workbench
on:
  push:
    branches: [agent/recovery-workbench-20260910]
permissions:
  contents: read
jobs:
  verify-runtime-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bc48e69f0a39a53e602de801632023251b971f13
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Fix the observed split-module import error
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-recovery"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('benches/runtime_behaviour/families/supersession.rs')
          s = p.read_text()
          old = 'use super::{FamilyOutcome, SeededGroup};'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'use super::{FamilyOutcome, SeededGroup, stored_ids};'))
          PY
          cargo fmt --all
          git add benches/runtime_behaviour/families/supersession.rs
          test -z "$(git diff --name-only)"
          git diff --cached --check
          git config user.name 'George'
          git config user.email '180932462+George-RD@users.noreply.github.com'
          git commit -m 'fix(eval): import shared stored-row helper after family split'
          git branch recovered-runtime
          git bundle create "$RUNNER_TEMP/runtime-recovery/source.bundle" recovered-runtime
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; rustc --version; } > "$RUNNER_TEMP/runtime-recovery/source.txt"
          git push origin HEAD:refs/heads/agent/recovery-runtime-built
      - name: Run feature-free process and unit regressions
        run: cargo test --locked --no-default-features --bin memory_runtime_eval --test runtime_behaviour_eval
      - name: Verify shared production profile and strict lint
        run: |
          cargo test --locked --bin memory_runtime_eval --test runtime_behaviour_eval
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Record one production-shaped BGE diagnostic
        env:
          MAG_DATA_ROOT: ${{ runner.temp }}/runtime-recovery/data
          RUST_LOG: warn
        run: |
          set -euo pipefail
          cargo build --locked --release --bin memory_runtime_eval
          cp target/release/memory_runtime_eval "$RUNNER_TEMP/runtime-recovery/memory_runtime_eval"
          target/release/memory_runtime_eval --json > "$RUNNER_TEMP/runtime-recovery/bge.json" 2> "$RUNNER_TEMP/runtime-recovery/bge.stderr"
          sha256sum "$RUNNER_TEMP/runtime-recovery/memory_runtime_eval" "$RUNNER_TEMP/runtime-recovery/bge.json" > "$RUNNER_TEMP/runtime-recovery/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-recovery-verification
          path: ${{ runner.temp }}/runtime-recovery/
          if-no-files-found: error
          retention-days: 7
