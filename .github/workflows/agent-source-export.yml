name: Agent source export

on:
  push:
    branches:
      - dependabot/cargo/rmcp-3.1.0
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Archive exact branch source
        run: tar --exclude=.git --exclude=target -czf /tmp/mag-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: mag-source-${{ github.sha }}
          path: /tmp/mag-source.tar.gz
          if-no-files-found: error
          retention-days: 1
