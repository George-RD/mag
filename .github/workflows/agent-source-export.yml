name: Agent source export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source tree
        run: |
          tar \
            --exclude=.git \
            --exclude=target \
            --exclude='.cairn/cache' \
            -czf mag-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: mag-source-${{ github.event.pull_request.head.sha }}
          path: mag-source.tar.gz
          if-no-files-found: error
          retention-days: 1
