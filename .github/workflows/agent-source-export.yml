          git apply /tmp/rmcp-migration.patch
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(Path("tests").glob("mcp*.rs"))
          calls = sum(path.read_text().count("tool_request(") for path in files)
          literals = sum(path.read_text().count("CallToolRequestParams {") for path in files)
          modules = sum(path.read_text().count("mod mcp_support;") for path in files)
          assert calls == 81, calls
          assert literals == 0, literals
          assert modules == 8, modules
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Lint
        run: cargo clippy --quiet --all-targets --all-features -- -D warnings -A clippy::manual_filter

      - name: Test
        run: cargo test --quiet --all-features

      - name: Smoke test
        run: bash scripts/smoke-test.sh

      - name: Archive verified source
        shell: bash
        run: |
          rm .github/workflows/agent-source-export.yml
          tar --exclude=.git --exclude=target -czf /tmp/mag-verified-source.tar.gz .

      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: mag-rmcp-verified-${{ github.sha }}
          path: /tmp/mag-verified-source.tar.gz
          if-no-files-found: error
          retention-days: 1
