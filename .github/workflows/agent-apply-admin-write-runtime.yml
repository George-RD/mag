name: Apply admin write runtime migration

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: agent-admin-write-runtime-migration
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/migrate-cli-admin-write-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Apply runtime routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "src/local_memory_runtime.rs",
              "Deleter, Embedder, GraphNode,\n    GraphTraverser",
              "Deleter, Embedder, ExpirationSweeper, FeedbackRecorder, GraphNode,\n    GraphTraverser",
          )

          replace_once(
              "src/local_memory_runtime.rs",
              """    /// Returns memory counts by event type without changing aggregate fields.
          """,
              """    /// Imports a complete local store without changing counts or mutation semantics.
              pub async fn import_all(&self, data: &str) -> Result<(usize, usize)> {
                  self.storage.import_all(data).await
              }

              /// Records feedback without changing scoring or review-flag semantics.
              pub async fn record_feedback(
                  &self,
                  memory_id: &str,
                  rating: &str,
                  reason: Option<&str>,
              ) -> Result<serde_json::Value> {
                  self.storage
                      .record_feedback(memory_id, rating, reason)
                      .await
              }

              /// Removes expired memories without changing relationship cleanup semantics.
              pub async fn sweep_expired(&self) -> Result<usize> {
                  self.storage.sweep_expired().await
              }

              /// Returns memory counts by event type without changing aggregate fields.
          """,
          )

          replace_once(
              "src/main.rs",
              """    BackupManager, CheckpointInput, Embedder, EventType, ExpirationSweeper, FeedbackRecorder,
              MaintenanceManager, MemoryInput, MemoryUpdate, SearchOptions, WelcomeOptions,
          """,
              """    BackupManager, CheckpointInput, Embedder, EventType, MaintenanceManager, MemoryInput,
              MemoryUpdate, SearchOptions, WelcomeOptions,
          """,
          )

          replace_once(
              "src/main.rs",
              """            let (memories, relationships) = mcp_storage.import_all(&data).await?;
                  info!(
                      imported_memories = memories,
                      imported_relationships = relationships,
                      "Import completed"
                  );
          """,
              """            let (memories, relationships) = local_runtime.import_all(&data).await?;
                  info!(
                      imported_memories = memories,
                      imported_relationships = relationships,
                      "Import completed through local memory runtime"
                  );
          """,
          )

          replace_once(
              "src/main.rs",
              """            let result = <SqliteStorage as FeedbackRecorder>::record_feedback(
                      &mcp_storage,
                      memory_id,
                      rating.as_str(),
                      reason.as_deref(),
                  )
                  .await?;
                  println!("{}", result);
              }
              Commands::Sweep => {
                  let swept_count =
                      <SqliteStorage as ExpirationSweeper>::sweep_expired(&mcp_storage).await?;
                  println!("{}", json!({ "swept_count": swept_count }));
              }
          """,
              """            let result = local_runtime
                      .record_feedback(memory_id, rating.as_str(), reason.as_deref())
                      .await?;
                  info!(
                      memory_id = %memory_id,
                      rating = rating.as_str(),
                      "Feedback recorded through local memory runtime"
                  );
                  println!("{}", result);
              }
              Commands::Sweep => {
                  let swept_count = local_runtime.sweep_expired().await?;
                  info!(
                      swept_count,
                      "Expiration sweep completed through local memory runtime"
                  );
                  println!("{}", json!({ "swept_count": swept_count }));
              }
          """,
          )

          replace_once(
              "meta/todos/migrate-cli-to-local-memory-runtime.md",
              """- [ ] Migrate write-capable administration commands (`import`, `feedback`,
            `sweep`, and `maintain`) as a separate risk-bounded family.
          """,
              """- [x] `import`, `feedback`, and `sweep` route through `LocalMemoryRuntime`;
            import counts and state, feedback scoring and review flags, expiration cleanup,
            exact compact JSON, relationship cleanup, profile preservation, and direct-storage
            parity remain pinned.
          - [ ] Migrate `maintain` actions as a separate risk-bounded family.
          """,
          )
          PY
      - name: Format and reconcile
        run: |
          cargo fmt --all
          cairn scan
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/agent-apply-admin-write-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(cli): route admin writes through local runtime"
          git push origin HEAD:agent/migrate-cli-admin-write-runtime
