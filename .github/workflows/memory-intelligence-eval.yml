name: Memory intelligence evaluation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  recorded-output-evaluation:
    name: Capture and scoring (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test producer capture, scoring and provenance
        run: python -m unittest discover -s tests -p 'test_memory_intelligence_*.py' -v
      - name: Validate the versioned development dataset
        run: python benches/memory_intelligence/evaluate.py validate benches/memory_intelligence/dataset.v1.json
