name: Memory intelligence evaluation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  recorded-output-evaluation:
    name: Capture and scoring (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test producer capture, scoring and provenance
        run: python -m unittest discover -s tests -p 'test_memory_intelligence_*.py' -v
      - name: Validate the versioned development dataset
        run: python benches/memory_intelligence/evaluate.py validate benches/memory_intelligence/dataset.v1.json

  producer-cli-build:
    name: Opt-in producer (release, llm)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: memory-intelligence-producer
      - name: Test the documented feature profile, not all-features
        run: cargo test --locked --release --features llm --test memory_intelligence_producer_cli --test memory_intelligence_producer_runtime --test memory_intelligence_schema
      - name: Smoke-test configured profile without a model
        run: |
          set -euo pipefail
          ./target/release/mag intelligence-produce --describe > "$RUNNER_TEMP/producer-profile.json"
          python3 - "$RUNNER_TEMP/producer-profile.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          description = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert description["model_profile"]["verification"] == "configured_not_authenticated"
          assert description["model_profile"]["revision"] is None
          assert description["embedding_space_identity"] is None
          PY
      - name: Inspect actual CLI HTTP requests without running a model
        run: |
          set -euo pipefail
          export MAG_DIAGNOSTIC_BINARY="$PWD/target/release/mag"
          MAG_DIAGNOSTIC_REVISION="$(git rev-parse HEAD)"
          export MAG_DIAGNOSTIC_REVISION
          export MAG_DIAGNOSTIC_OUTPUT="$RUNNER_TEMP/intelligence-request-diagnostic.json"
          python3 -m unittest discover -s tests -p test_memory_intelligence_request_diagnostic.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: memory-intelligence-request-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/intelligence-request-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
