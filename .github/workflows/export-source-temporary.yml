name: Recover PR 435 source temporarily

on:
  push:
    branches:
      - agent/complete-embedding-space-migration
    paths:
      - '.github/workflows/export-source-temporary.yml'

permissions:
  contents: read

jobs:
  recover-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Recover checksum-verified implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pr435-patch.part-* | tr -d '\r\n' > /tmp/pr435.patch.gz.b64
          test "$(wc -c < /tmp/pr435.patch.gz.b64)" -eq 12452
          echo "364bc7979a7b8bf31f54ce6f464b0d5e7c83eab7a066bb87df878f150a15c733  /tmp/pr435.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/pr435.patch.gz.b64 | gzip --decompress > /tmp/pr435.patch
          echo "dcedb2d65ecb55b7b37c156b56447af3e2b92685f4782e221d4227e0d8eb1743  /tmp/pr435.patch" | sha256sum --check
          git apply --check /tmp/pr435.patch
          git apply /tmp/pr435.patch
          git diff --stat
          git ls-files --cached --others --exclude-standard -z > /tmp/pr435-source-files
          tar --null -T /tmp/pr435-source-files -czf /tmp/pr435-source.tar.gz
          test "$(stat -c %s /tmp/pr435-source.tar.gz)" -lt 104857600

      - name: Export source only, without build cache or credentials
        uses: actions/upload-artifact@v4
        with:
          name: pr435-source-only-${{ github.sha }}
          path: |
            /tmp/pr435-source.tar.gz
            /tmp/pr435.patch
          if-no-files-found: error
          retention-days: 7
