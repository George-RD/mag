name: Apply and verify PR 435 temporarily

on:
  push:
    branches: [agent/complete-embedding-space-migration]
    paths: ['.github/workflows/export-source-temporary.yml']

permissions:
  contents: write

concurrency:
  group: pr435-implementation
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Confirm original regression is red
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr435-evidence
          if cargo test --quiet --no-default-features --test reembed_stale_runtime > /tmp/pr435-evidence/original-red.log 2>&1; then
            cat /tmp/pr435-evidence/original-red.log
            echo 'Expected stale-runtime regression to fail before implementation'
            exit 1
          fi
          grep -q 'a runtime opened on the source space must be invalid after migration' /tmp/pr435-evidence/original-red.log
      - name: Apply checksum-verified implementation and review regression
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pr435-patch.part-* | tr -d '\r\n' > /tmp/pr435.patch.gz.b64
          echo '364bc7979a7b8bf31f54ce6f464b0d5e7c83eab7a066bb87df878f150a15c733  /tmp/pr435.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/pr435.patch.gz.b64 | gzip --decompress > /tmp/pr435.patch
          echo 'dcedb2d65ecb55b7b37c156b56447af3e2b92685f4782e221d4227e0d8eb1743  /tmp/pr435.patch' | sha256sum --check
          git apply --check /tmp/pr435.patch
          git apply /tmp/pr435.patch
          cat > tests/reembed_profile_identity.rs <<'RUST'
          #![cfg(feature = "real-embeddings")]
          use std::sync::Arc;
          use anyhow::Result;
          use mag::memory_core::OnnxEmbedder;
          use mag::memory_core::embedding_model::bge_small_en_v1_5_embedding_model;
          #[test]
          fn custom_same_dimension_model_cannot_claim_the_pinned_bge_identity() -> Result<()> {
              let custom = OnnxEmbedder::with_model(
                  "custom-384", "https://example.invalid/model.onnx",
                  "https://example.invalid/tokenizer.json", 384, "last_hidden_state",
              )?;
              let result = bge_small_en_v1_5_embedding_model(Arc::new(custom));
              let error = result.err().expect("unverified custom model must not claim BGE identity");
              assert!(error.to_string().contains("pinned BGE"), "{error:#}");
              Ok(())
          }
          #[test]
          fn default_model_can_claim_the_pinned_bge_identity_without_loading_artifacts() -> Result<()> {
              let model = bge_small_en_v1_5_embedding_model(Arc::new(OnnxEmbedder::new()?))?;
              let profile = model.model_profile().expect("default model has a pinned profile");
              assert_eq!(profile.embedding_space_identity(), model.embedding_space_identity());
              Ok(())
          }
          RUST
      - name: Confirm custom-model identity regression is red
        shell: bash
        run: |
          set -euo pipefail
          if cargo test --quiet --test reembed_profile_identity > /tmp/pr435-evidence/profile-red.log 2>&1; then
            cat /tmp/pr435-evidence/profile-red.log
            echo 'Expected unverified custom-model identity regression to fail'
            exit 1
          fi
          grep -q 'unverified custom model must not claim BGE identity' /tmp/pr435-evidence/profile-red.log
      - name: Apply profile guard and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/memory_core/embedder.rs')
          s = p.read_text()
          old = '#[derive(Debug, Clone, Copy)]\nstruct ModelArtifactChecksums'
          assert s.count(old) == 1
          s = s.replace(old, '#[derive(Debug, Clone, Copy, PartialEq, Eq)]\nstruct ModelArtifactChecksums')
          old = '    pub fn with_model(\n'
          assert s.count(old) == 1
          s = s.replace(old, '''    /// Custom constructors must not acquire BGE identity just by matching dimensions.
              pub(super) fn uses_pinned_bge_artifacts(&self) -> bool {
                  self.artifact_checksums == Some(DEFAULT_MODEL_CHECKSUMS)
              }

          ''' + old)
          p.write_text(s)
          p = Path('src/memory_core/embedding_model.rs')
          s = p.read_text()
          old = '    let embedder: Arc<dyn Embedder> = embedder;'
          assert s.count(old) == 1
          s = s.replace(old, '''    ensure!(
                  embedder.uses_pinned_bge_artifacts(),
                  "pinned BGE profile requires the default checksum-verified model; custom ONNX models need their own profile"
              );
          ''' + old)
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Verify implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo test --quiet --all-features 2>&1 | tee /tmp/pr435-evidence/tests.log
          cargo test --quiet --no-default-features --test reembed_migration --test reembed_stale_runtime 2>&1 | tee /tmp/pr435-evidence/minimal-tests.log
          cargo clippy --quiet --all-targets --all-features -- -D warnings -A clippy::manual_filter 2>&1 | tee /tmp/pr435-evidence/clippy.log
          cargo fmt --all -- --check
      - name: Commit actual implementation to the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/complete-embedding-space-migration
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git diff --cached --stat | tee /tmp/pr435-evidence/diff-stat.txt
          git commit -m 'fix: enforce embedding-space writes and verified CLI profile'
          git push origin HEAD:agent/complete-embedding-space-migration
          git rev-parse HEAD | tee /tmp/pr435-evidence/implementation-sha.txt
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr435-implementation-evidence-${{ github.sha }}
          path: /tmp/pr435-evidence
          if-no-files-found: error
          retention-days: 7
