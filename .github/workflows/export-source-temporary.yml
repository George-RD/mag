name: Verify and rewrite PR 435 temporarily

on:
  push:
    branches:
      - agent/complete-embedding-space-migration

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-and-rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/pr435-implementation.patch.gz.b64 | gzip --decompress > /tmp/pr435.patch
          git apply --check /tmp/pr435.patch
          git apply /tmp/pr435.patch

      - name: Format and verify implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --quiet --all-targets --all-features -- -D warnings -A clippy::manual_filter
          cargo test --quiet --all-features
          cargo test --quiet --no-default-features --test reembed_migration reembed_refuses_existing_vector_index_without_sqlite_vec_support

      - name: Upload formatted source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr435-formatted-source-${{ github.sha }}
          path: .
          include-hidden-files: true

      - name: Rewrite PR branch with verified implementation
        shell: bash
        run: |
          set -euo pipefail
          tar -cf /tmp/pr435-files.tar \
            src/local_memory_runtime.rs \
            src/main.rs \
            src/memory_core/embedder.rs \
            src/memory_core/embedding_model.rs \
            src/memory_core/storage/sqlite/crud.rs \
            src/memory_core/storage/sqlite/migration.rs \
            src/memory_core/storage/sqlite/schema.rs \
            tests/reembed_cli_profile.rs \
            tests/reembed_stale_runtime.rs
          git reset --hard 12ab3a81dafa61f01bc654b5c3f5592fd5dabaa9
          git clean -fdx
          tar -xf /tmp/pr435-files.tar
          git add \
            src/local_memory_runtime.rs \
            src/main.rs \
            src/memory_core/embedder.rs \
            src/memory_core/embedding_model.rs \
            src/memory_core/storage/sqlite/crud.rs \
            src/memory_core/storage/sqlite/migration.rs \
            src/memory_core/storage/sqlite/schema.rs \
            tests/reembed_cli_profile.rs \
            tests/reembed_stale_runtime.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: fence embedding-space writes and profile CLI"
          git rev-parse HEAD | tee /tmp/pr435-final-sha.txt
          git push --force origin HEAD:refs/heads/agent/complete-embedding-space-migration

      - name: Upload rewritten commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: pr435-final-sha-${{ github.sha }}
          path: /tmp/pr435-final-sha.txt
