name: Apply and verify PR 435 temporarily

on:
  push:
    branches: [agent/complete-embedding-space-migration]
    paths: ['.github/workflows/export-source-temporary.yml']

permissions:
  contents: write

concurrency:
  group: pr435-implementation
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply implementation and review fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr435-evidence
          # Both RED proofs and the all-features GREEN are preserved in run 34024534055.
          cat .github/pr435-patch.part-* | tr -d '\r\n' > /tmp/pr435.patch.gz.b64
          echo '364bc7979a7b8bf31f54ce6f464b0d5e7c83eab7a066bb87df878f150a15c733  /tmp/pr435.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/pr435.patch.gz.b64 | gzip --decompress > /tmp/pr435.patch
          echo 'dcedb2d65ecb55b7b37c156b56447af3e2b92685f4782e221d4227e0d8eb1743  /tmp/pr435.patch' | sha256sum --check
          git apply --check /tmp/pr435.patch
          git apply /tmp/pr435.patch
          cat > tests/reembed_profile_identity.rs <<'RUST'
          #![cfg(feature = "real-embeddings")]
          use std::sync::Arc;
          use anyhow::Result;
          use mag::memory_core::OnnxEmbedder;
          use mag::memory_core::embedding_model::bge_small_en_v1_5_embedding_model;
          #[test]
          fn custom_same_dimension_model_cannot_claim_the_pinned_bge_identity() -> Result<()> {
              let custom = OnnxEmbedder::with_model(
                  "custom-384", "https://example.invalid/model.onnx",
                  "https://example.invalid/tokenizer.json", 384, "last_hidden_state",
              )?;
              let result = bge_small_en_v1_5_embedding_model(Arc::new(custom));
              let error = result.err().expect("unverified custom model must not claim BGE identity");
              assert!(error.to_string().contains("pinned BGE"), "{error:#}");
              Ok(())
          }
          #[test]
          fn default_model_can_claim_the_pinned_bge_identity_without_loading_artifacts() -> Result<()> {
              let model = bge_small_en_v1_5_embedding_model(Arc::new(OnnxEmbedder::new()?))?;
              let profile = model.model_profile().expect("default model has a pinned profile");
              assert_eq!(profile.embedding_space_identity(), model.embedding_space_identity());
              Ok(())
          }
          RUST
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, (path, old, s.count(old))
              p.write_text(s.replace(old, new))
          replace_once('src/memory_core/embedder.rs',
              '#[derive(Debug, Clone, Copy)]\nstruct ModelArtifactChecksums',
              '#[derive(Debug, Clone, Copy, PartialEq, Eq)]\nstruct ModelArtifactChecksums')
          replace_once('src/memory_core/embedder.rs', '    pub fn with_model(\n',
              '''    /// Custom constructors must not acquire BGE identity just by matching dimensions.
              pub(super) fn uses_pinned_bge_artifacts(&self) -> bool {
                  self.artifact_checksums == Some(DEFAULT_MODEL_CHECKSUMS)
              }

              pub fn with_model(
          ''')
          replace_once('src/memory_core/embedding_model.rs', '    let embedder: Arc<dyn Embedder> = embedder;',
              '''    ensure!(
                  embedder.uses_pinned_bge_artifacts(),
                  "pinned BGE profile requires the default checksum-verified model; custom ONNX models need their own profile"
              );
              let embedder: Arc<dyn Embedder> = embedder;''')
          for declaration in ('struct ProfiledEmbedderAdapter {', 'impl ProfiledEmbedderAdapter {',
                              'impl EmbeddingModel for ProfiledEmbedderAdapter {'):
              replace_once('src/memory_core/embedding_model.rs', declaration,
                  '#[cfg(any(feature = "real-embeddings", test))]\n' + declaration)
          replace_once('src/main.rs',
              'use mag::memory_core::storage::{InitMode, ReembedOptions, SqliteStorage};',
              '#[cfg(feature = "real-embeddings")]\nuse mag::memory_core::storage::ReembedOptions;\nuse mag::memory_core::storage::{InitMode, SqliteStorage};')
          replace_once('tests/reembed_cli_profile.rs', '.env("USERPROFILE", home)',
              '.env("USERPROFILE", home)\n        .env("MAG_DATA_ROOT", home.join(".mag"))')
          PY
          cargo fmt --all
      - name: Verify regression and minimal-feature builds
        shell: bash
        run: |
          set -euo pipefail
          cargo test --quiet --all-features --test reembed_migration --test reembed_stale_runtime --test reembed_cli_profile --test reembed_profile_identity 2>&1 | tee /tmp/pr435-evidence/regressions.log
          cargo test --quiet --no-default-features --test reembed_migration --test reembed_stale_runtime 2>&1 | tee /tmp/pr435-evidence/minimal-tests.log
          cargo fmt --all -- --check
      - name: Commit actual source to the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/complete-embedding-space-migration
          test "$(git rev-parse FETCH_HEAD)" = '${{ github.sha }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git diff --cached --stat | tee /tmp/pr435-evidence/diff-stat.txt
          git commit -m 'fix: enforce embedding-space writes and verified CLI profile'
          git push origin HEAD:agent/complete-embedding-space-migration
          git rev-parse HEAD | tee /tmp/pr435-evidence/implementation-sha.txt
      - name: Verify strict lint and full suite
        shell: bash
        run: |
          set -uo pipefail
          cargo clippy --quiet --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/pr435-evidence/clippy.log
          lint_status=${PIPESTATUS[0]}
          cargo test --quiet --all-features 2>&1 | tee /tmp/pr435-evidence/tests.log
          test_status=${PIPESTATUS[0]}
          test "$lint_status" -eq 0 && test "$test_status" -eq 0
      - name: Verify Cairn
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          export PATH="$HOME/.cargo/bin:$PATH"
          cairn scan 2>&1 | tee /tmp/pr435-evidence/cairn-scan.log
          cairn hook all 2>&1 | tee /tmp/pr435-evidence/cairn-hook.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr435-implementation-evidence-${{ github.sha }}
          path: /tmp/pr435-evidence
          if-no-files-found: error
          retention-days: 7
