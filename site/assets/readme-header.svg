<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">MAG. Switch AI tools. Keep the context.</title>
  <desc id="desc">A dark navy engineering ledger showing several AI tools connected to one local MAG memory database.</desc>
  <rect width="1600" height="500" fill="#0B1B35"/>
  <rect x="0" y="0" width="32" height="500" fill="#165DFF"/>
  <rect x="32" y="0" width="10" height="500" fill="#FFB703"/>
  <path d="M82 72H1518M82 428H1518" stroke="#50617C" stroke-width="2"/>
  <path d="M1002 72V428" stroke="#50617C" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="92" y="202" fill="#FFFFFF" font-size="148" font-weight="900" letter-spacing="6">MAG</text>
    <text x="96" y="276" fill="#C9D7EB" font-size="34" font-weight="700">Switch AI tools.</text>
    <text x="96" y="330" fill="#FFB703" font-size="48" font-weight="900">Keep the context.</text>
    <text x="98" y="382" fill="#9FB1CB" font-size="21">One shared local memory for MCP clients.</text>

    <g transform="translate(1050 125)">
      <rect width="468" height="303" fill="#F8FAFC"/>
      <rect width="468" height="64" fill="#165DFF"/>
      <text x="22" y="39" fill="#FFFFFF" font-size="19" font-weight="800">~/.mag/memory.db</text>
      <rect x="349" y="17" width="92" height="30" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="369" y="38" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="700">LOCAL</text>

      <g font-family="monospace" font-size="13">
        <text x="24" y="103" fill="#0B41BD" font-weight="700">decision</text>
        <text x="132" y="103" fill="#0B1B35">Retries use backoff with jitter.</text>
        <line x1="22" y1="122" x2="446" y2="122" stroke="#BAC8D8"/>
        <text x="24" y="155" fill="#0B41BD" font-weight="700">bugfix</text>
        <text x="132" y="155" fill="#0B1B35">Cancelled task leaked a socket.</text>
        <line x1="22" y1="174" x2="446" y2="174" stroke="#BAC8D8"/>
        <text x="24" y="207" fill="#0B41BD" font-weight="700">handoff</text>
        <text x="132" y="207" fill="#0B1B35">Verify migration against fixtures.</text>
      </g>

      <rect x="0" y="238" width="468" height="65" fill="#0B1B35"/>
      <text x="22" y="265" fill="#9FB1CB" font-family="monospace" font-size="12">query</text>
      <text x="88" y="265" fill="#FFFFFF" font-family="monospace" font-size="13">How should retries work?</text>
      <text x="22" y="290" fill="#9FB1CB" font-family="monospace" font-size="12">match</text>
      <text x="88" y="290" fill="#FFB703" font-family="monospace" font-size="13">backoff with jitter  0.94</text>
    </g>

    <g transform="translate(1008 78)" font-family="monospace" font-size="12" font-weight="700">
      <rect x="-8" y="-7" width="136" height="34" fill="#0B41BD" stroke="#FFFFFF"/>
      <text x="9" y="14" fill="#FFFFFF">CLAUDE CODE</text>
      <rect x="142" y="-7" width="102" height="34" fill="#0B41BD" stroke="#FFFFFF"/>
      <text x="166" y="14" fill="#FFFFFF">CURSOR</text>
      <rect x="258" y="-7" width="102" height="34" fill="#0B41BD" stroke="#FFFFFF"/>
      <text x="283" y="14" fill="#FFFFFF">CODEX</text>
      <rect x="374" y="-7" width="136" height="34" fill="#0B41BD" stroke="#FFFFFF"/>
      <text x="390" y="14" fill="#FFFFFF">ANY MCP CLIENT</text>
    </g>

    <text x="1390" y="466" fill="#ED5B2A" font-family="monospace" font-size="15" font-weight="800">EARLY ALPHA</text>
  </g>
</svg>
